/* ---- 法师塔：占卜（随机运势，真的影响挖矿/钓鱼）---- */
function luckBonus(){
  let b = 0;
  if(GAME.luck && GAME.luck.day === GAME.day && GAME.luck.season === GAME.season) b = GAME.luck.bonus || 0;
  if(GAME.ring === 'luck') b += 0.20;            /* 幸运戒指 */
  return b;
}
function doDivine(){
  const sameDay = (GAME.divinedDay === GAME.day && GAME.divinedSeason === GAME.season);
  if(sameDay){ toast('今天已经占过了 · 明天再来'); return; }
  GAME.divinedDay = GAME.day; GAME.divinedSeason = GAME.season;
  const w = [[FORTUNES[0],8],[FORTUNES[1],20],[FORTUNES[2],32],[FORTUNES[3],30],[FORTUNES[4],10]];
  const total = w.reduce((a,b)=>a+b[1],0);
  let r = Math.random()*total, pick = FORTUNES[3];
  for(const [f, ww] of w){ r -= ww; if(r <= 0){ pick = f; break; } }
  GAME.luck = { day:GAME.day, season:GAME.season, name:pick.name, bonus:pick.bonus };
  const pct = Math.round(pick.bonus * 100);
  sfx.open();
  showFx('占卜中…', '', 950);                       /* 先转一圈 */
  setTimeout(()=>{
    sfx.levelUp();
    showFx(pick.name + '　' + pick.text, pick.bonus > 0 ? 'good' : 'bad', 1900);
    toast('占卜　' + pick.name + '　' + pick.text +
          (pct ? '（挖矿 / 钓鱼 ' + (pct > 0 ? '+' : '') + pct + '%）' : ''), 3600);
  }, 950);
  saveGame();
}

/* ---- 铁匠铺：收矿石（比出货箱多两成，立刻到账）---- */
function openSmithShop(){
  const items = [];
  const list = Object.keys(ORES).filter(k => ((GAME.ores||{})[k]||0) > 0);
  if(!list.length){
    items.push({ head:'铁匠正忙着打铁' });
    items.push({ name:'（你背包里没有矿石）', desc:'去山上矿洞挖点回来', price:0, icon:'i-hoe', bulk:false, off:true });
    items.push({ head:'武器' });
    for(let i = 1; i < WEAPONS.length; i++){
      const w = WEAPONS[i];
      items.push({ key:'w'+i, mode:'buy', weapon:w, wlv:i, name:w.name, icon:'i-hoe',
                   price:w.price, bulk:false, off: (GAME.weaponLv || 0) >= i,
                   desc:'伤害 ' + w.dmg + ' · ' + ((GAME.weaponLv||0) >= i ? '已有更好的' : '当前 ' + weapon().name + ' 伤害 ' + weapon().dmg) });
    }
    items.push({ head:'戒指（一次只能戴一枚）' });
    for(const rg of RINGS){
      const owned = (GAME.rings||[]).indexOf(rg.id) >= 0;
      items.push({ key:'rg_'+rg.id, mode:'buy', ring:rg, name:rg.name, icon:'i-heart',
                   price:rg.price, bulk:false, off:owned || (GAME.gold||0) < rg.price,
                   desc: rg.desc + (owned ? ' · 已有' : '') });
    }
    items.push({ head:'防具' });
    for(let i = 1; i < BOOTS.length; i++){
      const bt = BOOTS[i];
      items.push({ key:'bt'+i, mode:'buy', boot:bt, blv:i, name:bt.name, icon:'i-heart',
                   price:bt.price, bulk:false, off:(GAME.bootLv||0) >= i,
                   desc:'减伤 ' + Math.round(bt.armor*100) + '% · ' +
                        ((GAME.bootLv||0) >= i ? '已有更好的' : '当前 ' + BOOTS[GAME.bootLv||0].name) });
    }
    items.push({ head:'升级工具' });
    for(const tk of ['hoe','pick']){
      const tlv = (GAME.toolLv||{})[tk] || 1;
      const nx = tlv + 1;
      if(nx > 4) continue;
      const cost = nx === 2 ? 800 : nx === 3 ? 2400 : 6000;
      items.push({ key:'tool_'+tk, mode:'buy', toolUp:tk, name:(tk === 'hoe' ? '锄头' : '镐') + ' Lv.' + tlv + ' → ' + nx,
                   icon:'i-hoe', price:cost, bulk:false, off:(GAME.gold||0) < cost,
                   desc: tk === 'hoe' ? ('一次锄 ' + (nx === 2 ? 2 : 3) + ' 格') : ('敲矿进度 +' + Math.round((nx-1)*12) + '%') });
    }
    const lv = canMax();
    items.push({ key:'can', canUp:true, name:'水壶扩容 ' + lv + ' → ' + (lv + 10), icon:'i-can',
                 price: 400 * Math.pow(2, (lv - 20) / 10), bulk:false,
                 off: lv >= 50,
                 desc: lv >= 50 ? '已经是最大容量了' : '一次能多浇 10 格地 · 当前 ' + lv });
  }
  if(true) {
    items.push({ head:'卖矿石（比出货箱多两成 · 立刻到账）' });
    for(const k of list){
      const o = ORES[k];
      items.push({ key:k, sellOre:true, mode:'sell', name:o.name, icon:'i-hoe',
                   price: Math.round(o.sell * 1.2 * mktMul('ores') * festivalMul() * centerPriceMul()), bulk:true,
                   desc:'你有 ' + GAME.ores[k] + ' 块 · 出货箱只给 ' + o.sell + ' 金' });
    }
  }
  openMarket({
    title:'铁匠铺', sub:'BLACKSMITH', items, rebuild:()=>openSmithShop(),
    onBuy(it, n){
      if(it.ring){
        if((GAME.rings||[]).indexOf(it.ring.id) >= 0){ toast('已经有了'); return; }
        if(!payFor(it.price)) return;
        GAME.rings = GAME.rings || [];
        GAME.rings.push(it.ring.id);
        GAME.ring = it.ring.id;
        sfx.buy(); toast('买下 ' + it.ring.name + '，已戴上');
        rebuildMarket(); saveGame(); return;
      }
      if(it.toolUp){
        const tlv = (GAME.toolLv||{})[it.toolUp] || 1;
        if(tlv >= 4){ toast('已经满级了'); return; }
        if(!payFor(it.price)) return;
        GAME.toolLv = GAME.toolLv || {hoe:1, pick:1};
        GAME.toolLv[it.toolUp] = tlv + 1;
        sfx.buy(); toast((it.toolUp === 'hoe' ? '锄头' : '镐') + '升到 Lv.' + GAME.toolLv[it.toolUp]);
        rebuildMarket(); saveGame(); return;
      }
      if(it.boot){
        if((GAME.bootLv||0) >= it.blv){ toast('已经穿更好的了'); return; }
        if(!payFor(it.price)) return;
        GAME.bootLv = it.blv;
        sfx.buy(); toast('换上 ' + it.boot.name + '（减伤 ' + Math.round(it.boot.armor*100) + '%）');
        rebuildMarket(); saveGame(); return;
      }
      if(it.weapon){
        if((GAME.weaponLv || 0) >= it.wlv){ toast('你已经用不上这把了'); return; }
        if(!payFor(it.price)) return;
        GAME.weaponLv = it.wlv;
        sfx.buy();
        toast('换上 ' + it.weapon.name + '（伤害 ' + it.weapon.dmg + '）');
        rebuildMarket(); saveGame(); return;
      }
      if(it.canUp){
        if(canMax() >= 50){ toast('水壶已经满级了'); return; }
        if(!payFor(Math.round(it.price))) return;
        GAME.canMax = Math.min(50, canMax() + 10);
        can = canMax();
        toast('水壶扩容到 ' + canMax() + ' 格');
        rebuildMarket(); saveGame(); return;
      }
      if(!it.sellOre) return;
      const have = GAME.ores[it.key] || 0;
      if(have < n){ toast('你只有 ' + have + ' 块' + it.name); return; }
      GAME.ores[it.key] = have - n;
      GAME.gold = (GAME.gold || 0) + it.price * n;
      GAME.stat.earned = (GAME.stat.earned||0) + it.price * n;
      sfx.coin(); toast('卖了 ' + n + ' 块' + it.name + '　+' + it.price * n + '金');
      rebuildMarket(); saveGame();
    }
  });
}

/* ============ 钓鱼小游戏 ============ */
const RODS = [
  { name:'竹钓竿', half:0.165, price:0,    desc:'最普通的一根' },
  { name:'玻璃纤维竿', half:0.205, price:800,  desc:'绿条更宽，好钓一点' },
  { name:'铱钓竿', half:0.245, price:2500, desc:'绿条最宽' }
];
function rod(){ return RODS[GAME.rodLv || 0] || RODS[0]; }
function greenHalf(){ return rod().half * (FI.boost ? 1.35 : 1) * (1 + skillLv('fish') * 0.015) * (1 + PM.greenBonus()); }
const FI = { on:false, gy:0.55, vy:0, fy:0.30, fdir:1, ft:0, prog:0.40, hold:false, t:0, done:false };
const fiEl = document.getElementById('fishing');
function openFishing(){
  if(!(scene === 'sub' && curScene && curScene.name === '沙滩')){ toast('要到海边才能钓'); return; }
  FI.on = true; FI.done = false;
  FI.gy = 0.55; FI.vy = 0; FI.fy = 0.30; FI.fdir = 1; FI.ft = 0;
  FI.prog = 0.40; FI.hold = false; FI.t = 0;
  if((GAME.bait||0) > 0){ GAME.bait--; FI.boost = true; } else { FI.boost = false; }
  fiEl.classList.add('on');
  sfx.cast();
  refreshFishing();
}
function closeFishing(){ FI.boost = false; FI.on = false; FI.hold = false; fiEl.classList.remove('on'); }
function refreshFishing(){
  const g = document.getElementById('fiGreen'), f = document.getElementById('fiFish'),
        p = document.getElementById('fiProg'), c = document.getElementById('fiPct');
  if(g){
    const hh = greenHalf();
    g.style.top = ((FI.gy - hh * 0.96) * 100).toFixed(1) + '%';
    g.style.height = (hh * 1.92 * 100).toFixed(1) + '%';
  }
  if(f) f.style.top = (FI.fy * 100).toFixed(1) + '%';
  if(p) p.style.width = (FI.prog * 100).toFixed(1) + '%';
  if(c) c.textContent = Math.round(FI.prog * 100) + '%';
}
function updateFishing(dt){
  if(!FI.on || FI.done) return;
  FI.t += dt;
  /* 绿框：按住上升、松开下落，带一点惯性 */
  FI.vy += (FI.hold ? -3.2 : 2.8) * dt;
  FI.vy = Math.max(-1.9, Math.min(1.9, FI.vy));
  FI.gy = Math.max(0.13, Math.min(0.87, FI.gy + FI.vy * dt * 0.9));
  /* 鱼：随机改向 */
  FI.ft += dt;
  if(FI.ft > 0.45 + Math.random() * 0.5){
    FI.ft = 0;
    FI.fdir = Math.random() < 0.5 ? -1 : 1;
  }
  FI.fy += FI.fdir * (0.17 + Math.random() * 0.22) * dt;   /* 鱼游慢一点 */
  if(FI.fy < 0.06){ FI.fy = 0.06; FI.fdir = 1; }
  if(FI.fy > 0.94){ FI.fy = 0.94; FI.fdir = -1; }
  /* 判定 */
  const inGreen = Math.abs(FI.fy - FI.gy) < greenHalf();
  FI.prog = Math.max(0, Math.min(1, FI.prog + (inGreen ? 0.62 * (1 + luckBonus()) : -0.18) * dt));
  if(FI.prog >= 1){ fishWin(); return; }
  if(FI.prog <= 0 || FI.t > 30){ fishLose(); return; }
  refreshFishing();
}
function fishWin(){
  FI.done = true;
  const f = rollFish();
  GAME.fish[f.id] = (GAME.fish[f.id] || 0) + 1;
  if(PM.fishGold()){ GAME.gold = (GAME.gold||0) + PM.fishGold(); }
  see('fish', f.id);
  addSkillXp('fish', 12);
  try{ SV.emit('fish', { name:f.name, sell:f.sell }); }catch(e){}
  GAME.stat.fished = (GAME.stat.fished||0) + 1;
  addXp(15);
  GAME.bin.qty++; GAME.bin.value += f.sell;
  closeFishing();
  sfx.catchFish();
  showFx('钓到了！' + f.name, 'good', 1500);
  toast('钓到 ' + f.name + '　+' + f.sell + '金（睡觉结算）');
  saveGame();
}
function fishLose(){ FI.done = true; closeFishing(); sfx.fail(); showFx('鱼跑了…', 'bad', 1200); toast('鱼跑了…'); }

                   .map(k=>[(CRAFTED[k]&&CRAFTED[k].name)||k, GAME.crafted[k]]);

                   .map(k=>[(PLACES[k]&&PLACES[k].name)||k, GAME.place[k]]);

  if((GAME.fert&&GAME.fert.premium)>0) shopRows.push(['高级肥料', GAME.fert.premium]);
  if((GAME.bait||0)>0)                 shopRows.push(['鱼饵', GAME.bait]);
  const fishRows = Object.keys(GAME.fish||{}).filter(k=>GAME.fish[k]>0).map(k=>{
    const f = FISH_TBL.filter(x=>x.id===k)[0];
    return [f ? f.name : k, GAME.fish[k]];

  const aniRows  = Object.keys(ANIMALS).filter(k=>((GAME.animals||{})[k]||0)>0)
                   .map(k=>[ANIMALS[k].name, GAME.animals[k]]);
  const html = bagGroup('消耗品', shopRows) + bagGroup('放置物', placeRows) + bagGroup('加工品', craftRows) + bagGroup('作物', cropRows) + bagGroup('种子', seedRows) +
               bagGroup('蛋奶', goodRows) + bagGroup('矿石', oreRows) +
               bagGroup('鱼', fishRows) + bagGroup('动物', aniRows);
  list.innerHTML = html || '<div class="bg-empty">背包是空的</div>';
  if(foot){
    foot.innerHTML = '<span>钱 <b>' + (GAME.gold||0) + '</b> 金</span>' +
      '<span>出货箱 <b>' + (GAME.bin?GAME.bin.qty:0) + '</b> 件 / <b>' +
      (GAME.bin?GAME.bin.value:0) + '</b> 金</span>';
  }

/* 读档清洗：存档里可能有"当前版本不认识的物品键"（改过配方、旧档、手改过存档），
   直接拿来查表会 TypeError，所以进来先过滤一遍。 */
function sanitizeSave(){
  const pick = (obj, table) => {
    const o = {};
    for(const k in (obj || {})) if(table[k]) o[k] = obj[k];
    return o;
  };
  const fishTable = {};
  for(const f of FISH_TBL) fishTable[f.id] = 1;
  GAME.crops   = pick(GAME.crops, CROPS);
  GAME.seedsBy = pick(GAME.seedsBy, CROPS);
  GAME.ores    = Object.assign({stone:0, copper:0, silver:0, gold:0}, pick(GAME.ores, ORES));
  GAME.goods   = Object.assign({egg:0, duckEgg:0, milk:0}, pick(GAME.goods, GOODS));
  GAME.crafted = pick(GAME.crafted, CRAFTED);
  GAME.food    = pick(GAME.food, RECIPES);
  GAME.fish    = pick(GAME.fish, fishTable);
  if(Array.isArray(GAME.crafts)) GAME.crafts = GAME.crafts.filter(j => j && CRAFTED[j.id]);
  else GAME.crafts = [];
  if(GAME.quest && !(CROPS[GAME.quest.key] || ORES[GAME.quest.key] ||
                     GOODS[GAME.quest.key] || CRAFTED[GAME.quest.key])) GAME.quest = null;
  if(!Number.isFinite(GAME.gold) || GAME.gold < 0) GAME.gold = 50;
  if(!Number.isFinite(GAME.level) || GAME.level < 1) GAME.level = 1;
  if(!Number.isFinite(GAME.xp) || GAME.xp < 0) GAME.xp = 0;
  if(!Number.isFinite(GAME.feed) || GAME.feed < 0) GAME.feed = 0;
  if(!Number.isFinite(GAME.canMax) || GAME.canMax < 20 || GAME.canMax > 50) GAME.canMax = 20;
  if(!Number.isFinite(GAME.mineLayer) || GAME.mineLayer < 1 || GAME.mineLayer > 8) GAME.mineLayer = 1;
  if(!GAME.animals || typeof GAME.animals !== 'object') GAME.animals = {chicken:0, duck:0, cow:0};
  for(const id in ANIMALS) if(!Number.isFinite(GAME.animals[id]) || GAME.animals[id] < 0) GAME.animals[id] = 0;
  if(!GAME.bin || !Number.isFinite(GAME.bin.qty) || GAME.bin.qty < 0) GAME.bin = {qty:0, value:0};
  if(!Number.isFinite(GAME.bin.value) || GAME.bin.value < 0) GAME.bin.value = 0;
}

function aiReply(text){
  const t = String(text).trim();
  let m;

  m = t.match(/(?:去|到|走去|来)\s*([^\s，。！？]{1,6})/);
  if(m){
    const raw = m[1];
    /* 先去掉语气词和方位尾巴，再逐字截断 —— 不然「去喷泉吧」会被当成地名「喷泉吧」 */
    const base = raw.replace(/(吧|啊|呀|呢|哦|嘛|了|啦|呗|喔|噢)+$/, '')
                    .replace(/(边|那儿|那里|这边|一趟|看看吧)$/, '');
    const cands = [raw, base];
    for(let n = base.length - 1; n >= 2; n--) cands.push(base.slice(0, n));
    let key = null, hit = null;
    for(const c of cands){ if(PLACE_ALIAS[c]){ key = PLACE_ALIAS[c]; hit = c; break; } }
    if(key && TA_API.goToPlace(key)){
      TA_API.say('好，我去' + hit);
      return '好，我去' + hit + '。';
    }
  }
  if(/过来|陪我|来我这儿|来我身边/.test(t)){
    TA_API.wherever(); TA_API.say('来了');
    return '来了。';
  }
  if(/^(停|停一下|等|等我|别走|站住)/.test(t)){
    TA_API.stop(); TA_API.say('好');
    return '好，我停这儿了。';
  }
  if(/在哪|哪里|位置|坐标/.test(t)){
    const s = TA_API.state();
    return '我在 (' + s.x + ', ' + s.y + ')，' + (s.walking ? '正在走。' : '站着。');
  }
  if(/自己|随便|自由|逛逛/.test(t)){
    TA_API.auto(true);
    return '好，那我随便走走。';
  }
  if(/你是谁|叫什么|名字/.test(t)) return '我是 TA，住在这儿的那一个。';
  if(/花|樱花/.test(t)) return '今年的樱花开得比去年早。';
  return '嗯，我在听。';
}

/* 把「当前场景」写进 App 的聊天记录，主聊天页能看到 */
function syncScene(tag){
  /* 进出场景的系统语：和聊天消息走同一条回写通道，格式统一 */
  pushParent('sys', tag);
}

/* 写进主 App 的聊天记录。
   ★ 格式必须和主 App 一致：{role:'user'|'assistant'|'system', content, ts}
   以前写的是 {role:'user'|'ai'|'sys', text, timestamp} —— 主 App 只认 role+content，
   所以记进去也一个字都不显示（这就是"消息没同步聊天记录"的原因）。 */
var _pcrT = null;
function _refreshParentChat(){
  try{
    var par  = (window.parent && window.parent !== window) ? window.parent : null;      /* 桌面文档 */
    var top  = (par && par.parent && par.parent !== par) ? par.parent : null;           /* 外层 App */
    if(!top || typeof top.teChatRefresh !== 'function') return;
    if(_pcrT) clearTimeout(_pcrT);
    _pcrT = setTimeout(function(){ try{ top.teChatRefresh(); }catch(e){} }, 150);
  }catch(e){}
}
function pushParent(role, text, reasoning){
  try{
    var par = (window.parent && window.parent !== window) ? window.parent : null;
    var ls  = (par && par.localStorage) || window.localStorage;
    var h = JSON.parse(ls.getItem('chat_history') || '[]');
    if(!Array.isArray(h)) h = [];
    var r = (role === 'ai') ? 'assistant'
          : (role === 'sys') ? 'system'
          : (role === 'user') ? 'user' : 'assistant';
    var _msg = { role: r, content: String(text == null ? '' : text), ts: Date.now() };
    if(reasoning) _msg.reasoning = String(reasoning);
    var _last = h[h.length - 1];
    var _dup = _last && _last.role === r && _last.content === _msg.content
               && (Date.now() - (_last.ts || 0) < 120000);
    if(_dup) return;                       /* 2 分钟内同一条不重复写 */
    h.push(_msg);
    ls.setItem('chat_history', JSON.stringify(h.slice(-1000)));
    ls.setItem('chat_history_bak', JSON.stringify(h.slice(-200)));
    _refreshParentChat();
  }catch(e){}
}

function addChat(who, text, reasoning){
  var el = addMsg(who === 'sys' ? 'sys' : (who === 'me' ? 'me' : 'ta'), text);
  if(who === 'sys' && el){
    el.className = 'msg sys';
    el.style.cssText = 'opacity:.78;font-size:11.5px;color:#8d6b78;background:rgba(255,245,248,.55);'
      + 'border:1px dashed rgba(226,182,197,.75);border-radius:8px;padding:4px 9px;'
      + 'align-self:flex-start;max-width:92%;white-space:pre-wrap';
  }
  /* 同步进 App 聊天记录：我 → user，TA → ai，回执 → sys（reasoning 进助手那条，主聊天页能展开思考链） */
  if(who === 'me') pushParent('user', text);
  else if(who === 'sys') pushParent('sys', '（' + text + '）');
  else pushParent('ai', text, reasoning);
  return el;
}

async function sendChatAI(){
  const inp = document.getElementById('chatInput');
  const txt = (inp.value || '').trim();
  if(!txt) return;
  inp.value = '';
  addChat('me', txt);
  let ai = null;
  try{ ai = (window.parent && window.parent.teAI) || null; }catch(e){}
  if(!ai || !ai.play){ addChat('ta', '（AI 没连上，先说个本地台词）'); return sendChat(txt); }

  /* 先把状态条挂上：模型想多久、在做什么，当场能看见 */
  var st = addStatus('TA 在想…');
  var t0 = Date.now();
  function setSt(s){ try{ st.textContent = s; chatBody.scrollTop = chatBody.scrollHeight; }catch(e){} }
  function dropSt(){ try{ if(st && st.parentNode) st.parentNode.removeChild(st); }catch(e){} }
  var tick = setInterval(function(){
    var s = Math.round((Date.now() - t0) / 1000);
    if(s >= 3) setSt(st.textContent.replace(/ · \d+s$/, '') + ' · ' + s + 's');
  }, 1000);

  try{
    const r = await ai.play(txt, 6, function(ev){
      try{
        if(!ev) return;
        if(ev.type === 'think') setSt('TA 在想…');
        else if(ev.type === 'say' && ev.text) setSt('TA：' + String(ev.text).slice(0, 42));
        else if(ev.type === 'cmd') setSt('TA 正在：' + ev.cmd + (ev.ok === false ? '（没成）' : ''));
        else if(ev.type === 'error') setSt('TA 卡住了：' + String(ev.msg || '').slice(0, 40));
      }catch(e){}
    });
    clearInterval(tick);
    dropSt();
    if(!r || !r.ok){ addChat('ta', '没连上：' + ((r && r.msg) || '未知')); return; }
    var lastThinkIdx = -1;
    (r.log || []).forEach(function(x, i){ if(x.think) lastThinkIdx = i; });
    (r.log || []).forEach(function(x, i){
      if(x.think && i === lastThinkIdx) addThink(x.think);   /* 只画最后一块，别把窗口塞满 */
      if(x.say) addChat('ta', x.say, x.think);
      if(x.cmd) addChat('sys', (x.ok === false ? '✗ ' : '') + x.cmd + (x.msg ? ' · ' + x.msg : ''));
    });
  }catch(e){
    clearInterval(tick);
    dropSt();
    addChat('ta', '出错了：' + (e.message || e));
  }
}

/* ===== 聊天窗拖动 · 5.58：按住任意位置都能拖，移动超过 8px 才算拖动 =====
   ① 记位置到 localStorage（te_gm_chat_pos，老键 te_chat_pos 也认）；
   ② 拖动时不要触发框里的按钮 / 输入焦点（阈值以内当普通点击）；
   ③ 拖动结束后吞掉这一次 click，避免松手时误点「关闭 / 换尺寸 / 发送」。 */
(function(){
  const el = document.getElementById('chatWin');
  const KEY = 'te_gm_chat_pos';
  const TH = 8;
  let drag = null, suppressClick = 0;

  function sizeOf(){
    const r = el.getBoundingClientRect();
    if(r.width && r.height) return { w: r.width, h: r.height };
    const sz = (typeof CHAT_SIZES !== 'undefined') ? CHAT_SIZES[chatSizeIdx] : [300, 360];
    return { w: sz[0], h: sz[1] };
  }
  function clamp(x, y){
    const s = sizeOf();
    return {
      left: Math.max(0, Math.min(Math.max(0, innerWidth  - s.w), x)),
      top:  Math.max(0, Math.min(Math.max(0, innerHeight - s.h), y))
    };
  }
  function place(x, y){
    const p = clamp(x, y);
    el.style.left = p.left + 'px';
    el.style.top  = p.top  + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.transform = 'translate3d(0,0,0)';
    return p;
  }
  function save(){
    try{
      const r = el.getBoundingClientRect();
      const p = clamp(r.left, r.top);
      el.style.left = p.left + 'px'; el.style.top = p.top + 'px'; el.style.transform = 'translate3d(0,0,0)';
      localStorage.setItem(KEY, JSON.stringify({ left: Math.round(p.left), top: Math.round(p.top) }));
      /* 老键也写一份，回退旧版本时不至于丢位置 */
      try{ localStorage.setItem('te_chat_pos', JSON.stringify({ left: Math.round(p.left), top: Math.round(p.top) })); }catch(_){}
    }catch(_){}
  }
  function restore(){
    try{
      let pos = null;
      try{ pos = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(_){}
      if(!pos){ try{ pos = JSON.parse(localStorage.getItem('te_chat_pos') || 'null'); }catch(_){} }
      if(pos && typeof pos.left === 'number' && typeof pos.top === 'number') place(pos.left, pos.top);
    }catch(_){}
  }
  /* 换 S/M/L 档位之后，把窗口重新夹回屏内 */
  const _applySize = applyChatSize;
  applyChatSize = function(){
    _applySize.apply(this, arguments);
    if(el.style.left){ const r = el.getBoundingClientRect(); place(r.left, r.top); }
  };
  restore();

  let frame = 0;
  function renderMove(){
    frame = 0;
    if(!drag || !drag.moved || !drag.pending) return;
    const maxX = Math.max(0, innerWidth - drag.w);
    const maxY = Math.max(0, innerHeight - drag.h);
    const x = Math.max(0, Math.min(maxX, drag.pending.x - drag.dx));
    const y = Math.max(0, Math.min(maxY, drag.pending.y - drag.dy));
    el.style.transform = 'translate3d(' + (x - drag.left) + 'px,' + (y - drag.top) + 'px,0)';
  }
  function onMove(e){
    if(!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if(!drag.moved){
      if(Math.abs(dx) < TH && Math.abs(dy) < TH) return;
      drag.moved = true;
      el.classList.add('dragging');
      try{ el.style.transition = 'none'; }catch(_){}
      try{ if(document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); }catch(_){}
    }
    drag.pending = {x:e.clientX, y:e.clientY};
    if(!frame) frame = requestAnimationFrame(renderMove);
    try{ e.preventDefault(); }catch(_){}
  }
  function off(){
    document.removeEventListener('pointermove', onMove, true);
    document.removeEventListener('pointerup', onUp, true);
    document.removeEventListener('pointercancel', onUp, true);
  }
  function onUp(e){
    if(!drag) return;
    if(drag.moved){
      if(frame){ cancelAnimationFrame(frame); frame = 0; }
      renderMove();
      const r = el.getBoundingClientRect();
      el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
      el.style.transform = 'translate3d(0,0,0)';
    }
    const moved = drag.moved;
    drag = null;
    off();
    el.classList.remove('dragging');
    try{ el.style.transition = ''; }catch(_){}
    if(moved){ save(); suppressClick = Date.now() + 400; }
  }
  el.addEventListener('pointerdown', function(e){
    if(e.button != null && e.button !== 0) return;
    if(e.target.closest('#chatBody, #chatInputRow, button, input, textarea, select')) return;
    const r = el.getBoundingClientRect();
    drag = { sx:e.clientX, sy:e.clientY, left:r.left, top:r.top,
             dx:e.clientX-r.left, dy:e.clientY-r.top,
             w:r.width||sizeOf().w, h:r.height||sizeOf().h,
             moved:false, id:e.pointerId };
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    document.addEventListener('pointermove', onMove, true);
    document.addEventListener('pointerup', onUp, true);
    document.addEventListener('pointercancel', onUp, true);
  });
  /* 拖动结束后吞掉 click（捕获阶段，先于按钮自己的 onclick） */
  el.addEventListener('click', function(e){
    if(Date.now() > suppressClick) return;
    suppressClick = 0;
    e.preventDefault(); e.stopPropagation();
    try{ if(e.stopImmediatePropagation) e.stopImmediatePropagation(); }catch(_){}
  }, true);
  addEventListener('resize', function(){
    if(el.style.left){ const r = el.getBoundingClientRect(); place(r.left, r.top); save(); }
  });
})();

/* ============ 大地图（看全局 + 点着走，游戏画面本身仍然 1:1 不缩放）============ */
const bigmapEl = document.getElementById('bigmap');
const bmc = document.getElementById('bmc');
const BM = {s:1, open:false};

function openBigMap(){
  if(scene !== 'world'){ toast('先走出农场再看地图'); return; }
  BM.open = true; bigmapEl.classList.add('on');
  drawBigMap();
}
function closeBigMap(){ BM.open = false; bigmapEl.classList.remove('on'); }

function drawBigMap(){
  const pad = 18;
  const s = Math.min((innerWidth - pad*2)/WW, (innerHeight - pad*2)/WH);
  const w = Math.round(WW*s), h = Math.round(WH*s);
  const d2 = Math.min(2, devicePixelRatio || 1);
  bmc.style.width = w + 'px'; bmc.style.height = h + 'px';
  bmc.width = Math.round(w*d2); bmc.height = Math.round(h*d2);
  const g = bmc.getContext('2d');
  g.setTransform(d2, 0, 0, d2, 0, 0);
  g.imageSmoothingEnabled = true;      /* 缩略图允许平滑，反正不是游戏画面 */
  /* 总览底图要跟着当前页走，否则会出现"第二页的标签盖在镇子图上" */
  const img = mapPage === 1 ? (mapImg2 || mapImg)
            : mapPage === 2 ? (mapImg3 || mapImg2 || mapImg)
            : (seasonImgs[GAME.season] || mapImg);
  if(img) g.drawImage(img, 0, 0, w, h);

  /* ---- 地点标注：所有 POI 都画，能进去的入口再加一圈粉环 ---- */
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const drawn = [];                       /* 已经占掉的位置，免得标签叠成一团 */
  function freeAt(x, y, w, h){
    return !drawn.some(r => Math.abs(r.x-x) < (r.w+w)/2 + 4 && Math.abs(r.y-y) < (r.h+h)/2 + 2);
  }
  function bmLabel(text, x, dotY, col, bold){
    g.font = (bold ? 'bold ' : '') + '11px "Songti SC",serif';
    const w = g.measureText(text).width, h = 12;
    /* 依次试：正上方 → 正下方 → 更上 → 更下 → 左上 → 右下；
       一个都不行才硬放（宁可叠，也别飘到别的建筑头上） */
    const tries = [[0,-12],[0,14],[0,-25],[0,27],[-w/2-8,-12],[w/2+8,-12]];
    let px = x, py = dotY - 12;
    for(const [dx, dy] of tries){
      if(freeAt(x+dx, dotY+dy, w, h)){ px = x+dx; py = dotY+dy; break; }
    }
    drawn.push({x:px, y:py, w, h});
    g.lineWidth = 3.2; g.strokeStyle = 'rgba(255,250,245,.95)';
    g.strokeText(text, px, py);
    g.fillStyle = col; g.fillText(text, px, py);
  }

  /* 1) 每个地点一个点 + 名字 */
  for(const k in POI){
    const pt = POI[k];
    const ex = pt.x*s, ey = pt.y*s;
    g.beginPath(); g.arc(ex, ey, 4.2, 0, Math.PI*2);
    g.fillStyle = '#2E7D32'; g.fill();
    g.lineWidth = 1.6; g.strokeStyle = '#fff'; g.stroke();
    bmLabel(PLACE_NAME[k] || k, ex, ey, '#2C3F28', false);
  }

  /* 2) 能进入的入口：套在最近的 POI 上。
        `farm` 是「回农场」这个动作，不是某栋房子，所以在它自己的位置标，别套到农舍头上 */
  for(const en of ENTRIES){
    let host = null, best = 1e9;
    if(en.id !== 'farm'){
      for(const k in POI){
        const d = Math.hypot(POI[k].x - en.x, POI[k].y - en.y);
        if(d < best){ best = d; host = POI[k]; }
      }
      if(best > 60) host = null;
    }
    if(!host){
      host = {x: en.x, y: en.y};
      bmLabel(en.name, en.x*s, en.y*s, '#43283A', true);
    }
    g.beginPath(); g.arc(host.x*s, host.y*s, 8.5, 0, Math.PI*2);
    g.lineWidth = 2; g.strokeStyle = '#C2456B'; g.stroke();
  }
  /* 你 / TA */
  for(const [x, y, c] of [[P.x, P.y, '#2E7D32'], [TA.x, TA.y, '#8A5FC0']]){
    g.beginPath(); g.arc(x*s, y*s, 5, 0, Math.PI*2);
    g.fillStyle = c; g.fill();
    g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke();
  }
  BM.s = s;
}

/* 点到走不到的地方时，在附近找一圈最近能站的点 */
function pathToNearest(tx, ty){
  let path = findPath(P.x, P.y, tx, ty);
  if(path) return path;
  for(let r = 14; r <= 110; r += 14){
    for(let a = 0; a < 8; a++){
      const nx = tx + Math.cos(a*Math.PI/4)*r, ny = ty + Math.sin(a*Math.PI/4)*r;
      path = findPath(P.x, P.y, nx, ny);
      if(path) return path;
    }
  }
  return null;
}

bmc.addEventListener('pointerdown', e=>{
  const r = bmc.getBoundingClientRect();
  const wx = (e.clientX - r.left)/BM.s, wy = (e.clientY - r.top)/BM.s;
  if(wx < 0 || wy < 0 || wx > WW || wy > WH) return;
  closeBigMap();
  const path = pathToNearest(wx, wy);
  if(path){ P.path = path; P.pathIdx = 0; toast('这就过去'); }
  else toast('那边过不去');
});
