<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffe9f0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2026">
<title>星露谷 · 全局图 P0</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2026;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
    overscroll-behavior:none;font-family:"Songti SC","SimSun",serif}
  #c{display:block;width:100vw;height:100dvh;image-rendering:pixelated;
     touch-action:none;cursor:crosshair}
  .ui{position:fixed;z-index:5;color:#4a3226;background:#fbe9f0;border:2px solid #b98298;
     box-shadow:inset 0 2px 0 #fff, inset 0 -2px 0 #e6c3d2;padding:4px 10px;border-radius:3px;
     font-size:13px;letter-spacing:1px;user-select:none;-webkit-user-select:none}
  #hud{left:calc(8px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top));
    white-space:nowrap;font-size:12px;padding:4px 9px;line-height:1.2}
  #dbg{left:calc(8px + env(safe-area-inset-left));top:calc(86px + env(safe-area-inset-top));
     font:10px/1.4 ui-monospace,Consolas,monospace;color:#8CF0A8;
     background:rgba(18,14,22,.78);border:1px solid rgba(120,220,150,.45);
     padding:5px 8px;opacity:1;display:none;white-space:pre-wrap;
     max-width:52vw;pointer-events:none;z-index:14;box-shadow:none;border-radius:0}
  #enter{left:50%;transform:translateX(-50%);
     bottom:calc(84px + env(safe-area-inset-bottom));z-index:12;
     display:none;cursor:pointer;font-size:15px;padding:12px 40px;
     color:#4a3226;background:url("生图/U-pill.png") center/100% 100% no-repeat;
     border:0;box-shadow:none;image-rendering:pixelated;
     text-shadow:0 1px 0 rgba(255,255,255,.8)}
  /* 布局从下往上：工具栏 18 → 水条 72 → 交互按钮 122，互不遮挡 */
  #enter:active{transform:translateX(-50%) scale(.96)}
  #zoom{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));
     display:flex;gap:6px}
  #zoom button{font:inherit;font-size:16px;width:34px;height:30px;padding:0;cursor:pointer;
     color:#4a3226;background:#fbe9f0;border:2px solid #b98298;border-radius:3px;
     touch-action:manipulation;user-select:none}
  #zoom button:active{background:#f3d6e2}
  #tip{right:calc(8px + env(safe-area-inset-right));left:auto;transform:none;
     top:calc(44px + env(safe-area-inset-top));font-size:11px;opacity:.7;pointer-events:none;display:none}
  @media (max-width:640px){#tip{display:none}}

  /* ===== 迷你聊天窗 ===== */
  #chatWin{position:fixed;right:calc(4px + env(safe-area-inset-right));
    bottom:calc(4px + env(safe-area-inset-bottom));width:300px;height:360px;z-index:20;
    display:flex;flex-direction:column;padding:30px 26px 26px;box-sizing:border-box;
    background:url("生图/W-面板-中.png") center/100% 100% no-repeat;
    border:0;box-shadow:0 12px 30px rgba(60,30,45,.35);overflow:hidden;
    font-family:"Songti SC","SimSun",serif}
  #chatWin.hide{display:none}
  #chatHead{display:flex;align-items:center;gap:6px;padding:0 0 5px;margin-bottom:5px;
    cursor:move;touch-action:none;
    border-bottom:2px solid rgba(185,130,152,.55);user-select:none;-webkit-user-select:none}
  #chatHead b{letter-spacing:2px}
  #chatGrip{opacity:.45;font-size:14px;line-height:1;margin-right:1px;letter-spacing:-2px}
  #chatHead.drag, #chatHead.drag *{cursor:grabbing}
  /* 5.58：整框可拖 —— 窗外可拖，框内消息区保留纵向滚动 */
  #chatWin{touch-action:none}
  #chatWin.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
  #chatBody{touch-action:pan-y}
  #chatHead b{font-size:13px;color:#4a3226;letter-spacing:1px;flex:1}
  #chatHead button{font:inherit;font-size:11px;line-height:1;padding:4px 7px;color:#4a3226;
    background:#fbe9f0;border:1px solid #b98298;border-radius:3px;cursor:pointer;
    touch-action:manipulation;user-select:none}
  #chatHead button:active{background:#efc9d8}
  #chatBody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 6px;display:flex;
    flex-direction:column;gap:6px;background:transparent}
  /* 消息气泡：纯 CSS 像素风，三层硬边，不用切图 → 永远不会被裁 */
  .msg{box-sizing:border-box;max-width:74%;font-size:12px;line-height:1.35;
    padding:4px 8px;border:2px solid #6b4a35;border-radius:3px;
    word-break:break-word;white-space:pre-wrap}
  .msg.ai{align-self:flex-start;color:#4a3226;background:#fff6ee;
    box-shadow:inset 0 0 0 2px #f7b6c8}
  .msg.me{align-self:flex-end;color:#5b2438;background:#f7b6c8;
    box-shadow:inset 0 0 0 2px #d98098}
  #chatInputRow{display:flex;gap:6px;padding:6px 0 0;border-top:2px solid rgba(185,130,152,.55);
    background:transparent}
  #chatInput{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:6px 8px;
    border:1px solid #b98298;border-radius:4px;background:#fff;color:#4a3226;outline:none}
  #chatSend{font:inherit;font-size:13px;padding:6px 12px;color:#4a3226;background:#fbe9f0;
    border:1px solid #b98298;border-radius:4px;cursor:pointer;touch-action:manipulation}
  #chatSend:active{background:#efc9d8}
  #canbar{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;
    display:flex;align-items:center;gap:8px;padding:7px 26px;
    background:url("生图/U-bar.png") center/100% 100% no-repeat;
    font:12px "Songti SC",serif;color:#4a3226;user-select:none;-webkit-user-select:none;
    image-rendering:pixelated}
  #canicon{font-size:13px;line-height:1}
  #cantrack{width:110px;height:12px;background:#5a3b22;border:2px solid #6b4a35;
    box-sizing:border-box;padding:1px}
  #canfill{height:100%;width:100%;background:linear-gradient(#9FD8F5,#5FA8D3);
    transition:width .12s linear}
  #cantext{min-width:38px;text-align:right;letter-spacing:.5px}
  #farmnav{position:fixed;left:50%;transform:translateX(-50%);
    top:calc(40px + env(safe-area-inset-top));z-index:9;
    display:flex;align-items:center;gap:7px;height:36px;box-sizing:border-box;
    padding:0 9px;background:rgba(255,246,238,.95);
    border:3px solid #5A3B2A;line-height:1;
    font:15px/1 "Songti SC",serif;color:#4A3226;letter-spacing:1px;
    user-select:none;-webkit-user-select:none}
  #farmnav button{font:15px/1 "Songti SC",serif;height:28px;
    display:inline-flex;align-items:center;justify-content:center;
    padding:0 11px;color:#4A3226;background:#FDF0D5;border:2px solid #5A3B2A;
    box-sizing:border-box;cursor:pointer;touch-action:manipulation;user-select:none}
  #farmnav button:disabled{opacity:.32}
  #farmnav button:active{background:#F7B6C8}
  #expandFarm{background:#F7B6C8 !important;font-weight:600;padding:0 12px}
  #farmLabel{min-width:46px;height:28px;display:inline-flex;
    align-items:center;justify-content:center;line-height:1;font-size:15px}
  #tools{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:10px}
  .tbtn{font:12px "Songti SC",serif;width:56px;height:56px;padding:0;color:#4a3226;
    background:url("生图/U-sq.png") center/100% 100% no-repeat;border:0;
    cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
    image-rendering:pixelated;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
    text-shadow:0 1px 0 rgba(255,255,255,.75)}
  .tbtn.on{filter:brightness(1.12) saturate(1.15)}
  .tbtn:active{transform:translateY(1px)}
  /* 农场底部有工具栏(10)+水壶条(86)+种子条(120)，按钮要再往上让 */
  body.in-farm #enter{bottom:calc(152px + env(safe-area-inset-bottom))}
  /* 矿洞底部有挖矿条(14 起，约 91 高) */
  body.in-sub #enter{bottom:calc(100px + env(safe-area-inset-bottom))}
  body.in-farm #tip{display:none}
  #saveTip{position:fixed;right:calc(12px + env(safe-area-inset-right));
    top:calc(78px + env(safe-area-inset-top));z-index:15;
    font:11px "Songti SC",serif;color:#5A8A5A;background:rgba(255,255,255,.82);
    border:1px solid rgba(90,138,90,.55);padding:2px 8px;opacity:0;
    transition:opacity .35s;pointer-events:none;user-select:none}
  #chatOpen{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:none;
    font:13px "Songti SC",serif;padding:8px 14px;color:#4a3226;background:#fbe9f0;
    border:2px solid #b98298;border-radius:20px;box-shadow:0 6px 18px rgba(60,30,45,.35);
    cursor:pointer;touch-action:manipulation}

  /* ================= 电梯按钮 ================= */
  #liftBtn{position:fixed;left:calc(50% + 120px);transform:translateX(-50%);
    bottom:calc(150px + env(safe-area-inset-bottom));z-index:12;
    font:12px "Songti SC",serif;padding:7px 14px;line-height:1;cursor:pointer;
    color:#4a3226;background:#fbe9f0;border:2px solid #b98298;border-radius:3px;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;touch-action:manipulation}
  #liftBtn:active{transform:translateX(-50%) translateY(1px)}

  /* ================= 缩放按钮 ================= */
  #zoomBtn{position:fixed;left:calc(52px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom));z-index:13;
    font:12px "Songti SC",serif;padding:6px 9px;line-height:1;cursor:pointer;
    color:#4a3226;background:#fbe9f0;border:2px solid #b98298;border-radius:3px;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;touch-action:manipulation}
  #zoomBtn:active{transform:translateY(1px)}

  /* ================= 翻页按钮 ================= */
  #pageBtn{left:50%;transform:translateX(-50%);
    top:calc(44px + env(safe-area-inset-top));z-index:12;
    font-size:12px;padding:5px 16px;line-height:1.2;cursor:pointer;
    background:#fbe9f0;border-color:#b98298;color:#5a3b4a;
    touch-action:manipulation;user-select:none}
  #pageBtn:active{transform:translateX(-50%) translateY(1px)}

  /* ================= 攻击按钮 ================= */
  #atkBtn{position:fixed;right:calc(84px + env(safe-area-inset-right));
    bottom:calc(12px + env(safe-area-inset-bottom));z-index:14;
    width:64px;height:64px;box-sizing:border-box;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font:11px "Songti SC",serif;cursor:pointer;
    color:#4a3226;background:#F7B6C8;border:3px solid #5A3B2A;border-radius:4px;
    box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 #d98aa4,0 4px 12px rgba(60,30,45,.35);
    touch-action:manipulation;user-select:none}
  #atkBtn .ico{width:22px;height:22px;stroke:#7a3a52}
  #atkBtn:active{transform:translateY(1px)}

  /* ================= 场景退出按钮 ================= */
  #exitBtn{left:calc(8px + env(safe-area-inset-left));
    top:calc(40px + env(safe-area-inset-top));z-index:12;
    cursor:pointer;font-size:13px;padding:6px 14px;line-height:1;
    color:#4a3226;background:#fbe9f0;border:2px solid #b98298;border-radius:3px;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;
    touch-action:manipulation;user-select:none}
  #exitBtn:active{transform:translateY(1px)}

  /* ================= 声音开关 ================= */
  #sndBtn{position:fixed;left:calc(10px + env(safe-area-inset-left));
    bottom:calc(12px + env(safe-area-inset-bottom));z-index:13;
    width:34px;height:30px;box-sizing:border-box;padding:0;
    font:15px/1 "Songti SC",serif;color:#4a3226;background:#fbe9f0;
    border:2px solid #b98298;border-radius:3px;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;
    cursor:pointer;touch-action:manipulation;user-select:none}
  #sndBtn:active{transform:translateY(1px)}

  /* ================= 特效层（占卜 / 钓鱼） ================= */
  #fx{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    pointer-events:none}
  #fx.on{display:flex}
  #fx .fx-in{display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:18px 30px;border:3px solid #5A3B2A;border-radius:6px;
    background:#FFF6EC;box-shadow:0 10px 30px rgba(30,20,25,.45);
    animation:fxIn .28s cubic-bezier(.2,1.4,.5,1) both}
  #fx .fx-ic{font-size:30px;line-height:1;color:#A8556F;animation:fxSpin 1.1s linear infinite}
  #fx .fx-tx{font:15px "Songti SC",serif;color:#4a3226;letter-spacing:1px}
  #fx.good .fx-ic{color:#E8B93A;animation:fxPop .6s ease-out both}
  #fx.good .fx-in{border-color:#C79227;background:#FFFBF0}
  #fx.bad .fx-ic{color:#8A8A96;animation:fxShake .5s ease-in-out both}
  #fx.bad .fx-in{border-color:#8A7A82;background:#F4EEF0}
  @keyframes fxIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fxPop{0%{transform:scale(.6)}55%{transform:scale(1.5)}100%{transform:scale(1)}}
  @keyframes fxShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  @keyframes fxSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes shakeIt{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-4px,2px)}
    40%{transform:translate(4px,-2px)}
    60%{transform:translate(-3px,-2px)}
    80%{transform:translate(3px,2px)}
  }

  /* ================= 个人面板 ================= */
  #guideBtn{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(194px + env(safe-area-inset-bottom));z-index:20;
    font:13px "Songti SC",serif;padding:7px 12px;color:#4a3226;background:#fbe9f0;
    border:2px solid #b98298;border-radius:18px;box-shadow:0 5px 14px rgba(60,30,45,.3);
    cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #guideBtn .ico{width:14px;height:14px;vertical-align:-.16em;stroke:#a8556f}
  #guideBtn:active{transform:translateY(1px)}
  #meBtn{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(148px + env(safe-area-inset-bottom));z-index:20;
    font:13px "Songti SC",serif;padding:7px 12px;color:#4a3226;background:#fbe9f0;
    border:2px solid #b98298;border-radius:18px;box-shadow:0 5px 14px rgba(60,30,45,.3);
    cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #meBtn .ico{width:14px;height:14px;vertical-align:-.16em;stroke:#a8556f}
  #meBtn:active{transform:translateY(1px)}
  #me{position:fixed;inset:0;z-index:43;display:none;align-items:center;
    justify-content:center;padding:14px;background:rgba(24,18,26,.66);touch-action:none}
  #me.on{display:flex}
  #me .me-card{width:min(94vw,430px);max-height:calc(100dvh - 22px);box-sizing:border-box;
    display:flex;flex-direction:column;overflow:hidden;
    background:url("生图/W-面板-中.png") center/100% 100% no-repeat;
    image-rendering:pixelated;padding:30px 34px 46px;   /* 底部多留：避开描边花纹 */
    filter:drop-shadow(0 10px 26px rgba(40,20,32,.5));
    font:13px "Songti SC","SimSun",serif;color:#4a3226}
  #me .me-head{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
  #me .me-head b{font-size:16px;letter-spacing:3px}
  #me .me-head s{text-decoration:none;font-size:9px;letter-spacing:2px;color:#b08a94}
  #me #meClose{margin-left:auto;width:26px;height:26px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;background:#fbe9f0;border:2px solid #b98298;
    border-radius:3px;color:#a86680;box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;padding:0}
  #me .me-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;padding-bottom:6px;
    /* 内容超出时底部淡出，提示可以往下滑，而不是硬生生切断 */
    mask-image:linear-gradient(180deg,#000 calc(100% - 20px),rgba(0,0,0,.25) 100%);
    -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 20px),rgba(0,0,0,.25) 100%)}
  #me .me-quick{display:flex;gap:6px;margin:8px 0 10px;flex:none}
  #me .me-quick button{flex:1;font:12px "Songti SC",serif;padding:7px 0;cursor:pointer;
    color:#5a3b4a;background:#fbe9f0;border:2px solid #b98298;border-radius:3px;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;touch-action:manipulation}
  #me .me-quick button:active{transform:translateY(1px)}
  #me .me-top{display:flex;gap:12px;align-items:center;
    border-bottom:1px dashed rgba(226,182,197,.75);padding-bottom:10px}
  #me #meFace{width:50px;height:50px;image-rendering:pixelated;flex:none;
    background:rgba(251,233,240);border:2px solid #b98298}
  #me .me-id{flex:1;min-width:0}
  #me .me-nm{font-size:15px;letter-spacing:1px}
  #me .me-nm b{color:#a8556f;font-size:12px;margin-left:6px;letter-spacing:0}
  #me .me-sub{font-size:11px;color:#9c8390;margin-top:2px}
  #me .me-xpwrap{display:flex;align-items:center;gap:6px;margin-top:5px}
  #me .me-xp{flex:1;height:9px;box-sizing:border-box;border:2px solid #5A3B2A;background:#EFE0CE}
  #me .me-xp i{display:block;height:100%;width:0;
    background:repeating-linear-gradient(90deg,#7BC96F 0 5px,#5FAF55 5px 8px)}
  #me .me-xpwrap span{font-size:10px;color:#9c8390;min-width:52px;text-align:right}
  #me .me-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  #me .me-cell{display:flex;justify-content:space-between;align-items:baseline;
    border:2px solid rgba(185,130,152,.5);background:rgba(255,254,251,.7);padding:5px 9px}
  #me .me-cell{padding:4px 8px}
  #me .me-cell span{font-size:10px;letter-spacing:1px;color:#b08a94}
  #me .me-cell b{color:#a8556f;font-size:13px}
  #me .me-equiprow{margin-top:8px;display:flex;justify-content:space-between;align-items:center;
    border:2px solid rgba(185,130,152,.5);background:rgba(255,254,251,.7);padding:6px 10px;
    font-size:12px;color:#7a5f68;cursor:pointer}
  #me .me-equiprow b{color:#a8556f}
  #me .me-stat{margin-top:7px;font-size:11px;line-height:1.65;color:#7a5f68;
    border-top:1px dashed rgba(226,182,197,.75);padding-top:7px}

  /* ================= 背包 ================= */
  #bagBtn{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(102px + env(safe-area-inset-bottom));z-index:20;
    font:13px "Songti SC",serif;padding:7px 12px;color:#4a3226;background:#fbe9f0;
    border:2px solid #b98298;border-radius:18px;box-shadow:0 5px 14px rgba(60,30,45,.3);
    cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #bagBtn .ico{width:14px;height:14px;vertical-align:-.16em;stroke:#a8556f}
  #bagBtn:active{transform:translateY(1px)}
  #bag{position:fixed;inset:0;z-index:44;display:none;align-items:center;
    justify-content:center;padding:14px;background:rgba(24,18,26,.66);touch-action:none}
  #bag.on{display:flex}
  #bag .bg-card{width:min(94vw,430px);max-height:calc(100dvh - 22px);box-sizing:border-box;
    display:flex;flex-direction:column;
    background:url("生图/W-面板-中.png") center/100% 100% no-repeat;
    image-rendering:pixelated;padding:46px 40px 40px;   /* 标题往下挪，别被花纹压住 */
    filter:drop-shadow(0 10px 26px rgba(40,20,32,.5));
    font:13px "Songti SC","SimSun",serif;color:#4a3226}
  #bag .bg-head{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
  #bag .bg-head b{font-size:16px;letter-spacing:3px}
  #bag .bg-head s{text-decoration:none;font-size:9px;letter-spacing:2px;color:#b08a94}
  #bag #bgClose{margin-left:auto;width:26px;height:26px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;background:#fbe9f0;border:2px solid #b98298;
    border-radius:3px;color:#a86680;box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;padding:0}
  #bag .bg-list{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;flex:1;
    display:flex;flex-direction:column;gap:7px;padding-right:2px}
  #bag .bg-grp{border:2px solid rgba(185,130,152,.5);background:rgba(255,254,251,.7);
    padding:6px 9px 7px}
  #bag .bg-t{font-size:10px;letter-spacing:2px;color:#b08a94;margin-bottom:4px}
  #bag .bg-r{display:flex;justify-content:space-between;font-size:13px;line-height:1.7}
  #bag .bg-r b{color:#a8556f}
  #bag .bg-empty{text-align:center;color:#9c8390;font-size:12px;padding:18px 0}
  #bag .bg-foot{border-top:1px dashed rgba(226,182,197,.8);margin-top:8px;padding-top:7px;
    font-size:11px;color:#7a5f68;display:flex;gap:12px;flex-wrap:wrap}

  /* ================= 挖矿按钮（底部，和工具栏同一套像素风）================= */
  #minebar{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));z-index:11;
    display:flex;justify-content:center}
  #minebar .mb-in{display:flex;flex-direction:column;align-items:center;gap:7px}
  #minebar .mb-track{width:100%;height:14px;box-sizing:border-box;
    border:3px solid #5A3B2A;background:#EFE0CE;overflow:hidden}
  #minebar .mb-track i{display:block;height:100%;width:0;
    background:repeating-linear-gradient(90deg,#E8C24A 0 7px,#C89A2A 7px 11px);
    transition:width .06s linear}
  #mineBtn{display:flex;align-items:center;gap:8px;cursor:pointer;
    padding:12px 22px;box-sizing:border-box;min-height:56px;
    font:15px "Songti SC","SimSun",serif;letter-spacing:1px;color:#4A3226;
    background:#FDF0D5;border:3px solid #5A3B2A;border-radius:0;
    box-shadow:inset 0 3px 0 #fff, inset 0 -3px 0 #E8D3AE;
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #mineBtn .ico{width:20px;height:20px;stroke:#4A3226}
  #mineBtn:active{transform:translateY(2px);
    box-shadow:inset 0 3px 0 #E8D3AE, inset 0 -3px 0 #fff}

  /* ================= 钓鱼（沿用聊天窗那块像素面板）================= */
  #fishing{position:fixed;inset:0;z-index:47;display:none;align-items:center;
    justify-content:center;padding:14px;background:rgba(24,18,26,.66);touch-action:none}
  #fishing.on{display:flex}
  #fishing .fi-card{width:min(94vw,470px);box-sizing:border-box;
    background:url("生图/W-面板-中.png") center/100% 100% no-repeat;
    image-rendering:pixelated;border:0;border-radius:0;
    padding:34px 40px 32px;
    filter:drop-shadow(0 10px 26px rgba(40,20,32,.5));
    font:13px "Songti SC","SimSun",serif;color:#4a3226}
  #fishing .fi-head{display:flex;align-items:baseline;gap:7px;margin-bottom:10px}
  #fishing .fi-head b{font-size:16px;letter-spacing:3px}
  #fishing .fi-head s{text-decoration:none;font-size:9px;letter-spacing:2px;color:#b08a94}
  #fishing #fiClose{margin-left:auto;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:#fbe9f0;border:2px solid #b98298;border-radius:3px;color:#a86680;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2;padding:0}
  #fishing .fi-body{display:flex;gap:14px;align-items:stretch}
  /* 水槽：硬边像素水，不用渐变 */
  #fishing .fi-track{position:relative;width:74px;height:190px;box-sizing:border-box;
    border:3px solid #5A3B2A;border-radius:0;
    background:repeating-linear-gradient(180deg,#9FD8F5 0 12px,#7FC4DE 12px 24px)}
  #fishing #fiGreen{position:absolute;left:2px;right:2px;height:26%;
    background:rgba(123,201,111,.72);border:3px solid #2F6B2A;box-sizing:border-box;border-radius:0}
  #fishing #fiFish{position:absolute;left:50%;margin-left:-10px;margin-top:-7px;line-height:0}
  #fishing .fi-side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px}
  #fishing .fi-prog{height:18px;box-sizing:border-box;border:3px solid #5A3B2A;
    background:#EFE0CE;overflow:hidden;border-radius:0}
  #fishing .fi-prog i{display:block;height:100%;width:40%;border-radius:0;
    background:repeating-linear-gradient(90deg,#7BC96F 0 7px,#5FAF55 7px 11px);
    transition:width .08s linear}
  #fishing .fi-pct{text-align:center;font-size:14px;letter-spacing:1px}
  #fishing .fi-pct b{color:#4E8C3E;font-size:17px}
  #fishing .fi-tip{font-size:10px;line-height:1.6;color:#9c8390;text-align:center;letter-spacing:.5px}
  #fishing #fiHold{margin-top:12px;width:100%;padding:11px 0;cursor:pointer;
    font:15px "Songti SC","SimSun",serif;letter-spacing:3px;color:#4A3226;
    background:#F7B6C8;border:3px solid #5A3B2A;border-radius:0;
    box-shadow:inset 0 3px 0 #fff, inset 0 -3px 0 #E08CA8;
    touch-action:none;user-select:none;-webkit-user-select:none}
  #fishing #fiHold:active{transform:translateY(2px);
    box-shadow:inset 0 3px 0 #E08CA8, inset 0 -3px 0 #fff}

  /* ================= 商店 ================= */
  #shop{position:fixed;inset:0;z-index:45;display:none;align-items:center;
    justify-content:center;padding:18px;background:rgba(24,18,26,.72);touch-action:none}
  #shop.on{display:flex}
  #shop .sh-card{position:relative;width:min(96vw,560px);
    max-height:calc(100dvh - 36px);display:flex;flex-direction:column;
    background:#fdf6f9;
    border:2px solid #b98298;border-radius:14px;padding:14px 16px 12px;
    box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 2px 0 #fff;
    font:13px "Songti SC",serif;color:#4a3226}
  #shop .sh-head{display:flex;align-items:baseline;gap:8px;
    border-bottom:1px dashed rgba(226,182,197,.8);padding-bottom:8px;margin-bottom:10px}
  #shop .sh-head b{font-size:17px;letter-spacing:2px}
  #shop .sh-sub{font-size:9px;letter-spacing:1.6px;color:#b08a94}
  #shop #shClose{margin-left:auto;width:28px;height:28px;border-radius:50%;
    border:1px solid rgba(226,182,197,.9);background:#fff;color:#a86680;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  #shop .sh-sec{font-size:10px;letter-spacing:2px;color:#b08a94;
    padding:6px 2px 1px;border-bottom:1px dashed rgba(226,182,197,.55)}
  #shop .sh-list{overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:6px;padding-right:2px;min-height:0;flex:1}
  #shop .sh-row.sh-off{opacity:.55}
  #shop .sh-row.sh-info{justify-content:flex-start;background:rgba(255,252,247,.6)}
  #shop .sh-row.sh-info .sh-price{margin-left:auto;margin-right:10px}
  #shop .sh-row.sh-done{background:rgba(232,246,226,.75);border-color:rgba(123,201,111,.7)}
  #shop .sh-badge{font-size:11px;letter-spacing:1px;padding:4px 10px;min-width:58px;text-align:center;
    border:2px solid #cf9db3;border-radius:3px;color:#a8556f;background:#fbe9f0;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #e6c3d2}
  #shop .sh-badge.on{border-color:#6FB463;color:#3F7A38;background:#e8f6e2;
    box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #c8e4bf}
  #shop .sh-bar{position:relative;flex:0 0 auto;width:100%;height:20px;margin:8px 0 4px;
    box-sizing:border-box;border:2px solid #5A3B2A;background:#EFE0CE;border-radius:2px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
  #shop .sh-bar i{display:block;height:100%;
    background:repeating-linear-gradient(90deg,#F7C89C 0 7px,#E39A66 7px 10px)}
  #shop .sh-bar s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:11px;color:#4a3226;letter-spacing:1.5px;
    text-shadow:0 0 3px #FFF6EC,0 0 3px #FFF6EC,0 0 2px #FFF6EC}
  #shop .sh-row.sh-info .sh-nm{font-size:13px}
  #shop .sh-buy{flex:none}
  #shop .sh-row{display:flex;align-items:center;gap:10px;padding:8px 6px;
    background:linear-gradient(#fffefb,#fffaf4);border:1px solid rgba(226,182,197,.6);
    border-radius:10px}
  #shop .sh-ico{width:22px;height:22px;stroke:#5A8A5A}
  #shop .sh-nm{flex:1;font-size:14px}
  #shop .sh-nm span{display:block;font-size:10px;color:#a0848e;margin-top:2px;letter-spacing:.3px}
  #shop .sh-price{font-size:13px;color:#a8556f;min-width:48px;text-align:right}
  #shop .sh-buy{font:12px "Songti SC",serif;padding:7px 11px;border-radius:8px;
    border:1px solid #b98298;background:#fbe9f0;color:#4a3226;cursor:pointer;
    touch-action:manipulation}
  #shop .sh-buy:active{background:#f3d6e2;transform:translateY(1px)}
  #shop .sh-foot{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;
    padding-top:8px;border-top:1px dashed rgba(226,182,197,.8);
    font-size:11px;color:#7a5f68}
  #shop .sh-foot b{color:#a8556f}

  /* 横屏（412 高）下商店压紧，一屏多看几行 */
  @media (max-height:520px){
    #shop .sh-card{padding:10px 12px 8px}
    #shop .sh-head{padding-bottom:6px;margin-bottom:8px}
    #shop .sh-head b{font-size:15px}
    #shop .sh-row{padding:5px 7px}
    #shop .sh-nm{font-size:13px}
    #shop .sh-nm span{font-size:9px;margin-top:1px}
    #shop .sh-price{font-size:12px;min-width:44px}
    #shop .sh-buy{padding:5px 9px;font-size:11px}
    #shop .sh-ico{width:18px;height:18px}
    #shop .sh-foot{margin-top:6px;padding-top:6px;font-size:10px}
  }

  /* ================= 种子条 & 选种子 ================= */
  #seedChip{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(120px + env(safe-area-inset-bottom));z-index:10;display:none;
    align-items:center;gap:5px;height:26px;padding:0 12px;box-sizing:border-box;
    font:12px "Songti SC",serif;color:#3E5E32;background:rgba(255,252,246,.94);
    border:2px solid #9DBE8A;border-radius:14px;cursor:pointer;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
    transition:filter .3s linear, opacity .35s ease}
  body.in-farm #seedChip{display:inline-flex}
  #seedChip .ico{width:14px;height:14px;stroke:#5E9E4A}
  #seedChip:active{transform:translateX(-50%) translateY(1px)}
  #seedpick{position:fixed;inset:0;z-index:46;display:none;align-items:center;
    justify-content:center;padding:18px;background:rgba(24,18,26,.7);touch-action:none}
  #seedpick.on{display:flex}
  #seedpick .sp-card{width:min(96vw,420px);max-height:calc(100dvh - 40px);
    display:flex;flex-direction:column;background:#fdf6f9;border:2px solid #b98298;
    border-radius:14px;padding:12px 14px 10px;font:13px "Songti SC",serif;color:#4a3226;
    box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 2px 0 #fff}
  #seedpick .sp-head{display:flex;align-items:center;border-bottom:1px dashed rgba(226,182,197,.8);
    padding-bottom:8px;margin-bottom:8px}
  #seedpick .sp-head b{font-size:16px;letter-spacing:2px}
  #seedpick #spClose{margin-left:auto;width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(226,182,197,.9);background:#fff;color:#a86680;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  #seedpick .sp-list{overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:6px;padding-right:2px}
  #seedpick .sp-item{display:flex;align-items:center;gap:8px;width:100%;
    padding:9px 11px;border:1px solid rgba(226,182,197,.7);border-radius:9px;
    background:#fffefb;color:#4a3226;font:13px "Songti SC",serif;cursor:pointer;
    text-align:left;touch-action:manipulation}
  #seedpick .sp-item.on{border-color:#9DBE8A;background:#f2f9ee}
  #seedpick .sp-item.off{opacity:.5}
  #seedpick .sp-nm{flex:1}
  #seedpick .sp-ct{color:#a8556f}
  #seedpick .sp-tag{font-size:10px;color:#9c8390;min-width:40px;text-align:right}
  #seedpick .sp-empty{padding:16px 4px;font-size:12px;color:#9c8390;text-align:center}

  /* ================= 勾线图标（替掉界面里的 emoji）================= */
  /* stroke=currentColor：跟着文字颜色走，夜间 filter 也会一起变暗 */
  .ico{width:1.15em;height:1.15em;vertical-align:-.18em;flex:none;
    fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;display:inline-block}
  #tools .ico{width:21px;height:21px;vertical-align:0}
  #canicon .ico{width:15px;height:15px;vertical-align:-.2em;stroke:#3D7FB0}
  #chatOpen .ico,#mapBtn .ico{width:14px;height:14px;vertical-align:-.16em}
  #chatClose .ico,#bmClose .ico{width:14px;height:14px;vertical-align:0}
  #bmClose .ico{width:18px;height:18px}

  /* ================= 手机可玩性补丁（第 0.5 步）================= */
  /* 夜间 UI 跟场景一起变暗：--dk 由渲染循环写入（0=白天 0.82=全黑） */
  :root{--dk:0}
  #hud,#tip,#farmnav,#canbar,#tools,#chatWin,#chatOpen,
  #toast,#saveTip,#mapBtn,#enter,#seedChip,#minebar,#bagBtn,#meBtn,#guideBtn{filter:brightness(calc(1 - var(--dk) * 0.46));
    transition:filter .3s linear}

  #mapBtn{position:fixed;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(56px + env(safe-area-inset-bottom));z-index:20;
    font:13px "Songti SC",serif;padding:7px 12px;color:#4a3226;background:#fbe9f0;
    border:2px solid #b98298;border-radius:18px;box-shadow:0 5px 14px rgba(60,30,45,.3);
    cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #mapBtn:active{transform:translateY(1px)}

  /* 大地图覆盖层：只做“看全局 + 点着走”，游戏画面本身仍然 1:1 不缩放 */
  #bigmap{position:fixed;inset:0;z-index:40;display:none;
    background:rgba(24,18,26,.9);align-items:center;justify-content:center;touch-action:none}
  #bigmap.on{display:flex}
  #bmc{display:block;touch-action:none;
    box-shadow:0 0 0 3px #F7D9E3,0 0 0 5px #5A3B2A,0 18px 44px rgba(0,0,0,.6)}
  /* ★ 5.66：右上角这块和 App 的「退出星露谷」X（8px / 32px）叠在一起，
     用户点退出经常点成关地图。地图层的 X 往下让开，并抬到最上层。 */
  #bmClose{position:fixed;right:calc(14px + env(safe-area-inset-right));
    top:calc(66px + env(safe-area-inset-top));z-index:60;width:44px;height:44px;
    font:18px/1 "Songti SC",serif;color:#4a3226;background:#fbe9f0;border:2px solid #b98298;
    border-radius:50%;cursor:pointer;touch-action:manipulation}
  #bmHint{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(12px + env(safe-area-inset-bottom));z-index:41;
    font:12px "Songti SC",serif;color:#fbe9f0;background:rgba(90,59,42,.78);
    padding:5px 14px;border-radius:14px;white-space:nowrap;pointer-events:none}

  /* 竖屏提示：世界图是 4:3，横过来能看到两倍的地 */
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#2b2026;
    color:#fbe9f0;font:14px "Songti SC",serif;letter-spacing:1px;text-align:center;
    padding:24px;line-height:1.7}
  #rotate.on{display:flex}
  #rotate b{font-size:20px;letter-spacing:3px}
  #rotate small{opacity:.72;font-size:12px}
  #rotate button{font:14px "Songti SC",serif;padding:10px 22px;border-radius:20px;
    color:#4a3226;background:#fbe9f0;border:2px solid #b98298;cursor:pointer;
    touch-action:manipulation}
  #rotate .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* 工具栏别一直杵在菜地上：不操作就淡下去（.idle 由 JS 加） */
  #tools,#canbar,#seedChip{transition:filter .3s linear, opacity .35s ease}
  #tools.idle,#canbar.idle,#seedChip.idle{opacity:.3}
  #tools{bottom:calc(10px + env(safe-area-inset-bottom))}
  #canbar{bottom:calc(86px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<!-- 勾线图标库：界面里不再用 emoji，全部走这套 line-art（stroke=currentColor，跟着文字着色/变暗） -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true"><defs>
  <symbol id="i-hoe" viewBox="0 0 24 24">
    <path d="M12 3.5 V12"/><path d="M9.5 3.5 H14.5"/>

  </symbol>

    <path d="M4 11 H12.5 V19 H4 Z"/><path d="M5.5 11 C5.5 7 10.5 7 10.5 11"/>
    <path d="M12.5 13 L20 10"/>
    <path d="M19 14.5 C20.2 16 21 17 21 18"/>
  </symbol>
  <symbol id="i-drop" viewBox="0 0 24 24">

  </symbol>
  <symbol id="i-sprout" viewBox="0 0 24 24">

    <path d="M12 14.5 C16 14.5 18.5 12.5 18.5 9 C14.5 9 12 11 12 14.5 Z"/>
  </symbol>
  <symbol id="i-seed" viewBox="0 0 24 24">
    <path d="M3 20.5 H21"/>

    <path d="M12 13.5 C9.5 13.5 8 12 8 10 C10.5 10 12 11.5 12 13.5 Z"/>
    <path d="M12 13.5 C14.5 13.5 16 12 16 10 C13.5 10 12 11.5 12 13.5 Z"/>
  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24">
    <path d="M12 20 C12 20 3.5 14.8 3.5 9.8 A4.2 4.2 0 0 1 12 8.2 A4.2 4.2 0 0 1 20.5 9.8 C20.5 14.8 12 20 12 20 Z"/>
  </symbol>
  <symbol id="i-coin" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M9.5 8.5 L12 12 L14.5 8.5"/><path d="M12 12 V16.5"/>

    <path d="M9 4.5 V17.5"/><path d="M15 6.5 V19.5"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6.5 6.5 L17.5 17.5"/><path d="M17.5 6.5 L6.5 17.5"/>
  </symbol>
</defs></svg>
<canvas id="c"></canvas>
<div class="ui" id="hud">星露谷 · 全局图</div>
<div class="ui" id="dbg"></div>
<button id="sndBtn" title="音效 / 音乐"><span id="sndTxt">◔</span></button>
<button class="ui" id="exitBtn" style="display:none">离开</button>
<button class="ui" id="pageBtn" style="display:none">下一页 ▸</button>
<button id="zoomBtn" title="画面缩放">⤢ 1×</button>
<button id="liftBtn" style="display:none">电梯</button>
<button id="atkBtn" style="display:none"><svg class="ico" aria-hidden="true"><use href="#i-hoe"/></svg><span id="atkLabel">攻击</span></button>
<div class="ui" id="tip">点地面走路 · WASD/方向键 · F1 调试</div>
<div class="ui" id="zoom" style="display:none"><button id="zo">−</button><button id="zi">+</button></div>
<div class="ui" id="enter">进入</div>
<div id="saveTip">已存档 ✓</div>
<div id="farmnav" style="display:none">
  <button id="prevFarm">◀</button>
  <span id="farmLabel">1 / 1</span>
  <button id="nextFarm">▶</button>
  <button id="expandFarm">＋ 扩建</button>
</div>
<div id="canbar" style="display:none">
  <span id="canicon"><svg class="ico" aria-hidden="true"><use href="#i-drop"/></svg></span>
  <div id="cantrack"><div id="canfill"></div></div>
  <span id="cantext">20/20</span>
</div>
<div id="tools" style="display:none">

/* ============ 委托 ============ */
function questCandidates(){
  const list = [];
  for(const k in CROPS)   list.push({ pool:'crops',   key:k, name:CROPS[k].name,   unit:CROPS[k].sell });
  for(const k in GOODS)   list.push({ pool:'goods',   key:k, name:GOODS[k].name,   unit:GOODS[k].binValue });
  for(const k in ORES)    list.push({ pool:'ores',    key:k, name:ORES[k].name,    unit:ORES[k].sell });
  for(const k in CRAFTED) list.push({ pool:'crafted', key:k, name:CRAFTED[k].name, unit:CRAFTED[k].sell });
  return list;
}
function makeQuest(){
  const c = questCandidates();
  const p = c[Math.floor(Math.random() * c.length)];
  const need = 3 + Math.floor(Math.random() * 4);
  return { pool:p.pool, key:p.key, name:p.name, need, reward: Math.round(p.unit * need * 1.6) };
}
function questHave(q){
  const g = GAME[q.pool];
  return (g && g[q.key]) || 0;
}

/* ============ 放置物（洒水器 / 稻草人）============ */
const PLACES = {
  sprinkler:{ name:'洒水器', icon:'i-can', desc:'每天早上自动浇周围 8 格' },
  scarecrow:{ name:'稻草人', icon:'i-sprout', desc:'半径 4 格内保护作物不被乌鸦吃' }
};
function farmPlaced(){ return (GAME.placed || []).filter(p => p.farm === farmIdx); }
function placeAt(pl){
  if(!pl) return;
  const kind = GAME.placeSel || 'sprinkler';
  if(MACHINES[kind]){
    if(((GAME.place && GAME.place[kind]) || 0) <= 0){ toast(MACHINES[kind].name + '没有了 · 去加工台做一个'); return; }
    if(machineAt(pl.r, pl.c)){ toast('这里已经有机器了'); return; }
    if(pl.crop){ toast('这块地上有作物'); return; }
    GAME.machines = GAME.machines || [];
    GAME.machines.push({ farm: farmIdx, r: pl.r, c: pl.c, kind, job:null, out:null });
    GAME.place[kind]--;
    sfx.seed(); toast('放好了 ' + MACHINES[kind].name + '（用「种/收」点它可以投入材料）');
    saveGame(); return;
  }
  if(((GAME.place && GAME.place[kind]) || 0) <= 0){
    toast(PLACES[kind].name + '没有了 · 去加工台做一个'); return;
  }
  if((GAME.placed || []).some(p => p.farm === farmIdx && p.r === pl.r && p.c === pl.c)){
    toast('这里已经有东西了'); return;
  }
  if(pl.crop){ toast('这块地上有作物'); return; }
  GAME.placed = GAME.placed || [];
  GAME.placed.push({ farm: farmIdx, r: pl.r, c: pl.c, kind });
  GAME.place[kind]--;
  sfx.seed();
  toast('放好了　' + PLACES[kind].name);
  saveGame();
}
function cyclePlace(){
  const have = GAME.place || {};
  const list = Object.keys(PLACES).filter(k => (have[k] || 0) > 0);
  if(!list.length){ toast('没有可放的东西 · 先去加工台做'); return; }
  const i = list.indexOf(GAME.placeSel);
  GAME.placeSel = list[(i + 1) % list.length];
  toast('放置：' + PLACES[GAME.placeSel].name + '（' + have[GAME.placeSel] + ' 个）');
}


/* ============ 五项技能（对齐星露谷） ============ */
const SKILLS = [
  { id:'farm',   name:'种植', desc:'收获作物 / 照顾动物' },
  { id:'mine',   name:'采矿', desc:'敲碎矿石' },
  { id:'forag',  name:'采集', desc:'砍树 / 捡硬木' },
  { id:'fish',   name:'钓鱼', desc:'钓上鱼' },
  { id:'combat', name:'战斗', desc:'击杀怪物' }
];
/* 星露谷原版经验曲线（升到该级所需累计经验） */
const SKILL_XP = [0, 100, 380, 770, 1300, 2150, 3300, 4800, 6900, 10000, 15000];
function skillLv(k){ return (GAME.skills && GAME.skills[k]) || 0; }
function skillXp(k){ return (GAME.skillXp && GAME.skillXp[k]) || 0; }
function skillNeed(k){ return SKILL_XP[Math.min(10, skillLv(k) + 1)] - SKILL_XP[Math.min(10, skillLv(k))]; }
function addSkillXp(k, n){
  GAME.skills = GAME.skills || {};
  GAME.skillXp = GAME.skillXp || {};
  if((GAME.skills[k] || 0) >= 10) return;
  GAME.skillXp[k] = (GAME.skillXp[k] || 0) + n;
  let guard = 0;
  /* 注意：SKILL_XP 是累计值，升级只看"本级的差值" */
  while((GAME.skills[k] || 0) < 10 && guard++ < 12){
    const lv0 = GAME.skills[k] || 0;
    const step = SKILL_XP[lv0 + 1] - SKILL_XP[lv0];
    if(GAME.skillXp[k] < step) break;
    GAME.skillXp[k] -= step;
    GAME.skills[k] = (GAME.skills[k] || 0) + 1;
    const nm = (SKILLS.find(x => x.id === k) || {}).name || k;
    toast(nm + ' 技能升级 → Lv.' + GAME.skills[k], 2400);
    sfx.levelUp();
    if(k === 'combat'){ GAME.maxHp = (GAME.maxHp || 100) + 5; GAME.hp = GAME.maxHp; }
    if(GAME.skills[k] === 5){  toast(nm + ' Lv.5 · 可以选职业了（个人 → 技能）', 3000); pickProf(k, 5); }
    if(GAME.skills[k] === 10){ toast(nm + ' 满级 Lv.10 · 再选一个职业！', 3200); pickProf(k, 10); }
    bump('skillUp');
  }
  saveGame();
}
/* 技能带来的减免：每级 -0.1 体力（星露谷同款规则） */
function carency(k, base){
  return Math.max(1, +(base - skillLv(k) * 0.1).toFixed(1));
}

    { from:{ pool:'crops', key:'strawberry', n:3 }, out:'jam', min:50, label:'草莓×3 → 草莓酱' },
    { from:{ pool:'crops', key:'tomato',     n:3 }, out:'jam', min:50, label:'番茄×3 → 草莓酱' }
  ]},
  press:   { name:'奶酪机', cost:{copperBar:2, hardwood:2}, jobs:[
    { from:{ pool:'goods', key:'milk', n:1 }, out:'cheese', min:90, label:'牛奶×1 → 奶酪' }
  ]}
};
function machineAt(r, c){
  return (GAME.machines || []).find(m => m.farm === farmIdx && m.r === r && m.c === c) || null;
}
function tickMachines(){
  if(!GAME.machines || !GAME.machines.length) return;
  const now = absMin();
  for(const m of GAME.machines){
    if(m.job && m.job.finish <= now){
      const outId = m.job.out;
      m.out = m.out || {};
      m.out[outId] = (m.out[outId] || 0) + 1;
      m.job = null;
      toast(MACHINES[m.kind].name + ' 做好了　' + ((CRAFTED[outId] && CRAFTED[outId].name) || outId), 2200);
      sfx.harvest();
      saveGame();
    }
  }
}
function openMachine(m){
  const def = MACHINES[m.kind];
  const items = [{ head: def.name }];
  if(m.job){
    const left = Math.max(0, m.job.finish - absMin());
    items.push({ bar: 100 - Math.min(100, left / Math.max(1, m.job.total) * 100),
                 barText: '还要 ' + Math.round(left) + ' 游戏分钟' });
    items.push({ info:true, name:'正在做 ' + ((CRAFTED[m.job.out] && CRAFTED[m.job.out].name) || m.job.out),
                 desc:'到时间自动完成，再来收取' });
  } else {
    if(m.out){
      for(const k in m.out){
        if(!m.out[k]) continue;
        items.push({ key:'take_'+k, mode:'gift', takeOut:k, name:'收取 ' +
                     ((CRAFTED[k] && CRAFTED[k].name) || k) + ' ×' + m.out[k],
                     icon:'i-sprout', price:0, priceText:'收', bulk:false, desc:'放进背包' });
      }
    }
    items.push({ head:'投入材料' });
    def.jobs.forEach((j, i)=>{
      const have = (GAME[j.from.pool] || {})[j.from.key] || 0;
      items.push({ key:'start_'+i, mode:'craft', startJob:i, name:j.label, icon:'i-hoe',
                   price:0, priceText:'开做', bulk:false, off: have < j.from.n,
                   desc:'你有 ' + have + '/' + j.from.n });
    });
  }
  openMarket({
    title: def.name, sub:'MACHINE', items, rebuild:()=>openMachine(m), noMkt:true,
    onBuy(it){
      if(it.takeOut){
        const n = m.out[it.takeOut] || 0;
        if(n <= 0) return;
        GAME.crafted[it.takeOut] = (GAME.crafted[it.takeOut] || 0) + n;
        m.out[it.takeOut] = 0;
        sfx.coin();
        toast('收取 ' + ((CRAFTED[it.takeOut] && CRAFTED[it.takeOut].name) || it.takeOut) + ' ×' + n);
        rebuildMarket(); saveGame(); return;
      }
      if(it.startJob != null){
        const j = def.jobs[it.startJob];
        if(((GAME[j.from.pool] || {})[j.from.key] || 0) < j.from.n){ toast('材料不够'); return; }
        GAME[j.from.pool][j.from.key] -= j.from.n;
        m.job = { out: j.out, finish: absMin() + j.min, total: j.min };
        sfx.seed();
        toast('开始做 ' + ((CRAFTED[j.out] && CRAFTED[j.out].name) || j.out) + '（' + j.min + ' 分钟）');
        rebuildMarket(); saveGame();
      }
    }
  });
}


/* ============ AI 命令层（玩家与 AI 共用同一套动作） ============ */
window.SV = (function(){
  const listeners = [];
  function state(){
    const farm = farms[farmIdx] || [];
    let watered = 0, ready = 0, planted = 0;
    for(const pl of farm){
      if(pl.crop) planted++;

    }
    return {
      day: GAME.day, season: SEASON_NAMES[GAME.season], weather,
      minutes: GAME.minutes, gold: GAME.gold|0, energy: Math.round(energy), maxEnergy: maxEnergy(),
      hp: GAME.hp, maxHp: GAME.maxHp, level: GAME.level|0,
      scene: scene === 'sub' ? (curScene && curScene.name) : (scene === 'farm' ? '农场' : '大世界'),
      mineLayer: GAME.mineLayer||1, mineMax: GAME.mineMax||1,
      player: { x: Math.round(P.x), y: Math.round(P.y) },
      ta: TA ? { x: Math.round(TA.x), y: Math.round(TA.y),
                 dist: Math.round(Math.hypot(TA.x - P.x, TA.y - P.y)) } : null,
      farm: { idx: farmIdx, plots: farm.length, planted, watered, ready, greenhouse: !!GAME.greenhouse },
      crops: Object.assign({}, GAME.crops||{}),
      goods: Object.assign({}, GAME.goods||{}),
      ores: Object.assign({}, GAME.ores||{}),
      crafted: Object.assign({}, GAME.crafted||{}),
      animals: Object.assign({}, GAME.animals||{}), feed: GAME.feed|0,
      bins: GAME.bin ? { qty: GAME.bin.qty, value: GAME.bin.value } : null,
      skills: Object.assign({}, GAME.skills||{}),
      rod: (RODS[GAME.rodLv||0]||RODS[0]).name,
      weapon: (WEAPONS[GAME.weaponLv||0]||WEAPONS[0]).name
    };
  }
  /* 统一返回：{ok, msg, state} */
  function run(cmd, args){
    args = args || {};
    try{
      const fn = CMDS[cmd];
      if(!fn) return { ok:false, msg:'没有这个动作：' + cmd
        + '。可用：' + Object.keys(CMDS).join(' / ') };
      const r = fn(args) || {};
      saveGame();
      const _ok = r.ok !== false;
      /* 记「这一觉之后干了多少活」：查状态 / 说话 / 睡觉本身都不算，
         用来挡住"连睡刷天数"（见 sleep） */
      if(_ok && cmd !== 'state' && cmd !== 'say' && cmd !== 'sleep'){
        GAME.actsSinceSleep = (GAME.actsSinceSleep || 0) + 1;
      }
      return { ok: _ok, msg: r.msg || '完成', state: state() };
    }catch(e){
      return { ok:false, msg:'出错：' + (e && e.message || e) };
    }
  }
  const CMDS = {
    /* 看 */
    state(){
      const s = state();
      const hh = Math.floor(s.minutes / 60) % 24, mm = Math.floor((s.minutes % 60) / 10) * 10;
      const f = s.farm || {};
      const seeds = Object.keys(GAME.seedsBy || {})
        .filter(k => (GAME.seedsBy[k] || 0) > 0)
        .map(k => ((CROPS[k] && CROPS[k].name) || k) + '×' + GAME.seedsBy[k]).join('、');
      let m = s.season + s.day + '日 ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0')
        + ' · 天气' + s.weather
        + ' · 金' + s.gold
        + ' · 体力' + s.energy + '/' + s.maxEnergy
        + ' · HP' + s.hp + '/' + s.maxHp
        + ' · ' + s.scene
        + ' · 位置(' + s.player.x + ',' + s.player.y + ')'
        + ' · 农场' + (f.plots || 0) + '格 已种' + (f.planted || 0) + ' 已浇' + (f.watered || 0) + ' 可收' + (f.ready || 0);
      if(s.bin && s.bin.value) m += ' · 出货箱' + s.bin.qty + '件（明早' + s.bin.value + '金）';
      if(s.mineLayer > 1) m += ' · 矿洞第' + s.mineLayer + '/' + s.mineMax + '层';
      if(seeds) m += ' · 种子' + seeds;
      if(scene !== 'farm') m += ' · 不在农场（种地要先 goto{"to":"farm"}）';
      return { msg: m };
    },
    /* 走 —— 认场景。
       ★ 跨场景一律「直接到」：teAI.play 里 goto 一返回，模型下一步马上就会下命令。
         要是让它慢慢走过去，下一步就撞上「不在农场」，又绕回死循环。
         同场景里的点（菜地/水井/出货箱/农舍门/加工台）照旧寻路走过去。 */
    goto(a){
      const t = a.to;
      /* 农场里的固定落脚点 */
      const FARM_SPOT = {
        well:  { x:1100, y:430 },
        bin:   { x:659,  y:380 },
        door:  { x:470,  y:330 },
        bench: { x:610,  y:330 },
        plots: { x:FARM.plot.x + 90, y:rowTop(0) + 40 }
      };
      const SCENE_OF = { shop:'shop', town:'town', mine:'mine', rail:'rail',
                         tower:'tower', ranch:'ranch', beach:'beach', desert:'desert' };
      const WORD = { farm:'农场', house:'农舍', shop:'商店街', town:'镇中心', mine:'矿洞',
                     rail:'铁路', tower:'法师塔', ranch:'牧场', beach:'沙滩', desert:'沙漠',
                     smith:'铁匠铺', well:'水井', bin:'出货箱', door:'农舍门', bench:'加工台', plots:'菜地' };

      function nowSceneId(){ return (scene === 'sub' && curScene) ? curScene.id : scene; }
      function toWorld(){ if(scene === 'sub') exitSubScene(); else if(scene === 'farm') exitFarm(); }
      function walkTo(x, y){ P.path = findPath(P.x, P.y, x, y) || null; return !!P.path; }

      /* ── A. 农场固定点：不在农场就直接回农场，再走过去 ── */
      if(typeof t === 'string' && FARM_SPOT[t]){
        if(scene !== 'farm'){ toWorld(); enterFarm(); }
        const d = FARM_SPOT[t];
        if(!walkTo(d.x, d.y)) return { ok:false, msg:'走不过去' };
        return { msg:'走向' + WORD[t] };
      }
      /* ── B. 农场 / 农舍 ── */
      if(t === 'farm' || t === 'house'){
        if(scene !== 'farm'){ toWorld(); enterFarm(); }
        if(t === 'house'){ enterSubScene('home'); return { msg:'进了农舍' }; }
        return { msg:'回到了农场' };
      }
      /* ── C. 小场景：直接进 ── */
      if(typeof t === 'string' && SCENE_OF[t]){
        const sid = SCENE_OF[t];
        if(nowSceneId() === sid) return { msg:'已经在' + WORD[t] + '了' };
        if(scene === 'sub' || scene === 'farm') toWorld();
        if(enterSubScene(sid)) return { msg:'进了' + WORD[t] };
        return { ok:false, msg:'进不去' + WORD[t] };
      }
      /* ── D. 铁匠铺是面板 ── */
      if(t === 'smith'){
        if(scene === 'sub' || scene === 'farm') toWorld();
        openSmithShop();
        return { msg:'打开了铁匠铺' };
      }
      /* ── E. 直接坐标（当前场景内寻路） ── */
      if(a.x != null && a.y != null){
        if(!walkTo(+a.x, +a.y)) return { ok:false, msg:'走不过去' };
        return { msg:'开始走向 (' + (+a.x) + ',' + (+a.y) + ')' };
      }
      return { ok:false, msg:'不知道去哪：' + t
        + '。可用：农场/农舍/菜地/水井/出货箱/加工台/商店街/镇中心/矿洞/铁路/法师塔/牧场/沙滩/沙漠/铁匠铺，或 {x,y}' };

    },
    /* 种田 */
    water(){
      if(scene !== 'farm') return { ok:false, msg:'不在农场——先 goto{"to":"farm"} 进农场' };
      let n = 0;
      for(const pl of (farms[farmIdx]||[])){
        if(!pl.tilled || !pl.crop || pl.watered) continue;
        if(energy < 1) break;
        energy -= carency('farm', 2); pl.watered = true; n++;
        if(n >= 40) break;
      }
      return n ? { msg:'浇了 ' + n + ' 格' } : { ok:false, msg:'没有需要浇的地' };
    },
    harvest(){
      if(scene !== 'farm') return { ok:false, msg:'不在农场——先 goto{"to":"farm"} 进农场' };
      let n = 0;
      for(const pl of (farms[farmIdx]||[])){
        if(pl.crop && pl.stage >= 99){ tool = 'hand'; usePlot(pl); n++; }
      }
      return n ? { msg:'收了 ' + n + ' 株' } : { ok:false, msg:'没有成熟的作物' };
    },
    /* 采集：砍硬木 */
    chop(){
      const used = GAME.hardToday || 0;
      const cost = used >= 8 ? 12 : 6;
      if(energy < cost) return { ok:false, msg:'体力不够（要 ' + cost + '）' };
      energy -= carency('forag', cost);
      GAME.hardToday = used + 1;
      GAME.crafted.hardwood = (GAME.crafted.hardwood||0) + 1;
      addSkillXp('forag', 12);
      sfx.chop(); showFx('咔嚓！硬木 +1', 'good', 1100);
      return { msg:'砍到 1 块硬木（今天第 ' + GAME.hardToday + ' 次，耗 ' + cost + ' 体力）' };
    },
    /* 种田（续） */
    till(){
      if(scene !== 'farm') return { ok:false, msg:'不在农场——先 goto{"to":"farm"} 进农场' };
      const pl=(farms[farmIdx]||[]).find(x=>!x.tilled && !x.crop);
      if(!pl) return { ok:false, msg:'没有空地了' };
      if(energy < 3) return { ok:false, msg:'体力不够' };
      tool='hoe'; usePlot(pl);
      return { msg:'锄了一格（第 ' + (pl.r+1) + ' 排 ' + (pl.c+1) + ' 列）' };
    },
    plant(a){
      if(scene !== 'farm') return { ok:false, msg:'不在农场——先 goto{"to":"farm"} 进农场' };
      const seed = a.seed || GAME.seedSel || firstOwnedSeed();
      if(!seed) return { ok:false, msg:'没有种子' };
      if(((GAME.seedsBy||{})[seed]||0) <= 0) return { ok:false, msg:'种子用完了：' + ((CROPS[seed]&&CROPS[seed].name)||seed) };
      const pl=(farms[farmIdx]||[]).find(x=>x.tilled && !x.crop);
      if(!pl) return { ok:false, msg:'没有已锄好的空地' };
      GAME.seedSel = seed; tool='seed'; usePlot(pl);
      return { msg:'种下 ' + ((CROPS[seed]&&CROPS[seed].name)||seed) };
    },
    fert(){
      if(scene !== 'farm') return { ok:false, msg:'不在农场——先 goto{"to":"farm"} 进农场' };
      const pl=(farms[farmIdx]||[]).find(x=>x.tilled && x.crop && !x.fert);
      if(!pl) return { ok:false, msg:'没有可施肥的地' };
      tool='fert'; usePlot(pl);
      return { msg:'施了一次肥' };
    },
    /* 钓鱼 */
    fish(){
      if(energy < 5) return { ok:false, msg:'体力不够' };
      if(scene !== 'sub' || !curScene || curScene.id !== 'beach') enterSubScene('beach');
      openFishing();
      return { msg:'已下竿，绿条交给 AI 控' };
    },
    /* 矿洞 */
    mine_enter(a){
      const lv = Math.max(1, Math.min(8, (a && a.layer) || GAME.mineLayer || 1));
      GAME.mineLayer = lv; enterSubScene('mine');
      return { msg:'进到矿洞第 ' + lv + ' 层' };
    },
    mine_tap(){
      if(scene !== 'sub' || !curScene || !curScene.mining) return { ok:false, msg:'不在矿洞' };
      if(energy < 4) return { ok:false, msg:'体力不够' };
      mineTap();
      return { msg:'敲了一下' };
    },
    attack(){
      if(scene !== 'sub' || !curScene || !curScene.mining) return { ok:false, msg:'不在矿洞' };
      const sl = nearestSlime();
      if(!sl) return { ok:false, msg:'附近没有怪' };
      playerAttack();
      return { msg:'挥了一剑' };
    },
    elevator(a){
      const lv = Math.max(1, Math.min(GAME.mineMax||1, (a&&a.layer)||1));
      GAME.mineLayer = lv;
      if(scene === 'sub' && curScene && curScene.name === '矿洞'){ buildMineNodes(); spawnSlimes(); }
      else enterSubScene('mine');
      return { msg:'电梯到第 ' + lv + ' 层' };
    },
    /* 采集 / 地点 */
    quarry(){ openQuarry(); return { msg:'打开了采石场', ui:'shop' }; },
    grove(){  openGrove();  return { msg:'打开了核桃林', ui:'shop' }; },

    craft(a){ openCraftShop(); return { msg:'打开了加工台', ui:'shop' }; },
    machine_put(a){ return { msg:'需要先指定机器', ok:false }; },

    shop_buy(){ openShop(); return { msg:'打开了杂货店', ui:'shop' }; },
    shop_sell(){ openShop(); return { msg:'打开了杂货店（卖货页）', ui:'shop' }; },

    eat(){
      if(typeof eatBestFood === 'function'){ const r = eatBestFood(); return { msg: r || '吃了一样东西' }; }
      return { ok:false, msg:'现在没有能吃的东西' };
    },
    sleep(){
      if(!(scene === 'sub' && curScene && curScene.id === 'home')){
        return { ok:false, msg:'要在农舍里才能睡（先 goto{"to":"house"} 进屋）' };
      }
      const acts = GAME.actsSinceSleep || 0;
      if(acts < 3){
        return { ok:false, msg:'刚睡醒没多久，先干点活再睡（这轮只做了 ' + acts + ' 个动作，至少 3 个）' };
      }
      GAME.actsSinceSleep = 0;
      endDay(); closeMarket && closeMarket();
      return { msg:'睡了一觉，进入第 ' + GAME.day + ' 天（' + weather + '）' };
    },
    say(a){
      if(TA && a.text){ TA.bubble = { text: String(a.text).slice(0,60), t: 4.5 }; }
      return { msg:'TA 说了：' + (a.text||'') };
    },
    /* 走到玩家身边。★ 之前没有这条命令：模型说「我过去找你」时
       只能嘴上说，玩家永远等不到人 —— 这就是"它说要去我这边但没过来"。 */
    come(a){
      if(!TA) return { ok:false, msg:'TA 不在场' };
      const dist = Math.round(Math.hypot(TA.x - P.x, TA.y - P.y));
      /* 已经贴着了就别再挤 */
      if(dist < 46){
        TA.path = null; TA.mode = 'command'; TA.wait = 1.2;
        return { msg:'已经在你身边了（' + dist + ' 像素）' };
      }
      const r = (typeof a.r === 'number') ? Math.max(20, Math.min(90, a.r)) : 34;
      const ang = Math.random() * Math.PI * 2;
      const tx = P.x + Math.cos(ang) * r;
      const ty = P.y + Math.abs(Math.sin(ang)) * r * 0.7 + 14;
      let walked = false;
      try{ walked = TA_API.goTo(tx, ty); }catch(e){}
      if(!walked){
        /* 走不过去（隔着墙/水/柜台）→ 直接站到玩家旁边，别让它卡在墙那头 */
        placeTANearPlayer();
        return { msg:'走到你身边了（中间过不去，我绕到旁边了）' };
      }
      return { msg:'正朝你走过来（还有 ' + dist + ' 像素）' };
    },
    /* 别再自己乱走了 */
    stop(){
      try{ if(window.TA_API) TA_API.stop(); }catch(e){}
      if(TA){ TA.path = null; TA.mode = 'command'; TA.wait = 999; }
      return { msg:'停下来了' };
    },
    /* 交易：直接买卖，不用点面板（AI 用这两个） */
    buy(a){
      const want = String(a.item || a.seed || a.name || '').trim();
      const n = Math.max(1, Math.min(99, parseInt(a.n, 10) || 1));
      if(!want) return { ok:false, msg:'买什么？给 {item:"草莓种子", n:1}' };
      let key = null;
      for(const k of Object.keys(CROPS)){
        const c = CROPS[k];
        if(k === want || c.name === want || (c.name + '种子') === want){ key = k; break; }
      }
      if(key){
        const c = CROPS[key];
        if(c.rare) return { ok:false, msg:c.name + '是稀有种子，只在沙漠商人那儿卖（先 goto{"to":"desert"}）' };
        const cost = c.buy * n;
        if(!payFor(cost)) return { ok:false, msg:'钱不够：要 ' + cost + ' 金，现在 ' + (GAME.gold|0) + ' 金' };
        GAME.seedsBy = GAME.seedsBy || {};
        GAME.seedsBy[key] = (GAME.seedsBy[key] || 0) + n;
        try{ refreshSeedChip(); }catch(e){} saveGame();
        return { msg:'买了 ' + n + ' 颗' + c.name + '种子，花 ' + cost + ' 金（剩 ' + (GAME.gold|0) + ' 金）' };
      }
      if(/肥料/.test(want)){
        const premium = /高级/.test(want);
        const unit = premium ? 120 : 40;
        const cost = unit * n;
        if(!payFor(cost)) return { ok:false, msg:'钱不够：要 ' + cost + ' 金，现在 ' + (GAME.gold|0) + ' 金' };
        GAME.fert = GAME.fert || {};
        const kk = premium ? 'premium' : 'basic';
        GAME.fert[kk] = (GAME.fert[kk] || 0) + n;
        saveGame();
        return { msg:'买了 ' + n + ' 份' + (premium ? '高级' : '基础') + '肥料，花 ' + cost + ' 金' };
      }
      if(/药水/.test(want)){
        const cost = 90 * n;
        if(!payFor(cost)) return { ok:false, msg:'钱不够：要 ' + cost + ' 金，现在 ' + (GAME.gold|0) + ' 金' };
        energy = Math.min(maxEnergy(), energy + 80 * n);
        saveGame();
        return { msg:'买了 ' + n + ' 瓶体力药水并喝下（体力 ' + Math.round(energy) + '/' + maxEnergy() + '）' };
      }
      return { ok:false, msg:'店里没有「' + want + '」。能买：种子（如"草莓种子"）/基础肥料/高级肥料/体力药水；稀有种子要先去沙漠' };
    },
    sell(a){

  };
  function emit(type, data){
    const ev = Object.assign({ type, at: Date.now(), day: GAME.day }, data||{});
    for(const cb of listeners){ try{ cb(ev); }catch(e){} }
    try{ if(window.parent && window.parent !== window) window.parent.postMessage({ __sv:'event', ev }, '*'); }catch(e){}

  }
  /* 接收父窗口（App）发来的命令 */
  try{

      }
    });
  }catch(e){}
  return { state, exec: run, emit, bus: { push: (cb)=>listeners.push(cb) } };
})();

/* ============ 作物品质（银 / 金） ============ */
/* GAME.cq[作物] = {s:银星数, g:金星数}；普通 = GAME.crops[作物] - s - g */
function cqOf(k){ GAME.cq = GAME.cq || {}; GAME.cq[k] = GAME.cq[k] || { s:0, g:0 }; return GAME.cq[k]; }
function cropTotal(k){ return (GAME.crops && GAME.crops[k]) || 0; }
/* 单次收获的品质概率：基础 银18% 金6%，施肥+，种植等级+，农业学家+ */
function rollQuality(){
  let sP = 0.18, gP = 0.06;
  const lv = skillLv('farm');
  sP += lv * 0.02; gP += lv * 0.01;
  let q = 0;                                   /* 0 普通 1 银 2 金 */
  if(Math.random() < gP) q = 2;
  else if(Math.random() < sP) q = 1;
  return q;
}
/* 出售 n 个时的总价：先卖金星、再银星、最后普通（含各倍率） */
function cropSellTotal(k, n, mulBase){
  const base = (CROPS[k] ? CROPS[k].sell : 0) * (mulBase || 1);
  const q = cqOf(k);
  const total = cropTotal(k);
  const normal = Math.max(0, total - q.s - q.g);
  let left = Math.min(n, total), sum = 0;
  const takeG = Math.min(left, q.g);  left -= takeG;  sum += takeG * base * 1.5;
  const takeS = Math.min(left, q.s);  left -= takeS;  sum += takeS * base * 1.25;
  sum += left * base;
  return { gold: Math.round(sum), gUsed: takeG, sUsed: takeS, nUsed: takeG + takeS + left };
}
/* 卖出后扣减库存（含品质） */
function cropConsume(k, n){
  const q = cqOf(k);
  let left = n;
  const dg = Math.min(left, q.g); q.g -= dg; left -= dg;
  const ds = Math.min(left, q.s); q.s -= ds; left -= ds;
  GAME.crops[k] = Math.max(0, (GAME.crops[k] || 0) - n);
  return { dg, ds };
}

/* ============ 小动画粒子：碎石 / 木屑 ============ */
let chips = [];
function spawnChips(x, y, col, n, spread){
  for(let i = 0; i < n; i++){
    chips.push({
      x, y,
      vx: (Math.random() - 0.5) * (spread || 150),
      vy: -60 - Math.random() * 120,
      life: 0.45 + Math.random() * 0.35,
      t: 0,
      s: 2 + Math.random() * 2,
      col,
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 12
    });
  }
  if(chips.length > 220) chips = chips.slice(-220);
}
function updateChips(dt){
  if(!chips.length) return;
  for(const c of chips){
    c.t += dt;
    c.vy += 520 * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
  }
  chips = chips.filter(c => c.t < c.life);
}
function drawChips(){
  for(const c of chips){
    const k = 1 - c.t / c.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.col;
    ctx.fillRect(-c.s/2, -c.s/2, c.s, c.s * 1.4);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function updateCombat(dt){
  if(!slimes.length) return;
  if(hurtT > 0) hurtT -= dt;
  for(const sl of slimes){
    if(sl.hurt > 0) sl.hurt -= dt;
    sl.wob += dt * 3;
    const dx = P.x - sl.x, dy = P.y - sl.y;
    const d = Math.hypot(dx, dy) || 1;
    if(d > 36){
      const sp = (sl.type === 'bat' ? 72 : sl.type === 'big' ? 24 :
                  sl.type === 'bug' ? 96 : sl.type === 'skeleton' ? 30 :
                  sl.type === 'crab' ? 20 : 34) * dt;
      sl.x += dx / d * sp; sl.y += dy / d * sp;
    } else {
      sl.cd -= dt;
      if(sl.cd <= 0){
        sl.cd = 1.5;
        const dmg = Math.max(1, Math.round(sl.dmg * (1 - bootArmor()) * (GAME.ring === 'def' ? 0.85 : 1)));

        hurtT = 0.35; sfx.fail();
        if(GAME.hp <= 0){ playerDown(); return; }
      }
    }
  }
}

  return (best && bd < 95) ? best : null;

function buildLightCanvas(){
  const c = document.createElement('canvas');
  c.width = WW; c.height = WH;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for(const L of LIGHTS){
    const [r,gg,b] = L.c;
    const a = Math.min(1, L.s) * 0.34;   /* 总强度上限：叠加也不会过曝 */
    const grd = g.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);
    grd.addColorStop(0,    'rgba('+r+','+gg+','+b+','+a+')');
    grd.addColorStop(0.45, 'rgba('+r+','+gg+','+b+','+(a*0.42)+')');
    grd.addColorStop(0.78, 'rgba('+r+','+gg+','+b+','+(a*0.10)+')');
    grd.addColorStop(1,    'rgba('+r+','+gg+','+b+',0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(L.x,L.y,L.r,0,Math.PI*2); g.fill();
  }
  return c;
}

function fishOk(f){
  if(f.tropic) return false;                         /* 热带鱼只能在海滩钓 */
  if(f.season && !f.season.includes(GAME.season)) return false;
  if(f.hour){
    const hh = (GAME.minutes || 360) / 60;
    if(hh < f.hour[0] || hh >= f.hour[1]) return false;
  }
  if(f.rain && weather !== '雨') return false;
  if(f.sunny && weather !== '晴') return false;
  return true;
}
function rollFish(){
  const pool = FISH_TBL.filter(f => f.w > 0 && fishOk(f));
  const list = pool.length ? pool : FISH_TBL.filter(f => f.w > 0);
  const total = list.reduce((a,b)=>a+b.w, 0);
  let r = Math.random()*total;
  for(const f of list){ r -= f.w; if(r <= 0) return f; }
  return list[0];
}

  }
  for(let x=0;x<gw;x++){ g[x]=0; g[(gh-1)*gw+x]=0; }
  for(let y=0;y<gh;y++){ g[y*gw]=0; g[y*gw+gw-1]=0; }
  return Array.from(g).map(v=>v?'1':'0').join('');
}

/* ============ 小场景引擎 ============
   一个场景 = 一张 1536×1152 的图 + 一组矩形障碍。
   矩形运行时转成 A* 网格（'0' 挡 / '1' 通），所以寻路、碰撞、相机、TA 全部复用现有代码。
   加一个新场景只要 defScene(...) 一行 + 一张图。 */
const SCENES = {};
let curScene = null, subExit = false, subHot = null, subMine = null;

function rectDist(x, y, r){
  const dx = Math.max(r[0]-x, 0, x-(r[0]+r[2]));
  const dy = Math.max(r[1]-y, 0, y-(r[1]+r[3]));
  return Math.hypot(dx, dy);
}
function sceneGridFromRects(w, h, cell, rects){
  const gw = Math.floor(w/cell), gh = Math.floor(h/cell);
  const rows = [];
  for(let y=0;y<gh;y++){
    let row = '';
    for(let x=0;x<gw;x++){
      const px = x*cell + cell/2, py = y*cell + cell/2;
      let hit = false;
      for(const r of rects){
        if(px >= r[0] && px < r[0]+r[2] && py >= r[1] && py < r[1]+r[3]){ hit = true; break; }
      }
      row += hit ? '0' : '1';
    }
    rows.push(row);
  }
  return rows.join('');
}
function defScene(id, def){
  def.id = id;                  /* ★ 一定要带上 id：判断"在哪个场景"都靠 curScene.id */
  def.w = 1536; def.h = 1152; def.cell = 32;
  def.grid = sceneGridFromRects(def.w, def.h, def.cell, def.rects);
  def.art = def.art || ('生图/场景/SC-' + def.name + '.webp');   /* 无损 WebP：省 42% 体积，像素不变 */
  SCENES[id] = def;
  return def;
}

/* 牧场里按数量把动物画出来 */
function pxBlock(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
/* 牧场里的动物：各自有个"家"范围，随机溜达，撞墙会换目标 */
const PET_SPEED = { chicken:30, duck:26, cow:22 };
const PET_RANGE = { chicken:170, duck:130, cow:210 };
let petActors = [];
function initPets(){
  petActors = [];
  const A = GAME.animals || {};
  const homes = {
    chicken: [[560,650],[645,700],[725,655],[600,765],[800,720],[865,660]],
    duck:    [[430,900],[505,930],[365,875],[300,905]],
    cow:     [[905,790],[520,830]]
  };
  for(const kind of ['chicken','duck','cow']){
    const n = Math.min(A[kind] || 0, homes[kind].length);
    for(let i=0;i<n;i++){
      const h = homes[kind][i % homes[kind].length];
      petActors.push({ kind, hx:h[0], hy:h[1], x:h[0], y:h[1],
                       tx:h[0], ty:h[1], wait:Math.random()*0.7 });
    }
  }
}
function updatePets(dt){
  if(!petActors.length) return;
  for(const a of petActors){
    if(a.wait > 0){ a.wait -= dt; continue; }
    const dx = a.tx - a.x, dy = a.ty - a.y;
    const d = Math.hypot(dx, dy);
    if(d < 5){
      a.wait = 0.5 + Math.random()*1.8;
      for(let k=0;k<10;k++){
        const ang = Math.random()*Math.PI*2, r = Math.random() * PET_RANGE[a.kind];
        const nx = a.hx + Math.cos(ang)*r, ny = a.hy + Math.sin(ang)*r;
        if(nx < 24 || ny < 24 || nx > WW-24 || ny > WH-24) continue;
        if(!walkable(Math.floor(nx/CELL), Math.floor(ny/CELL))) continue;
        a.tx = nx; a.ty = ny; break;
      }
      continue;
    }
    const sp = (PET_SPEED[a.kind] || 26) * dt;
    const nx = a.x + dx/d*sp, ny = a.y + dy/d*sp;
    if(walkable(Math.floor(nx/CELL), Math.floor(a.y/CELL))) a.x = nx;
    if(walkable(Math.floor(a.x/CELL), Math.floor(ny/CELL))) a.y = ny;
  }
}

function doCraft(id){
  const c = CRAFTED[id];
  if(!c) return;
  for(const k in c.from) if(matCount(k) < c.from[k]){ toast('材料不够 · 缺 ' + matName(k)); return; }
  for(const k in c.from) matTake(k, c.from[k]);
  GAME.crafts.push({ id, finish: absMin() + c.minutes });
  toast('开始加工 ' + c.name + '（' + c.minutes + ' 游戏分钟）');
  rebuildMarket(); saveGame();
}
function tickCraft(){
  if(!GAME.crafts || !GAME.crafts.length) return;
  const now = absMin();
  for(let i = GAME.crafts.length - 1; i >= 0; i--){
    const job = GAME.crafts[i];
    if(!job || !CRAFTED[job.id]){ GAME.crafts.splice(i,1); continue; }
    if(now >= job.finish){
      GAME.crafts.splice(i, 1);
      const cc = CRAFTED[job.id];
      bump('crafted');
      if(!cc.place) see('crafted', job.id);
      if(cc.place){ GAME.place[cc.place] = (GAME.place[cc.place] || 0) + 1; }
      else { GAME.crafted[job.id] = (GAME.crafted[job.id] || 0) + 1; }
      toast('加工完成　' + CRAFTED[job.id].name);
    }
  }
}
function openCraftShop(){
  const items = [];
  if(GAME.crafts && GAME.crafts.length){
    items.push({ head:'加工中（' + GAME.crafts.length + ' 件）' });
    for(const job of GAME.crafts){
      if(!CRAFTED[job.id]) continue;
      const left = Math.max(0, job.finish - absMin());
      items.push({ name:CRAFTED[job.id].name, icon:'i-hoe', price:0, bulk:false, off:true,
                   desc:'还要 ' + Math.round(left) + ' 游戏分钟' });
    }
  }
  items.push({ head:'可以做的东西' });
  for(const id in CRAFTED){
    const c = CRAFTED[id];
    if(c.hidden) continue;
    const need = Object.keys(c.from).map(k => matName(k) + ' ' + matCount(k) + '/' + c.from[k]).join(' · ');
    const ok = Object.keys(c.from).every(k => matCount(k) >= c.from[k]);
    items.push({ key:id, mode:'craft', craft:true, name:c.name, icon:'i-hoe',
                 priceText: c.place ? '放置物' : (c.sell + ' 金'), bulk:false, off:!ok,
                 desc:'需要 ' + need + ' · ' + c.minutes + ' 分钟' +
                      (c.place ? ' · ' + (PLACES[c.place] ? PLACES[c.place].desc : '') : ' · 卖 ' + c.sell + ' 金') });
  }
  openMarket({
    title:'加工台', sub:'WORKBENCH', items, rebuild:()=>openCraftShop(),
    onBuy(it){ if(it.craft) doCraft(it.key); }
  });
}

/* ============ 挖矿：连点敲碎 ============ */
function mineCleared(){ return mineNodes.every(n => n.hp <= 0); }

function mineTap(){
  if(!MINING.on){                      /* 起一次敲击 */
    if(!subMine) return;
    if(subMine.hp <= 0) return;
    if(energy < 4){ toast('体力不够了 · 睡一觉再来'); return; }
    MINING.on = true; MINING.prog = 0; MINING.t = 0; MINING.node = subMine;
    MINING.prog = 0.15;
    sfx.mine();
    subMine.shake = 0.16;
    spawnChips(subMine.x, subMine.y - 6, ORES[subMine.kind].col, 5);
    return;
  }
  const pickLv = (GAME.toolLv||{}).pick || 1;
  MINING.prog += 0.34 * (1 + luckBonus()) * (1 + (pickLv - 1) * 0.12);
  sfx.mine();
  MINING.flash = 0.12;
  if(MINING.node){
    MINING.node.shake = 0.16;
    spawnChips(MINING.node.x, MINING.node.y - 6, ORES[MINING.node.kind].col, 6);
    showFx('咚！', '', 420);   /* 正中间那一下 */
  }
  if(MINING.prog >= 1) mineSuccess();
}
function mineSuccess(){
  const n = MINING.node;
  MINING.on = false; MINING.prog = 0;
  if(!n || n.hp <= 0) return;
  energy -= carency('mine', 4); n.hp--;
  sfx.breakRock();
  MINING.flash = 0.18;
  const o = ORES[n.kind];
  let got = 2 + (Math.random() < 0.5 ? 1 : 0);      /* 2~3 块 */
  got += PM.extraOre();
  if(PM.doubleOre() && Math.random() < 0.25) got *= 2;
  GAME.ores[n.kind] = (GAME.ores[n.kind] || 0) + got;
  see('ores', n.kind);
  addSkillXp('mine', 10);
  spawnChips(n.x, n.y - 6, ORES[n.kind].col, 14, 210);
  spawnChips(n.x, n.y - 10, ORES[n.kind].light, 8, 170);
  GAME.stat.mined = (GAME.stat.mined||0) + 1;
  addXp(6);
  if(n.chest){
    const bonus = 60 + Math.floor(Math.random() * 140) + (GAME.mineLayer || 1) * 20;
    GAME.gold = (GAME.gold || 0) + bonus;
    GAME.stat.earned = (GAME.stat.earned || 0) + bonus;
    showFx('宝箱！+' + bonus + ' 金', 'good', 1400);
    sfx.coin();
  }
  if(mineCleared()) toast('挖到 ' + got + ' 块' + o.name + '　这层挖空了');
  else if(n.hp <= 0) toast('挖到 ' + got + ' 块' + o.name + '　这块挖空了');
  else              toast('挖到 ' + got + ' 块' + o.name + '　还剩 ' + n.hp + ' 下');
  saveGame();
}
function mineFail(){
  if(!MINING.on) return;
  MINING.on = false; MINING.prog = 0;
  energy = Math.max(0, energy - 2);
  sfx.fail();
  toast('手滑了 · 石头没碎（−2 体力）');
}
function updateMining(dt){
  for(const n of mineNodes) if(n.shake > 0) n.shake -= dt;
  if(MINING.flash > 0) MINING.flash -= dt;
  if(!MINING.on) return;
  MINING.t += dt;
  MINING.prog -= 0.12 * dt;            /* 松手就掉（0.12/s：停手 1.2 秒才归零） */
  if(MINING.prog >= 1){ mineSuccess(); return; }
  if(MINING.prog <= 0 || MINING.t > 8) mineFail();
}
function mineDescend(){
  if(GAME.mineLayer >= 8){
    toast('已经挖到最深处 · 睡一觉矿会重新长出来');
    return;
  }
  GAME.mineLayer++;
  buildMineNodes();
  MINING.on = false; MINING.prog = 0;
  toast('下潜到 ' + MINE_LAYERS[GAME.mineLayer].name);
  saveGame();
}

/* 把背包里的矿石一次性塞进出货箱 */
/* 出货箱：矿石 + 蛋奶（按出货箱价，比铁路低） */
function totalGoods(){ let n=0; for(const k in (GAME.goods||{})) n += GAME.goods[k]||0; return n; }
function totalCrops(){ let n=0; for(const k in (GAME.crops||{})) n += GAME.crops[k]||0; return n; }
function totalCrafted(){ let n=0; for(const k in (GAME.crafted||{})) n += GAME.crafted[k]||0; return n; }
function canShip(){ return totalOres() + totalGoods() + totalCrops() + totalCrafted() > 0; }
function sellOres(){
  if(!canShip()){
    toast('背包里没有能出货的东西：作物、蛋奶、矿石、加工品都能放', 2600);
    return;
  }
  let qty = 0, value = 0;
  for(const k in GAME.ores){
    const n = GAME.ores[k] || 0;
    if(!n) continue;
    qty += n; value += Math.round(n * ORES[k].sell * mktMul('ores') * centerPriceMul());
    GAME.ores[k] = 0;
  }
  for(const k in (GAME.goods||{})){
    const n = GAME.goods[k] || 0;
    if(!n) continue;
    qty += n; value += Math.round(n * GOODS[k].binValue * mktMul('goods') * centerPriceMul() * PM.goodsPrice());
    GAME.goods[k] = 0;
  }
  for(const k in (GAME.crops||{})){
    const n = GAME.crops[k] || 0;
    if(!n) continue;
    qty += n; value += cropSellTotal(k, n, mktMul('crops') * centerPriceMul() * PM.cropPrice()).gold;
    GAME.crops[k] = 0; cqOf(k).s = 0; cqOf(k).g = 0;
  }
  for(const k in (GAME.crafted||{})){
    const n = GAME.crafted[k] || 0;
    if(!n) continue;
    /* 加工品不享受行情/节日加成：防止"从商人买、回家倒卖"的套利 */
    /* 加工品：金属锭吃"铁匠"、硬木吃"森林人/伐木工"、其余吃"工匠" */
    let cm = PM.craftPrice();
    if(k === 'copperBar' || k === 'silverBar' || k === 'goldBar') cm *= PM.barPrice();
    if(k === 'hardwood') cm *= PM.hardPrice();
    qty += n; value += Math.round(n * (CRAFTED[k] ? CRAFTED[k].sell : 0) * centerPriceMul() * cm);
    GAME.crafted[k] = 0;
  }
  if(!qty){ toast('背包里没有能出货的东西'); return; }
  GAME.bin.qty += qty; GAME.bin.value += value;
  bump('bin');
  toast('出货　' + qty + ' 件 +' + value + '金（睡觉结算）');
  saveGame();
}

/* 地块交互 */
function plotAt(wx,wy){
  const g=FARM.plot;
  const dy = wy - g.y;
  if(wx < g.x || wx >= g.x + g.cols*g.cw) return null;
  if(dy < ROW_Y[0] || dy >= ROW_Y[g.rows-1] + rowH(g.rows-1)) return null;
  const c = Math.floor((wx - g.x) / g.cw);
  const r = rowAt(dy);
  if(c<0||r<0||c>=g.cols||r>=g.rows) return null;
  return plots[r*g.cols + c] || null;
}
function usePlot(pl){
  if(!pl) return;
  if(!GAME.bin) GAME.bin = {qty:0, value:0};
  if(tool==='place'){ placeAt(pl); return; }
  const mach = machineAt(pl.r, pl.c);
  if(mach && tool === 'hand'){ openMachine(mach); return; }
  if(tool==='fert'){
    if(!pl.tilled){ toast('先把地锄开'); return; }
    if(pl.fert){ toast('这块地已经施过肥了'); return; }
    const useP = (GAME.fert && GAME.fert.premium > 0);
    const useB = (GAME.fert && GAME.fert.basic > 0);
    if(!useP && !useB){ toast('没有肥料了 · 杂货店有卖'); return; }
    if(useP){ GAME.fert.premium--; pl.fert = 2; }
    else    { GAME.fert.basic--;   pl.fert = 1; }
    sfx.seed();
    bump('fert');
    toast(useP ? '施了高级肥料（收获 +1 · 生长可能更快）' : '施了基础肥料（收获 +1）');
    saveGame();
    return;
  }
  if(tool==='hoe'){
    if(pl.tilled) return;
    if(energy < 3) return;
    const hoeLv = (GAME.toolLv||{}).hoe || 1;
    const cells = hoeLv >= 3 ? 3 : (hoeLv === 2 ? 2 : 1);
    energy -= carency('farm', 3);
    for(let i = 0; i < cells; i++){
      const p2 = plots[pl.r * 14 + pl.c + i];
      if(p2 && !p2.tilled) p2.tilled = true;
    }
    pl.tilled = true;
    sfx.hoe();
  } else if(tool==='can'){
    if(!pl.tilled || pl.watered) return;
    if(can <= 0){ toast('水壶空了，去井边打水'); return; }
    if(energy < 2) return;
    energy -= carency('farm', 2); can--; pl.watered = true; sfx.water();
  } else {
    if(!pl.tilled) return;
    if(!GAME.seedsBy) GAME.seedsBy = {};

    /* --- 有作物：只处理收获 --- */
    if(pl.crop){
      const c = CROPS[pl.crop];
      if(!c){ pl.crop=null; pl.stage=0; return; }
      if(pl.stage >= c.grow){
        /* 收获进背包，卖到哪里由你决定 */
        if(!GAME.crops) GAME.crops = {};
        const bonus = pl.fert ? 1 : 0;                 /* 施过肥的地多收 1 个 */
        const totalGot = 1 + bonus;
        GAME.crops[pl.crop] = (GAME.crops[pl.crop] || 0) + totalGot;
        /* 掷品质：施肥与技能都能提升，最高金星 */
        const q = cqOf(pl.crop);
        let qTag = '';
        for(let gi = 0; gi < totalGot; gi++){
          let r = rollQuality();
          if(pl.fert && r < 2 && Math.random() < 0.35) r++;     /* 施肥提升一档 */
          if(r === 2) q.g++;
          else if(r === 1) q.s++;
        }
        if(q.g > 0) qTag = '（含金星）';
        else if(q.s > 0) qTag = '（含银星）';
        see('crops', pl.crop);
        addSkillXp('farm', 8);
        see('seasons', GAME.season);
        if(1 + bonus >= 2) bump('bigHarvest');
        if(GAME.season === 3) bump('winterHarvest');
        const nm = c.name;
        pl.crop=null; pl.stage=0; pl.watered=false;
        GAME.stat.harvest = (GAME.stat.harvest||0) + 1;
        addXp(10);
        sfx.harvest();
        toast('收进背包　' + nm + ' ×' + totalGot + qTag + '（出货箱 ' + c.sell + ' 金 / 金星 ' + Math.round(c.sell*1.5) + ' 金）');
      } else {
        toast(c.name + ' 还要 ' + (c.grow - pl.stage) + ' 天');
      }
      return;
    }

    /* --- 空地：种当前选中的种子 --- */
    const k = GAME.seedSel || 'strawberry';
    const c = CROPS[k] || CROPS.strawberry;
    if(!c.seasons.includes(GAME.season) && !GAME.greenhouse){
      toast(SEASON_NAMES[GAME.season] + '天种不了' + c.name + '（' + seasonTag(c) + '可种）· 温室可以');
      return;
    }
    if((GAME.seedsBy[k] || 0) <= 0){
      toast('没有' + c.name + '种子了 · 去杂货店买（点下方种子条换种）');
      return;
    }
    GAME.seedsBy[k]--;
    pl.crop = k; pl.stage = 1; sfx.seed();
    if(weather === '雨') pl.watered = true;
    if(GAME.seedsBy[k] === 0) GAME.seedSel = firstOwnedSeed();   /* 用完了自动切到下一种 */
  }
}

/* 颜色明暗：像素风靠两三个色阶撑体积，不用渐变 */
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const c = [(n>>16)&255, (n>>8)&255, n&255].map(v =>
    Math.max(0, Math.min(255, Math.round(k < 0 ? v*(1+k) : v + (255-v)*k))));
  return 'rgb(' + c.join(',') + ')';
}

/* 作物画法：8 种形态，按生长阶段整体缩放（从根部往上长）。
   坐标都相对 (cx, by)，f 随阶段变大 —— 所以幼株就是矮小的一株，成熟株满格。 */
function drawCrop(c, st, cx, by, cw){
  const s = Math.max(1, Math.min(4, st));
  const f = 0.46 + s*0.175;                    /* 1 → 0.635，4 → 1.16 */
  const leaf = c.leaf || '#4E8C3E';
  const col  = c.col  || '#E8355F';
  const D = shade(leaf,-0.34), M = leaf, L = shade(leaf,0.30);
  const fD = shade(col,-0.32), fM = col, fL = shade(col,0.34);
  const form = c.form || 'bush';
  const R = (x,y,w,h,cc)=>{                    /* 相对坐标画一个像素块 */
    ctx.fillStyle = cc;
    ctx.fillRect(Math.round(cx + x*f), Math.round(by + y*f),
                 Math.max(1, Math.round(w*f)), Math.max(1, Math.round(h*f)));
  };

  if(form === 'bush'){
    R(-1,-20, 3, 20, D);                       /* 茎 */
    R(-14,-14, 12, 8, D); R(2,-16, 12, 8, D);  /* 后层叶 */
    R(-10,-19, 20, 9, M);                      /* 中团 */
    R(-5,-24, 10, 6, L);                       /* 顶层亮叶 */
    if(s >= 3){
      R(-11,-17, 6, 6, fD); R(5,-13, 6, 6, fM);
      if(s >= 4) R(-2,-23, 7, 7, fL);
    }
  } else if(form === 'root'){
    R(-13,-10, 12, 5, D); R(1,-10, 12, 5, D);  /* 四散矮叶 */
    R(-9,-15, 9, 5, M);   R(2,-15, 9, 5, M);
    R(-5,-19, 10, 5, L);
    if(s >= 3){
      R(-8,-7, 16, 7, fM);                     /* 半埋的块根 */
      R(-6,-7, 4, 2, fL);
    }
  } else if(form === 'head'){
    R(-15,-12, 14, 7, D); R(1,-12, 14, 7, D);  /* 外层大叶 */
    R(-11,-18, 10, 7, M); R(1,-18, 10, 7, M);
    if(s >= 3){
      R(-9,-26, 18, 14, fM);                   /* 菜球 */
      R(-6,-26, 6, 4, fL);
    }
  } else if(form === 'leaf'){
    R(-14,-13, 8, 13, D); R(6,-13, 8, 13, D);  /* 五片直立叶 */
    R(-9,-17, 8, 17, M);  R(1,-17, 8, 17, M);
    R(-4,-20, 8, 20, L);
    if(s >= 3) R(-4,-20, 8, 4, fM);
  } else if(form === 'tall'){
    R(-1,-30, 3, 30, D);                       /* 高秆 */
    R(-9,-14, 8, 4, M); R(1,-19, 8, 4, M); R(-9,-24, 8, 4, L);
    if(s >= 3){
      R(-3,-38, 7, 13, fM);                    /* 穗 */
      R(-5,-42, 11, 5, fL);
    }
  } else if(form === 'bloom'){
    R(-1,-32, 3, 32, D);                       /* 高秆 + 大花盘 */
    R(-10,-16, 9, 4, M); R(2,-21, 9, 4, M);
    if(s >= 3){
      R(-9,-44, 19, 15, fD);
      R(-6,-42, 13, 11, fM);
      R(-3,-39, 7, 6, fL);
    }
  } else if(form === 'vine'){
    R(-1,-30, 3, 30, D);                       /* 藤架 */
    R(-12,-26, 11, 4, M); R(1,-22, 11, 4, L);
    if(s >= 3){
      R(-6,-24, 13, 6, fD);                    /* 垂下的果串 */
      R(-4,-19, 9, 5, fM);
      R(-2,-15, 5, 4, fL);
    }
  } else if(form === 'flower'){
    R(-1,-16, 3, 16, D);                       /* 茎 */
    R(-9,-9, 8, 5, M); R(1,-11, 8, 5, L);
    if(s >= 3){
      R(-6,-24, 13, 7, fM);
      R(-2,-28, 5, 5, fL);
      R(-9,-22, 4, 4, fD); R(5,-22, 4, 4, fD);
    }
  } else {                                     /* bushfallback */
    R(-1,-18, 3, 18, D);
    R(-10,-16, 20, 10, L);
    if(s >= 3) R(-6,-22, 8, 7, fM);
  }
}
