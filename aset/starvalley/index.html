/* ============ 网格工具 ============ */
function walkable(cx, cy){
  if(cx<0||cy<0||cx>=GW||cy>=GH) return false;
  return walkGrid.charCodeAt(cy*GW+cx) === 49; // '1'
}
function worldToCell(x,y){ return [Math.floor(x/CELL), Math.floor(y/CELL)]; }
function cellToWorld(cx,cy){ return {x:(cx+0.5)*CELL, y:(cy+0.5)*CELL}; }
/* 传送落点如果正好在障碍里，人会被卡住 —— 自动找附近能站的点 */
function safeSpot(x, y){
  if(Number.isFinite(x) && Number.isFinite(y) && !blockedAt(x, y)) return { x, y };
  const bx = Number.isFinite(x) ? x : 300, by = Number.isFinite(y) ? y : 360;
  for(let r = 8; r <= 200; r += 8){
    for(let a = 0; a < 360; a += 12){
      const nx = bx + Math.cos(a * Math.PI / 180) * r;
      const ny = by + Math.sin(a * Math.PI / 180) * r;
      if(nx < 24 || ny < 24 || nx > WW - 24 || ny > WH - 24) continue;
      if(!blockedAt(nx, ny)) return { x:nx, y:ny };
    }
  }
  return { x: 300, y: 360 };
}

function blockedAt(x,y){
  // 碰撞盒：脚底 26×18
  const pts=[[x-4,y-1],[x+4,y-1],[x,y-1],[x,y-6]];  /* 8x6：必须小于一格(16px) */
  for(const [px,py] of pts){
    const [cx,cy]=worldToCell(px,py);
    if(!walkable(cx,cy)) return true;
  }
  return false;
}
function nearestWalkable(cx,cy){
  if(walkable(cx,cy)) return [cx,cy];
  for(let r=1;r<28;r++){
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      if(walkable(cx+dx,cy+dy)) return [cx+dx,cy+dy];
    }
  }
  return null;
}

/* ============ A* ============ */
function findPath(sx,sy,tx,ty){
  let [cx,cy] = nearestWalkable(...worldToCell(sx,sy)) || [Math.floor(sx/CELL),Math.floor(sy/CELL)];
  const e = nearestWalkable(...worldToCell(tx,ty));
  if(!e) return null;
  const [ex,ey] = e;
  const N = GW*GH;
  const gScore = new Float32Array(N).fill(1e9);
  const came = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const start = cy*GW+cx, goal = ey*GW+ex;
  if(start===goal) return [cellToWorld(ex,ey)];
  gScore[start]=0;
  const h=(n)=>{const x=n%GW,y=(n/GW)|0;const dx=Math.abs(x-ex),dy=Math.abs(y-ey);
                return (dx+dy)+0.414*Math.min(dx,dy);};
  const open=[[h(start),start]];
  const push=(f,n)=>{open.push([f,n]);let i=open.length-1;
    while(i>0){const p=(i-1)>>1; if(open[p][0]<=open[i][0])break;
      [open[p],open[i]]=[open[i],open[p]]; i=p;}};
  const pop=()=>{const top=open[0]; const last=open.pop();
    if(open.length){open[0]=last; let i=0;
      for(;;){const l=2*i+1,r=l+1; let m=i;
        if(l<open.length&&open[l][0]<open[m][0])m=l;
        if(r<open.length&&open[r][0]<open[m][0])m=r;
        if(m===i)break; [open[m],open[i]]=[open[i],open[m]]; i=m;}}
    return top;};
  let guard = 0;
  while(open.length && guard++ < 40000){
    const [,cur] = pop();
    if(closed[cur]) continue;
    closed[cur]=1;
    if(cur===goal){
      const cells=[]; let n=cur;
      while(n!==-1){ cells.push(n); if(n===start) break; n=came[n]; }
      cells.reverse();
      return cells.map(i=>cellToWorld(i%GW,(i/GW)|0));
    }
    const x=cur%GW, y=(cur/GW)|0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nx=x+dx, ny=y+dy;
      if(!walkable(nx,ny)) continue;
      if(dx&&dy && (!walkable(x+dx,y) || !walkable(x,y+dy))) continue; // 不斜穿角
      const ni = ny*GW+nx;
      if(closed[ni]) continue;
      const step = (dx&&dy)?1.414:1;
      const ng = gScore[cur]+step;
      if(ng < gScore[ni]){
        gScore[ni]=ng; came[ni]=cur; push(ng+h(ni), ni);
      }
    }
  }
  return null;
}

/* ============ TA 行为 ============ */
function taSetDir(dx,dy){
  if(Math.abs(dx) > Math.abs(dy)){ TA.dir='side'; TA.flip = dx > 0; }
  else TA.dir = dy > 0 ? 'down' : 'up';
}
function taRescue(){
  if(!TA) return;
  if(!blockedAt(TA.x, TA.y) && walkable(Math.floor(TA.x/CELL), Math.floor(TA.y/CELL))) return;
  const sp = safeSpot(TA.x, TA.y);
  TA.x = sp.x; TA.y = sp.y; TA.path = null; TA.stuck = 0;
}
function taFollow(dt){
  if(!TA.path) return false;
  const wp = TA.path[TA.pathIdx];
  if(!wp){ TA.path = null; return false; }
  const dx = wp.x-TA.x, dy = wp.y-TA.y, d = Math.hypot(dx,dy);
  if(d < 6){
    TA.pathIdx++;
    if(TA.pathIdx >= TA.path.length){ TA.path=null; TA.wait = 2 + Math.random()*4; }
    return true;
  }
  const sp = 95*dt, ox=TA.x, oy=TA.y;
  const okAt = (nx, ny) => !blockedAt(nx, ny) &&
                           walkable(Math.floor(nx/CELL), Math.floor(ny/CELL));
  if(okAt(TA.x + dx/d*sp, TA.y)) TA.x += dx/d*sp;
  if(okAt(TA.x, TA.y + dy/d*sp)) TA.y += dy/d*sp;
  if(Math.hypot(TA.x-ox, TA.y-oy) < 0.05){
    TA.stuck += dt;
    if(TA.stuck > 0.4){ TA.path = null; TA.wait = 0.8; TA.stuck = 0; }
  } else {
    TA.stuck = 0;
    TA.anim += dt*9;
    TA.frame = Math.floor(TA.anim) % 4;
  }
  taSetDir(dx,dy);
  return true;
}
/* 换场景时把 TA 挪到玩家旁边一个能站的地方 */
function placeTANearPlayer(){
  TA.path = null; TA.pathIdx = 0; TA.wait = 1.2; TA.stuck = 0;
  for(const [dx, dy] of [[-46,14],[46,14],[-46,-24],[46,-24],[0,54],[0,-48],[80,0],[-80,0]]){
    const x = P.x + dx, y = P.y + dy;
    if(x < 20 || y < 20 || x > WW-20 || y > WH-20) continue;
    if(walkable(Math.floor(x/CELL), Math.floor(y/CELL))){ TA.x = x; TA.y = y; return; }
  }
  TA.x = P.x; TA.y = P.y;
}

/* TA 溜达的目标：世界里去 POI，农场里就在玩家周围瞎转 */
function taWanderTarget(){
  if(scene === 'world'){
    const names = Object.keys(POI);
    return POI[names[Math.floor(Math.random()*names.length)]];
  }
  for(let i = 0; i < 40; i++){
    const a = Math.random()*Math.PI*2, r = 110 + Math.random()*170;
    const x = P.x + Math.cos(a)*r, y = P.y + Math.sin(a)*r;
    if(x < 40 || y < 40 || x > WW-40 || y > WH-40) continue;
    if(walkable(Math.floor(x/CELL), Math.floor(y/CELL))) return {x, y};
  }
  return {x: P.x, y: P.y};
}

function taThink(dt){
  if(TA.mode !== 'auto') return;
  if(TA.wait > 0){ TA.wait -= dt; return; }
  const p = taWanderTarget();
  const path = findPath(TA.x, TA.y, p.x, p.y);
  if(path && path.length){ TA.path = path; TA.pathIdx = 0; }
  else TA.wait = 1;
}

/* ============ 声音：全部程序化合成，不带任何音频文件 ============ */
const SFX = { ctx:null, master:null, musicGain:null, on:true, music:false,
              musicTimer:null, count:0, lastStep:0 };

function audioCtx(){
  if(SFX.ctx) return SFX.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  SFX.ctx = new AC();
  /* 链路：音效 → 增益(4.0) → tanh 软削波 → 扬声器
     软削波不像硬削波那样“啪”地爆，可以把整体 RMS 拉高好几倍。 */
  SFX.master = SFX.ctx.createGain();
  SFX.master.gain.value = 3.0;
  const shaper = SFX.ctx.createWaveShaper();
  const N = 2048, curve = new Float32Array(N);
  for(let i=0;i<N;i++){
    const x = (i / (N-1)) * 2 - 1;
    curve[i] = Math.tanh(x * 2.2);          /* 软膝，越靠近 ±1 压得越狠 */
  }
  shaper.curve = curve;
  shaper.oversample = '4x';
  SFX.master.connect(shaper);
  shaper.connect(SFX.ctx.destination);
  return SFX.ctx;
}
function unlockAudio(){
  const c = audioCtx(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  if(SFX.music && !SFX.musicTimer) startMusic();
}
document.addEventListener('pointerdown', unlockAudio, {passive:true});
document.addEventListener('keydown', unlockAudio);

/* 一个短音：type 波形，slideTo 做滑音，dest 默认总输出 */
function beep(freq, dur, type, vol, slideTo, dest){
  if(!SFX.on) return;
  const c = audioCtx(); if(!c) return;
  if(c.state === 'suspended') c.resume();     /* 手机上前几次可能还是挂起的 */
  const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  const v = Math.max(0.001, vol || 0.12);
  const atk = 0.008, hold = dur * 0.55;      /* 前 55% 保持满音量，听感比纯衰减响得多 */
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + atk);
  g.gain.setValueAtTime(v, t + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || SFX.master);
  o.start(t); o.stop(t + dur + 0.03);
  SFX.count++;
}
/* 噪声：水声、水花、敲碎 */
function noise(dur, vol, hp){
  if(!SFX.on) return;
  const c = audioCtx(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = vol || 0.12;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 900;
  src.connect(f); f.connect(g); g.connect(SFX.master);
  src.start();
  SFX.count++;
}
/* 闷响：低通噪声，脚步、落土这类用 */
/* 噪声打击：bandpass 放中频，手机喇叭上才听得见（低频会被吃掉） */
function thud(dur, vol, freq, q){
  if(!SFX.on) return;
  const c = audioCtx(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++){
    const k = 1 - i/n;
    d[i] = (Math.random()*2-1) * k * k;
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = freq || 1200;
  f.Q.value = q || 1.1;
  const g = c.createGain(); g.gain.value = vol || 0.3;
  src.connect(f); f.connect(g); g.connect(SFX.master);
  src.start();
  SFX.count++;
}
function arp(freqs, gap, type, vol){
  freqs.forEach((f, i)=> setTimeout(()=>beep(f, gap*1.6, type || 'square', vol || 0.10), i*gap*1000));
}

/* ---- 背景音乐：8 步循环的五声音阶，很轻 ---- */
function startMusic(){
  const c = audioCtx(); if(!c || SFX.musicTimer) return;
  if(!SFX.musicGain){
    SFX.musicGain = c.createGain();
    SFX.musicGain.gain.value = 0.16;
    SFX.musicGain.connect(SFX.master);
  }
  const melody = [0,4,7,4, 9,7,4,2,  0,4,7,12, 9,7,4,0];
  const bass   = [-12,-12,-5,-5, -8,-8,-5,-5];
  let i = 0;
  SFX.musicTimer = setInterval(()=>{
    if(!SFX.on || !SFX.music){ return; }
    const m = melody[i % melody.length], b = bass[i % bass.length];
    const toF = n => 261.63 * Math.pow(2, n/12);
    beep(toF(m), 0.22, 'square', 0.045, null, SFX.musicGain);
    if(i % 2 === 0) beep(toF(b), 0.4, 'triangle', 0.06, null, SFX.musicGain);
    i++;
  }, 320);
}
function stopMusic(){ if(SFX.musicTimer){ clearInterval(SFX.musicTimer); SFX.musicTimer = null; } }

/* 三档：音效 / 音效+音乐 / 全静音 */
function cycleSound(){
  if(SFX.on && !SFX.music){ SFX.music = true; startMusic(); toast('音乐 开'); }
  else if(SFX.on && SFX.music){ SFX.on = false; SFX.music = false; stopMusic(); toast('全部静音'); }
  else { SFX.on = true; SFX.music = false; toast('音效 开'); }
  document.getElementById('sndTxt').textContent = !SFX.on ? '🔇' : (SFX.music ? '♪' : '◔');
  if(SFX.on) beep(1400, 0.14, 'square', 0.34);   /* 顺手响一下，方便确认到底有没有声 */
  try{ localStorage.setItem('te_sound', JSON.stringify({on:SFX.on, music:SFX.music})); }catch(_){}
}

/* ============ 天气粒子 ============ */
const rainP = [], snowP = [];
function initWeather(){
  rainP.length = 0; snowP.length = 0;
  const W = cv.width, Hh = cv.height;
  for(let i=0;i<240;i++) rainP.push({x:Math.random()*(W+160), y:Math.random()*Hh, len:14+Math.random()*24, sp:520+Math.random()*420});
  for(let i=0;i<170;i++) snowP.push({x:Math.random()*W, y:Math.random()*Hh, r:1+Math.random()*1.5, sp:24+Math.random()*46, ph:Math.random()*6.28});
}
function updateWeather(dt){
  if(!rainP.length) initWeather();
  const W = cv.width, Hh = cv.height;
  if(weather === '雨'){
    for(const p of rainP){
      p.y += p.sp*dt; p.x -= p.sp*0.26*dt;
      if(p.y > Hh+8 || p.x < -30){ p.y = -20 - Math.random()*Hh*0.4; p.x = Math.random()*(W+160); }
    }
  } else if(weather === '雪'){
    for(const p of snowP){
      p.ph += dt*1.7;
      p.y += p.sp*dt;
      p.x += Math.sin(p.ph)*18*dt;
      if(p.y > Hh+6){ p.y = -6; p.x = Math.random()*W; }
    }
  }
}
function drawWeather(){
  if(weather === '晴') return;
  /* 室内和矿洞不该下雨下雪 */
  if(scene === 'sub' && curScene && (curScene.interior || curScene.mining)) return;
  ctx.setTransform(1,0,0,1,0,0);
  if(weather === '雨'){
    ctx.fillStyle = 'rgba(38,58,88,.12)';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle = 'rgba(186,214,238,.55)';
    ctx.lineWidth = Math.max(1, dpr*0.9);
    ctx.beginPath();
    for(const p of rainP){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x - p.len*0.26, p.y + p.len); }
    ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(205,225,245,.12)';
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    for(const p of snowP) ctx.fillRect(p.x, p.y, p.r*2, p.r*2);
  }
}

/* ============ 时间 ============ */
function darknessAt(min){
  const hh = min/60;
  if(hh < 6)   return 0.82;
  if(hh < 17)  return 0;
  if(hh < 19)  return (hh-17)/2 * 0.38;
  if(hh < 21)  return 0.38 + (hh-19)/2 * 0.44;
  return 0.82;
}
function applySeason(){
  seasonIdx = GAME.season;
  if(scene === 'world') mapImg = seasonImgs[seasonIdx] || mapImg;
  else if(scene === 'farm'){ farmImgCur = farmImgs[seasonIdx] || farmImg; mapImg = farmImgCur; }
  else if(scene === 'sub' && curScene && curScene.seasonal){
    mapImg = (curScene.imgs && curScene.imgs[seasonIdx]) || curScene.img || mapImg;
  }
  refreshSeasonBtn();
}
/* 右上角那枚按钮只报“季节 + 天气”，时间归左上 HUD，别显示两遍 */
function refreshSeasonBtn(){
  const b = document.getElementById('seasons');
  if(!b) return;
  const t = SEASON_NAMES[GAME.season] + (weather && weather !== '晴' ? ' · ' + weather : '');
  if(b.textContent !== t) b.textContent = t;
}
let grownCount = 0;
function endDay(){
  GAME.hardToday = 0;
  /* 明天什么天气：看过电视就用预报里的，否则现掷 */
  weather = GAME.forecast || rollTomorrowWeather();
  GAME.forecast = null;
  GAME.quest = makeQuest();          /* 每天换一条委托 */
  rollMarket();                      /* 每天重掷行情 */
  rollTraderSpot();                  /* 旅行商人换地方、换货 */


  /* ① 先结算出货箱 —— 睡一觉才有钱 */
  if(!GAME.bin) GAME.bin = {qty:0, value:0};
  const settled = GAME.bin.value, settledQty = GAME.bin.qty;
  if(settled > 0){
    GAME.gold = (GAME.gold||0) + settled;
    GAME.stat.earned = (GAME.stat.earned||0) + settled;
    GAME.bin = {qty:0, value:0};
  }
  /* 动物产出前先吃饲料：不够就全体不产出（这可是每天的固定开销） */
  /* 动物心情：喂饱 +8，挨饿 -25；心情高有概率多产一份，心情低有概率不产 */
  GAME.mood = GAME.mood || {};
  let animalGain = 0, animalQty = 0, starved = 0;
  if(GAME.animals){
    let total = 0;
    for(const id in ANIMALS) total += GAME.animals[id] || 0;
    if(total > 0 && GAME.feed < total){
      starved = total;
      GAME.feed = 0;
      for(const id in ANIMALS) GAME.mood[id] = Math.max(0, (GAME.mood[id] == null ? 60 : GAME.mood[id]) - 25);
    } else if(total > 0){
      GAME.feed -= total;
      for(const id in ANIMALS) if(GAME.animals[id] > 0) GAME.mood[id] = Math.min(100, (GAME.mood[id] == null ? 60 : GAME.mood[id]) + 8);
    }
    for(const id in ANIMALS){
      const n = (starved ? 0 : (GAME.animals[id] || 0));
      if(!n) continue;
      const a = ANIMALS[id];
      GAME.animalDay[id] = (GAME.animalDay[id] || 0) + 1;
      if(GAME.animalDay[id] >= a.days){
        GAME.animalDay[id] = 0;
        let made = n;
        for(let i = 0; i < n; i++){
          const mood = GAME.mood[id] == null ? 60 : GAME.mood[id];
          if(mood >= 80 && Math.random() < 0.20) made++;          /* 心情好：多产一份 */
          if(mood < 30 && Math.random() < 0.25) made--;            /* 心情差：可能不产 */
        }
        made = Math.max(0, made);
        animalQty += made;
        animalGain += made * a.value;
        GAME.goods[a.good] = (GAME.goods[a.good] || 0) + made;   /* 进背包，不直接进箱 */
      }
    }
  }

  /* ② 所有农地一起长（不只在当前这块） */
  for(const f of farms) for(const pl of f){
    if(pl.crop && pl.watered && pl.stage < 4){ pl.stage++; grownCount++; }
    if(pl.crop && pl.watered && pl.fert === 2 && pl.stage < 4 && Math.random() < 0.35) pl.stage++;
    if(pl.crop && pl.watered && pl.stage < 4 && PM.growFast() && Math.random() < PM.growFast()) pl.stage++;
    pl.watered = false;
  }

  /* ③ 明天下雨 = 地已经浇过，不用再浇一遍 */
  const rainy = (weather === '雨');
  if(rainy) for(const f of farms) for(const pl of f) if(pl.tilled) pl.watered = true;

  /* ④ 洒水器：每天早上把周围 8 格浇上 */
  let sprinkled = 0;
  for(const it of (GAME.placed || [])){
    if(it.kind !== 'sprinkler') continue;
    const f = farms[it.farm]; if(!f) continue;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr && !dc) continue;
      const r = it.r + dr, c = it.c + dc;
      if(r < 0 || c < 0 || r >= 7 || c >= 14) continue;
      const p2 = f[r * 14 + c];
      if(p2 && p2.tilled && !p2.watered){ p2.watered = true; sprinkled++; }
    }
  }

  /* ⑤ 乌鸦：12% 概率来一次，半径 4 格内有稻草人就被赶走 */
  let crowMsg = null;
  if(Math.random() < 0.12){
    const cand = [];
    farms.forEach((f, fi)=>f.forEach(p2=>{ if(p2.crop) cand.push({fi, p2}); }));
    if(cand.length){
      const hit = cand[Math.floor(Math.random() * cand.length)];
      const guards = (GAME.placed || []).filter(x => x.kind === 'scarecrow' && x.farm === hit.fi);
      const guarded = guards.some(g => Math.abs(g.r - hit.p2.r) <= 4 && Math.abs(g.c - hit.p2.c) <= 4);
      if(guarded) crowMsg = '乌鸦来了 · 被稻草人赶走了';
      else { hit.p2.crop = null; hit.p2.stage = 0; crowMsg = '乌鸦偷吃了一株作物'; }
    }
  }

  energy = maxEnergy();
  can = canMax();
  GAME.hp = GAME.maxHp || 100;            /* 睡一觉血回满 */
  GAME.mineLayer = 1;               /* 每日刷新：回到第 1 层，矿点全满 */
  resetMineNodes();

  const seasonTurn = (GAME.day >= 28);      /* 今晚睡醒就换季 */
  GAME.day++;
  if(GAME.day > 28){ GAME.day = 1; GAME.season = (GAME.season+1) % 4; }
  GAME.minutes = 360;

  /* ④ 换季：非当季的作物枯死（星露谷规则） */
  let dead = 0;
  if(seasonTurn){
    for(const f of farms) for(const pl of f){
      const c = pl.crop && CROPS[pl.crop];
      if(c && !c.seasons.includes(GAME.season)){
        pl.crop = null; pl.stage = 0; pl.watered = false; dead++;
      }
    }
    if((GAME.seedsBy[GAME.seedSel] || 0) <= 0) GAME.seedSel = firstOwnedSeed();
  }

  try{ SV.emit('newday', { day: GAME.day, season: GAME.season, weather }); }catch(e){}
  fixWeatherBySeason();            /* 换季后修正：雪只在冬天 */
  applySeason();
  saveGame();

  /* ⑤ 报告结果给玩家 */
  if(dead > 0){
    toast('换季了　' + dead + ' 株非当季作物枯死' +
          (settledQty > 0 ? ' · 出货 +' + settled + '金' : ''));
  }
  else if(starved > 0){
    toast('饲料不够 · ' + starved + ' 只动物饿着肚子，今天没有产出', 2600);
  }
  else if(animalQty > 0 && settledQty === 0){
    toast('动物产出 ' + animalQty + ' 份（在背包里，可去铁路卖或放出货箱）');
  }
  else if(settledQty > 0) toast('出货箱结算　' + settledQty + ' 件  +' + settled + '金');
  else if(rainy)     toast('下雨了 · 明天不用浇水');
  else               toast('天亮了 · 明天' + weather);
  /* 每日成就统计：单日最高收入 */
  const earnedNow = (GAME.stat && GAME.stat.earned) || 0;
  if(GAME.ct.dayEarnMark == null) GAME.ct.dayEarnMark = earnedNow;
  bumpMax('bestDayEarn', earnedNow - GAME.ct.dayEarnMark);
  GAME.ct.dayEarnMark = earnedNow;

  /* ⑥ 每日结算面板（住院那三次不弹） */
  const sum = {
    day: GAME.day, season: SEASON_NAMES[GAME.season], weather,
    earn: Math.max(0, earnedNow - (GAME._dEarn0 || 0)),
    spend: Math.max(0, (((GAME.ct && GAME.ct.spent) || 0) - (GAME._dSpend0 || 0))),
    bin: settledQty, binGold: settled,
    grow: grownCount, dead: (typeof dead === 'number' ? dead : 0),
    animal: animalQty
  };
  GAME._dEarn0 = earnedNow;
  GAME._dSpend0 = (GAME.ct && GAME.ct.spent) || 0;
  grownCount = 0;
  if(!GAME._silentEnd) openDaySummary(sum);
  if(crowMsg) toast(crowMsg, 2200);
  else if(sprinkled > 0) toast('洒水器浇了 ' + sprinkled + ' 格', 1800);
  sfx.dawn();
  return {settled, settledQty, rainy, dead};
}
function tickTime(dt){
  GAME.minutes += dt * MIN_PER_SEC;
  if(GAME.minutes >= 1560){ endDay(); }
  const hh = Math.floor(GAME.minutes/60), mm = Math.floor(GAME.minutes%60);
  refreshSeasonBtn();
  if(scene === 'farm' && (GAME._lastGold !== GAME.gold)){
    GAME._lastGold = GAME.gold; updateFarmNav();
  }
  const clock = SEASON_NAMES[GAME.season] + GAME.day + '日 ' +
                String(hh).padStart(2,'0') + ':' + String(mm - mm%10).padStart(2,'0') +
                (weather !== '晴' ? ' ' + weather : '');
  const hud = document.getElementById('hud');
  const E = Math.max(0,Math.round(energy)), G = GAME.gold||0;
  const SEL = GAME.seedSel || 'strawberry';
  const S = (GAME.seedsBy && GAME.seedsBy[SEL]) || 0;
  const sig = clock + '|s'+scene + '|h'+Math.round(GAME.hp||0) +
              (scene==='farm' ? '|E'+E+'|G'+G+'|S'+SEL+S : '|G'+G);
  if(hud.dataset.sig !== sig){
    hud.dataset.sig = sig;
    const I = n => '<svg class="ico" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
    const inMine = (scene === 'sub' && curScene && curScene.name === '矿洞');
    hud.innerHTML = clock + (scene==='farm'
      ? '   ' + I('heart') + ' ' + E + '/' + maxEnergy() +
        '   ' + I('coin') + ' ' + G + '   ' + I('seed') + ' ' + cropName(SEL) + '×' + S
      : (inMine
          ? '   ' + I('heart') + ' ' + Math.round(GAME.hp) + '/' + GAME.maxHp +
            '   ' + I('coin') + ' ' + G
          : '   ' + I('coin') + ' ' + G));
  }
}

/* ============ 更新 ============ */
function update(dt){
  /* 兜底：万一坐标被算成 NaN，人就会"动不了"，这里直接拉回 */
  if(!Number.isFinite(P.x) || !Number.isFinite(P.y)){
    const sp = safeSpot(300, 360);
    P.x = sp.x; P.y = sp.y; P.path = null;
  }
  tickTime(dt);
  if(FI.on){ updateFishing(dt); return; }   /* 钓鱼时冻结走动 */
  /* 体力见底提示（只提示一次，回满后重置） */
  if(energy <= 0 && !GAME._e0){ GAME._e0 = 1; toast('体力耗尽了 · 走路变慢了，回去睡一觉或吃点东西', 3000); }
  if(energy > 0) GAME._e0 = 0;
  updateMining(dt);
  updateChips(dt);
  tickMachines();
  tickCraft();
  if(!update._achT || performance.now() - update._achT > 900){ update._achT = performance.now(); checkAch(); }
  if(scene === 'sub' && curScene && curScene.name === '牧场') updatePets(dt);
  if(scene === 'sub' && curScene && curScene.name === '矿洞') updateCombat(dt);
  let dx=0, dy=0;
  const k = keys;
  if(k['a']||k['arrowleft'])  dx-=1;
  if(k['d']||k['arrowright']) dx+=1;
  if(k['w']||k['arrowup'])    dy-=1;
  if(k['s']||k['arrowdown'])  dy+=1;

  if(dx||dy){
    P.path = null;                      // 手动操作打断寻路
    const len = Math.hypot(dx,dy);
    dx/=len; dy/=len;
    moveBy(dx*moveSpeed()*dt, dy*moveSpeed()*dt);
    setDir(dx,dy);
  } else if(P.path && P.pathIdx < P.path.length){
    const wp = P.path[P.pathIdx];
    const ddx = wp.x - P.x, ddy = wp.y - P.y;
    const d = Math.hypot(ddx,ddy);
    if(d < 6){ P.pathIdx++; }
    else {
      moveBy(ddx/d*moveSpeed()*dt, ddy/d*moveSpeed()*dt);
      setDir(ddx,ddy);
    }
    if(P.pathIdx >= P.path.length) P.path = null;
  }

  /* 动画 */
  if(P.moving){ P.anim += dt*9; P.frame = Math.floor(P.anim)%4; P.stuck = 0; sfx.step(); }
  else {
    P.anim = 0; P.frame = 1;
    /* 想走却走不动 —— 丢掉路径，别让人物钉在原地 */
    if(P.path){ P.stuck = (P.stuck||0) + dt; if(P.stuck > 0.35){ P.path = null; P.stuck = 0; } }
  }
  P.moving = false;

  /* TA：有路径就走，没路径就自己找事 / 或者面向玩家待机 */
  TA.t += dt;
  if(!TA._chk || TA.t - TA._chk > 2){ TA._chk = TA.t; taRescue(); }
  const taWalking = taFollow(dt);
  if(!taWalking) taThink(dt);
  if(TA.bubble){ TA.bubble.t -= dt; if(TA.bubble.t <= 0) TA.bubble = null; }
  if(!taWalking){
    TA.frame = (Math.floor(TA.t / 0.7) % 2) ? 3 : 1;   /* 站着时的轻微起伏 */
    taSetDir(P.x - TA.x, P.y - TA.y);                   /* 空闲时一直看着你 */
  }

  /* 相机 */
  cam.z += (cam.tz - cam.z) * Math.min(1, dt*10);
  if(Math.abs(cam.z - cam.tz) < 0.002) cam.z = cam.tz;
  const vw = cv.width/cam.z/dpr, vh = cv.height/cam.z/dpr;
  /* 室内：相机偏上，把玩家放在屏幕下方 —— 不然柜台/货架永远在视口外 */
  const biasY = (scene === 'sub') ? vh*0.80 : vh/2;   /* 小场景多看一点上方 */
  let tx = P.x - vw/2, ty = P.y - biasY;
  tx = Math.max(0, Math.min(WW-vw, tx));
  ty = Math.max(0, Math.min(WH-vh, ty));
  if(WW < vw) tx = 0;
  if(WH < vh) ty = 0;
  cam.x += (tx-cam.x)*Math.min(1, dt*8);
  cam.y += (ty-cam.y)*Math.min(1, dt*8);


  /* 井边交互 */
  nearWell = false; nearPlot = false; nearExit = false;
  if(scene === 'farm'){
    /* 按「到矩形边缘」算，而不是到中心 —— 中心在碰撞体里面，永远够不着 */
    const wr = FARM.wellRect;
    const wdx = Math.max(wr[0]-P.x, 0, P.x-wr[2]);
    const wdy = Math.max(wr[1]-P.y, 0, P.y-wr[3]);
    if(Math.hypot(wdx, wdy) < FARM.wellR) nearWell = true;
    const g = FARM.plot;
    const px = Math.max(g.x, Math.min(g.x + g.cols*g.cw, P.x));
    const py = Math.max(g.y + ROW_Y[0], Math.min(g.y + ROW_Y[g.rows-1] + rowH(g.rows-1), P.y));
    if(Math.hypot(P.x - px, P.y - py) < 110) nearPlot = true;
    if(P.y > 860) nearExit = true;
    nearBin = Math.hypot(P.x-(BIN.x+BIN.w/2), P.y-(BIN.y+BIN.h/2)) < 115;
    nearDoor = Math.hypot(P.x-FARM_DOOR.x, P.y-FARM_DOOR.y) < 105;
    nearBench = Math.hypot(P.x-(BENCH.x+BENCH.w/2), P.y-(BENCH.y+BENCH.h/2)) < 95;
  }

  /* 小场景：出口 + 热点 + 矿点 */
  subExit = false; subHot = null; subMine = null;
  if(scene === 'sub' && curScene){
    if(curScene.exitAt && P.y > curScene.exitAt.y) subExit = true;
    const hs = curScene.hots || (curScene.hot ? [curScene.hot] : []);
    let bestD = 1e9;
    for(const hh of hs){
      const d = Math.hypot(P.x-hh.x, P.y-hh.y);
      if(d < hh.r && d < bestD){ bestD = d; subHot = hh; }
    }
    if(curScene.water && !subHot){
      for(const r of curScene.water){
        if(rectDist(P.x, P.y, r) < 130){ subHot = { label:'钓鱼', act:()=>openFishing() }; break; }
      }
    }
    if(curScene.mining){
      let best = 118;
      for(const n of mineNodes){
        if(n.hp <= 0) continue;
        const d = Math.hypot(P.x-n.x, P.y-n.y);
        if(d < best){ best = d; subMine = n; }
      }
    }
  }
  /* 每个小场景都有明确的「离开」按钮，不用靠走到最底下 */
  const exb = document.getElementById('exitBtn');
  const pgb = document.getElementById('pageBtn');
  if(pgb){
    pgb.style.display = (scene === 'world') ? 'block' : 'none';
    pgb.textContent = ['下一页 ▸ 谷外荒野', '下一页 ▸ 姜岛', '◂ 回鹈鹕镇'][mapPage];
  }
  const lb = document.getElementById('liftBtn');
  if(lb) lb.style.display = (scene === 'sub' && curScene && curScene.name === '矿洞') ? 'block' : 'none';
  const atk = document.getElementById('atkBtn');
  if(atk){
    const near = (scene === 'sub' && curScene && curScene.name === '矿洞') ? nearestSlime() : null;
    atk.style.display = near ? 'flex' : 'none';
    if(near){ const lb = document.getElementById('atkLabel'); if(lb) lb.textContent = weapon().name; }
  }
  if(exb){
    if(scene === 'sub' && curScene){ exb.style.display = 'block'; exb.textContent = '离开 ' + curScene.name; }
    else if(scene === 'farm'){ exb.style.display = 'block'; exb.textContent = '离开 农场'; }
    else exb.style.display = 'none';
  }

  /* 挖矿条：有矿点就挖，挖空了就下潜 */
  const mb = document.getElementById('minebar');
  if(mb){
    const inMine = (scene === 'sub' && curScene && curScene.mining);
    const cleared = inMine && mineCleared();
    if(inMine && (subMine || cleared)){
      mb.style.display = 'flex';
      const lv = '第' + GAME.mineLayer + '层';
      if(cleared){
        document.getElementById('mineTxt').textContent =
          (GAME.mineLayer >= 8 ? '今天挖到底了 · 睡一觉刷新' : '下潜到 第' + (GAME.mineLayer+1) + '层');
      } else {
        document.getElementById('mineTxt').textContent =
          lv + ' · 挖 ' + ORES[subMine.kind].name + '　剩 ' + subMine.hp + ' 下';
      }
      const fill = document.getElementById('mbFill');
      if(fill) fill.style.width = (MINING.on ? Math.max(0, MINING.prog)*100 : 0).toFixed(1) + '%';
    } else {
      mb.style.display = 'none';
      MINING.on = false; MINING.prog = 0;
    }
  }

  /* 最近入口（只在世界地图上判定；农场/小场景里不弹） */
  nearEntry = null; nearPoi = null;
  if(scene === 'world'){
    let best = ENTER_R;
    for(const en of ENTRIES){
      const d = Math.hypot(en.x-P.x, en.y-P.y);
      if(d < best){ best = d; nearEntry = en; }
    }
    /* 不是入口、但有功能的地点（诊所/酒馆/八角泉…） */
    if(!nearEntry){
      let bd = 58;
      for(const k in POI_ACT){
        const a = POI_ACT[k];
        if(a.sx == null) continue;
        const d = Math.hypot(a.sx - P.x, a.sy - P.y);
        if(d < bd){ bd = d; nearPoi = { key:k, label:a.label }; }
      }
    }
  }
  /* 水壶容量条：只在农场里、靠井或靠菜地时出现 */
  const cb = document.getElementById('canbar');
  if(scene === 'farm' && (nearWell || nearPlot)){
    cb.style.display = 'flex';
    const pct = Math.max(0, Math.min(1, can / canMax())) * 100;
    document.getElementById('canfill').style.width = pct.toFixed(1) + '%';
    document.getElementById('cantext').textContent = can + '/' + canMax();
    document.getElementById('canfill').style.background =
      can === 0 ? '#8a5a4a' : (can <= canMax()*0.25 ? 'linear-gradient(#F5C79F,#D98A5F)'
                                                    : 'linear-gradient(#9FD8F5,#5FA8D3)');
  } else cb.style.display = 'none';

  const btn = document.getElementById('enter');
  if(scene === 'farm' && nearDoor){
    btn.style.display = 'block';
    btn.textContent = '进屋';
  } else if(scene === 'farm' && nearBench){
    btn.style.display = 'block';
    btn.textContent = (GAME.crafts && GAME.crafts.length) ? '加工台（' + GAME.crafts.length + ' 件在做）' : '加工台';
  } else if(scene === 'farm' && nearBin){
    btn.style.display = 'block';
    btn.textContent = canShip()
      ? '出货（作物' + totalCrops() + ' · 蛋奶' + totalGoods() + ' · 矿' + totalOres() + ' · 加工' + totalCrafted() + '）'
      : '出货箱（空的）';
  } else if(false){
    btn.style.display = 'block';
    btn.textContent = '出货（作物' + totalCrops() + ' · 蛋奶' + totalGoods() + ' · 矿' + totalOres() + ' · 加工' + totalCrafted() + '）';
  } else if(scene === 'farm' && nearWell){
    btn.style.display = 'block';
    btn.textContent = (can >= CAN_MAX) ? '水壶已满' : '打水';
  } else if(scene === 'farm' && nearExit){
    btn.style.display = 'block';
    btn.textContent = '离开 农场';
  } else if(scene === 'sub'){
    if(!subHot && isFestival() && curScene && curScene.name === '镇中心' &&
       Math.hypot(P.x - 760, P.y - 660) < 190){
      subHot = { label:'节日集市', act:()=>openFestival() };
    }
    if(subHot){ btn.style.display = 'block'; btn.textContent = subHot.label; }
    else if(subExit){ btn.style.display = 'block'; btn.textContent = '离开 ' + curScene.name; }
    else btn.style.display = 'none';
  } else if(nearEntry){
    btn.style.display = 'block';
    btn.textContent = '进入 ' + nearEntry.name;
  } else if(nearPoi){
    btn.style.display = 'block';
    btn.textContent = nearPoi.label;
  } else btn.style.display = 'none';
}

function moveBy(mx,my){
  const nx = P.x + mx, ny = P.y + my;
  let moved = false;
  if(!blockedAt(nx, P.y)){ P.x = nx; moved = true; }
  if(!blockedAt(P.x, ny)){ P.y = ny; moved = true; }
  if(moved) P.moving = true;
}
function setDir(dx,dy){
  if(Math.abs(dx) > Math.abs(dy)) P.dir = 'side';
  else P.dir = dy > 0 ? 'down' : 'up';
  if(Math.abs(dx) > Math.abs(dy)) P.flip = dx > 0;  /* 侧向素材本身朝左，往右走才镜像 */
}
P.flip = false;

/* ============ 渲染 ============ */
let dpr = Math.min(2, devicePixelRatio||1);
function resize(){
  dpr = Math.min(2, devicePixelRatio||1);
  cv.width = Math.floor(innerWidth*dpr);
  cv.height = Math.floor(innerHeight*dpr);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

function draw(){
  const z = cam.z;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#2b2026';
  ctx.fillRect(0,0,cv.width,cv.height);

  ctx.setTransform(z*dpr,0,0,z*dpr,-cam.x*z*dpr,-cam.y*z*dpr);
  ctx.imageSmoothingEnabled = false;
  if(mapImg){
    const tint = (scene === 'sub' && curScene && curScene.mining)
      ? ((MINE_LAYERS[GAME.mineLayer] || {}).tint || '') : '';
    if(tint) ctx.filter = tint;
    ctx.drawImage(mapImg, 0, 0, WW, WH);
    if(tint) ctx.filter = 'none';
  }

  /* ---- 1. 夜色 + 灯光（先压暗，再打光）---- */
  /* 所有场景都吃昼夜：小场景按 ambient 打折，矿洞另有暗度下限 */
  let dk = darknessAt(GAME.minutes);
  if(scene === 'sub' && curScene){
    if(curScene.fixedDark != null) dk = curScene.fixedDark;   /* 恒定暗度，不随时间变 */
    else {
      if(curScene.ambient != null) dk *= curScene.ambient;
      if(curScene.minDark) dk = Math.max(dk, curScene.minDark);
    }
  }
  if(Math.abs(dk - lastDk) > 0.02){          /* UI 跟着场景一起变暗，夜里别刺眼 */
    lastDk = dk;
    document.documentElement.style.setProperty('--dk', dk.toFixed(3));
  }
  if(dk > 0.02){
    const vw = cv.width/(cam.z*dpr), vh = cv.height/(cam.z*dpr);
    ctx.save();
    ctx.fillStyle = 'rgba(22,26,58,' + (dk*0.80).toFixed(3) + ')';
    ctx.fillRect(cam.x-20, cam.y-20, vw+40, vh+40);
    if(lightCanvas && scene !== 'sub'){     /* 那张灯图是照世界坐标算的，别往小场景上盖 */
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, dk*1.5);
      ctx.drawImage(lightCanvas, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    /* 随身提灯照地面（画在人物之前，只照亮地面） */
    if(dk > 0.10){
      const lg = ctx.createRadialGradient(P.x, P.y-10, 24, P.x, P.y-10, 118);
      lg.addColorStop(0,   'rgba(255,222,168,' + (0.26*dk).toFixed(3) + ')');
      lg.addColorStop(0.55,'rgba(255,206,150,' + (0.09*dk).toFixed(3) + ')');
      lg.addColorStop(1,   'rgba(255,200,140,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(P.x, P.y-10, 118, 0, Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  /* ---- 1.4 农场交互提示 ---- */
  if(scene === 'farm'){
    /* 井：靠近时地面泛一圈水光 */
    const wr = FARM.wellRect;
    const cxw = (wr[0]+wr[2])/2, cyw = (wr[1]+wr[3])/2;
    const dw = Math.hypot(P.x-cxw, P.y-cyw);
    if(dw < 260){
      const a = Math.max(0, 1 - dw/260) * 0.35;
      const rg = ctx.createRadialGradient(cxw, cyw+60, 10, cxw, cyw+60, 150);
      rg.addColorStop(0, 'rgba(150,215,255,' + a.toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(150,215,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cxw, cyw+60, 150, 0, Math.PI*2); ctx.fill();
    }
    /* 底部出口：一排箭头 */
    const t = performance.now()/400;
    ctx.fillStyle = 'rgba(255,246,238,' + (0.35 + Math.sin(t)*0.18).toFixed(3) + ')';
    for(let i=0;i<3;i++){
      const yy = 900 + i*16;
      ctx.beginPath();
      ctx.moveTo(760, yy); ctx.lineTo(776, yy); ctx.lineTo(768, yy+10);
      ctx.closePath(); ctx.fill();
    }
  }

  /* ---- 1.5 农场地块 ---- */
  if(scene === 'farm'){
    const g = FARM.plot;
    for(const pl of plots){
      if(!pl.tilled) continue;
      const x = g.x + pl.c*g.cw, y = rowTop(pl.r), hh = rowH(pl.r);
      /* 干土：统一浅棕；浇水后：深棕 */
      ctx.fillStyle = pl.watered ? '#6A4327' : '#A87A52';
      ctx.fillRect(x+1, y+1, g.cw-2, hh-2);
      ctx.fillStyle = pl.watered ? '#57351C' : '#9C7049';
      const ln = Math.floor((hh-8)/3);
      for(let k=0;k<3;k++) ctx.fillRect(x+4, y+6+k*(ln+2), g.cw-8, ln);
      if(pl.crop){
        const cc = CROPS[pl.crop];
        if(cc) drawCrop(cc, Math.min(4, pl.stage), x + g.cw/2, y + hh - 10, g.cw);
      }
    }
    ctx.strokeStyle = 'rgba(80,46,28,.62)';   /* 棕色田埂线，不用白线（0.42 太淡，手机上看不出格子） */
    ctx.lineWidth = 1;
    for(let i=0;i<=g.cols;i++){
      ctx.beginPath(); ctx.moveTo(g.x+i*g.cw, rowTop(0)); ctx.lineTo(g.x+i*g.cw, rowTop(g.rows-1)+rowH(g.rows-1)); ctx.stroke();
    }
    for(let i=0;i<g.rows;i++){
      const yy = rowTop(i);
      ctx.beginPath(); ctx.moveTo(g.x, yy); ctx.lineTo(g.x+g.cols*g.cw, yy); ctx.stroke();
      const yb = yy + rowH(i);
      ctx.beginPath(); ctx.moveTo(g.x, yb); ctx.lineTo(g.x+g.cols*g.cw, yb); ctx.stroke();
    }
    /* 手指/鼠标指着哪一格就框哪一格 —— 98 格里点错一次很烦 */
    if(hover){
      const hp = plotAt(hover.x, hover.y);
      if(hp){
        const hx = g.x + hp.c*g.cw, hy = rowTop(hp.r), hh2 = rowH(hp.r);
        ctx.strokeStyle = 'rgba(255,255,255,.94)'; ctx.lineWidth = 2;
        ctx.strokeRect(hx+1.5, hy+1.5, g.cw-3, hh2-3);
        ctx.strokeStyle = 'rgba(210,110,145,.98)'; ctx.lineWidth = 1;
        ctx.strokeRect(hx+4, hy+4, g.cw-8, hh2-8);
      }
    }
  }

  /* ---- 1.52 洒水器 / 稻草人（跟着格子画）---- */
  if(scene === 'farm' && plots){
    const gg = FARM.plot;
    for(const it of farmPlaced()){
      const cx = gg.x + it.c * gg.cw, cy = rowTop(it.r);
      if(it.kind === 'sprinkler'){
        ctx.fillStyle = 'rgba(40,50,60,.26)'; ctx.fillRect(cx + 6, cy + 24, 20, 5);
        ctx.fillStyle = '#8A9AA8'; ctx.fillRect(cx + 12, cy + 10, 8, 14);
        ctx.fillStyle = '#B9C6D2'; ctx.fillRect(cx + 8,  cy + 7,  16, 5);
        ctx.fillStyle = '#6E7C88'; ctx.fillRect(cx + 10, cy + 6,  3, 3);
        ctx.fillRect(cx + 19, cy + 6, 3, 3);
      } else {
        ctx.fillStyle = 'rgba(40,50,60,.26)'; ctx.fillRect(cx + 8, cy + 25, 16, 4);
        ctx.fillStyle = '#8A5A34'; ctx.fillRect(cx + 14, cy + 12, 4, 14);
        ctx.fillStyle = '#C8B48A'; ctx.fillRect(cx + 9,  cy + 8,  14, 5);
        ctx.fillStyle = '#E8D8A8'; ctx.fillRect(cx + 11, cy + 2,  10, 7);
        ctx.fillStyle = '#5A3B2A'; ctx.fillRect(cx + 13, cy + 4,  2, 2);
        ctx.fillRect(cx + 17, cy + 4, 2, 2);
        ctx.fillStyle = '#C8B48A'; ctx.fillRect(cx + 12, cy + 9, 8, 3);
      }
    }
  }

  /* ---- 1.52 旅行商人标记（世界地图上能一眼看到） ---- */
  if(scene === 'world' && POI && POI.trader && mapPage === 0){
    const tp = POI.trader;
    const near = Math.hypot(P.x - tp.x, P.y - tp.y) < 320;
    const pulse = Math.sin(performance.now()/300) * 0.5 + 0.5;
    /* 木牌 */
    ctx.fillStyle = '#6B4A2E'; ctx.fillRect(tp.x-2, tp.y-26, 5, 26);
    ctx.strokeStyle = '#3A2416'; ctx.lineWidth = 2;
    ctx.fillStyle = '#C89A5A'; ctx.fillRect(tp.x-16, tp.y-46, 32, 22);
    ctx.strokeRect(tp.x-16, tp.y-46, 32, 22);
    ctx.fillStyle = '#3A2416';
    ctx.font = 'bold 16px "Songti SC",serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', tp.x, tp.y - 34);
    /* 脚下的光圈 */
    ctx.strokeStyle = 'rgba(232,194,74,' + (near ? 0.55 + pulse*0.4 : 0.25) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(tp.x, tp.y + 2, 20 + pulse*4, 8 + pulse*2, 0, 0, Math.PI*2); ctx.stroke();
  }

  /* ---- 1.53 农场上的加工机 ---- */
  if(scene === 'farm' && plots){
    const gg2 = FARM.plot;
    for(const m of (GAME.machines || [])){
      if(m.farm !== farmIdx) continue;
      const x = gg2.x + m.c * gg2.cw, y = rowTop(m.r);
      const by = y + rowH(m.r) - 4;
      /* 底板影子，机器才不像贴纸 */
      ctx.fillStyle = 'rgba(60,40,30,.28)';
      ctx.beginPath();
      ctx.ellipse(x + gg2.cw/2, by + 2, 21, 7, 0, 0, Math.PI*2);
      ctx.fill();
      const cx = x + gg2.cw/2;                 /* 以格子中心对齐 */
      ctx.strokeStyle = 'rgba(58,38,26,.85)'; ctx.lineWidth = 2;
      if(m.kind === 'furnace'){
        ctx.fillStyle = '#6E6E76'; ctx.fillRect(cx-16, by-46, 32, 46);
        ctx.strokeRect(cx-16, by-46, 32, 46);
        ctx.fillStyle = '#9AA0A6'; ctx.fillRect(cx-13, by-42, 26, 10);
        ctx.fillStyle = '#5A5A62'; ctx.fillRect(cx-13, by-30, 26, 6);
        ctx.fillStyle = m.job ? '#E8A23A' : '#4A3A32';
        ctx.fillRect(cx-9, by-22, 18, 16);
        if(m.job){ ctx.fillStyle = '#FFE98A'; ctx.fillRect(cx-5, by-18, 10, 8); }
        ctx.fillStyle = '#4A4A52'; ctx.fillRect(cx-4, by-52, 8, 7);   /* 烟囱 */
      } else if(m.kind === 'keg'){
        ctx.fillStyle = '#8A5A34'; ctx.fillRect(cx-17, by-48, 34, 48);
        ctx.strokeRect(cx-17, by-48, 34, 48);
        ctx.fillStyle = '#B07A4A'; ctx.fillRect(cx-13, by-44, 26, 40);
        ctx.fillStyle = '#5A3B2A';
        ctx.fillRect(cx-17, by-38, 34, 4); ctx.fillRect(cx-17, by-20, 34, 4);
        ctx.fillStyle = '#C8A05A'; ctx.fillRect(cx-6, by-56, 12, 9);  /* 桶塞 */
      } else if(m.kind === 'jar'){
        ctx.fillStyle = '#CFE8F0'; ctx.fillRect(cx-13, by-34, 26, 34);
        ctx.strokeRect(cx-13, by-34, 26, 34);
        ctx.fillStyle = '#E8F4F8'; ctx.fillRect(cx-9, by-31, 14, 12);
        ctx.fillStyle = '#8A5A34'; ctx.fillRect(cx-14, by-40, 28, 7);
        ctx.strokeRect(cx-14, by-40, 28, 7);
        if(m.job){ ctx.fillStyle = '#D8402E'; ctx.fillRect(cx-9, by-24, 18, 18); }
      } else {
        ctx.fillStyle = '#D8DDE2'; ctx.fillRect(cx-15, by-40, 30, 40);
        ctx.strokeRect(cx-15, by-40, 30, 40);
        ctx.fillStyle = '#A8B2BB'; ctx.fillRect(cx-12, by-36, 24, 10);
        ctx.fillStyle = '#8A949C'; ctx.fillRect(cx-3, by-24, 6, 14);   /* 把手 */
        if(m.job){ ctx.fillStyle = '#F6E7B0'; ctx.fillRect(cx-10, by-28, 20, 5); }
      }
      /* 状态：有活干 → 进度条；做好了 → 金色感叹号 */
      const cx2 = x + gg2.cw/2;
      if(m.job){
        const now2 = absMin();
        const pct = Math.max(0, Math.min(1, 1 - (m.job.finish - now2) / Math.max(1, m.job.total)));
        ctx.fillStyle = 'rgba(20,20,28,.65)'; ctx.fillRect(cx2-16, by-66, 32, 5);
        ctx.fillStyle = '#7BC96F'; ctx.fillRect(cx2-16, by-66, 32 * pct, 5);
      } else if(m.out && Object.keys(m.out).some(k => m.out[k] > 0)){
        /* 做好了：金色感叹号 + 呼吸光晕 */
        const g2 = Math.sin(performance.now()/240) * 0.5 + 0.5;
        ctx.fillStyle = 'rgba(232,194,74,' + (0.20 + g2*0.25).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(cx2, by-58, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#FFD84A';
        ctx.fillRect(cx2-2, by-70, 5, 12);
        ctx.fillRect(cx2-2, by-54, 5, 5);
      }
    }
  }

  /* ---- 1.55 加工台 ---- */
  if(scene === 'farm'){
    const bx = BENCH.x, by = BENCH.y, bw = BENCH.w, bh = BENCH.h;
    ctx.fillStyle = 'rgba(60,40,30,.20)';
    ctx.fillRect(bx-2, by+bh-4, bw+4, 6);
    ctx.fillStyle = '#8A5A34'; ctx.fillRect(bx, by+8, bw, bh-8);      /* 台面 */
    ctx.fillStyle = '#A9754A'; ctx.fillRect(bx+2, by+10, bw-4, bh-12);
    ctx.fillStyle = '#6B4327'; ctx.fillRect(bx+3, by+bh-8, 6, 8);      /* 桌腿 */
    ctx.fillRect(bx+bw-9, by+bh-8, 6, 8);
    ctx.fillStyle = '#7C8790'; ctx.fillRect(bx+8, by+2, 16, 9);        /* 台面上的铁砧 */
    ctx.fillStyle = '#A8B2BB'; ctx.fillRect(bx+10, by+3, 12, 4);
    if(GAME.crafts && GAME.crafts.length){                             /* 有活计时冒火星 */
      const tt = performance.now()/300;
      ctx.fillStyle = 'rgba(255,190,90,' + (0.4 + Math.sin(tt)*0.35).toFixed(2) + ')';
      ctx.fillRect(bx+13, by-4, 5, 4);
    }
  }

  /* ---- 1.6 出货箱 ---- */
  if(scene === 'farm'){
    const bx = BIN.x, by = BIN.y, bw = BIN.w, bh = BIN.h;
    ctx.fillStyle = 'rgba(60,40,30,.20)';                 /* 影子 */
    ctx.fillRect(bx-2, by+bh-4, bw+4, 6);
    ctx.fillStyle = '#8A5A34'; ctx.fillRect(bx, by+8, bw, bh-8);   /* 箱体 */
    ctx.fillStyle = '#A9754A'; ctx.fillRect(bx+2, by+10, bw-4, bh-12);
    ctx.strokeStyle = '#6B4327'; ctx.lineWidth = 1;                 /* 木条 */
    for(let i=1;i<3;i++){
      ctx.beginPath(); ctx.moveTo(bx+i*bw/3, by+10); ctx.lineTo(bx+i*bw/3, by+bh-2); ctx.stroke();
    }
    ctx.fillStyle = '#6B4327'; ctx.fillRect(bx-2, by, bw+4, 9);      /* 半开的盖 */
    ctx.fillStyle = '#8A5A34'; ctx.fillRect(bx, by+2, bw, 5);
    if(GAME.bin && GAME.bin.qty > 0){                                /* 有待结算就冒金光 */
      const gt = performance.now()/520;
      ctx.fillStyle = 'rgba(255,214,120,' + (0.5 + Math.sin(gt)*0.3).toFixed(2) + ')';
      ctx.fillRect(bx+bw-7, by-7, 6, 6);
    }
    const dbin = Math.hypot(P.x-(bx+bw/2), P.y-(by+bh/2));
    if(dbin < 135){                                                  /* 走近报数 */
      const txt = '出货箱 ' + (GAME.bin?GAME.bin.qty:0) + ' 件 · ' + (GAME.bin?GAME.bin.value:0) + '金';
      ctx.textAlign = 'center';
      ctx.font = 'bold 12px "Songti SC",serif';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,250,245,.95)';
      ctx.strokeText(txt, bx+bw/2, by-14);
      ctx.fillStyle = '#3A2A20'; ctx.fillText(txt, bx+bw/2, by-14);
      ctx.textAlign = 'start';
    }
  }

  /* ---- 1.7 矿点 ---- */
  if(scene === 'sub' && curScene && curScene.mining){
    const tt = performance.now()/520;
    /* 史莱姆 */
    for(const sl of slimes){
      const bob = Math.sin(sl.wob) * 2;
      ctx.fillStyle = 'rgba(30,40,30,.30)';
      ctx.fillRect(sl.x - 13, sl.y + 2, 26, 5);
      ctx.fillStyle = 'rgba(30,40,30,.32)';
      ctx.fillRect(sl.x - 15, sl.y + 3, 30, 5);
      if(sl.type === 'bug'){
        /* 飞虫：小、快、翅膀抖 */
        const flap2 = Math.sin(sl.wob * 14) * 3;
        ctx.fillStyle = '#D8E8F0';
        ctx.fillRect(sl.x - 10, sl.y - 24 + bob + flap2, 7, 5);
        ctx.fillRect(sl.x + 3,  sl.y - 24 + bob + flap2, 7, 5);
        ctx.fillStyle = sl.hurt > 0 ? '#F08A8A' : '#7A8A5A';
        ctx.fillRect(sl.x - 6, sl.y - 22 + bob, 12, 10);
        ctx.fillStyle = '#2E3A28';
        ctx.fillRect(sl.x - 4, sl.y - 20 + bob, 2, 2);
        ctx.fillRect(sl.x + 2, sl.y - 20 + bob, 2, 2);
      } else if(sl.type === 'skeleton'){
        /* 骷髅：白骨 + 黑洞眼 + 肋骨 */
        ctx.fillStyle = sl.hurt > 0 ? '#F08A8A' : '#E8E4D8';
        ctx.fillRect(sl.x - 10, sl.y - 40 + bob, 20, 14);      /* 头骨 */
        ctx.fillRect(sl.x - 12, sl.y - 26 + bob, 24, 18);      /* 胸腔 */
        ctx.fillStyle = '#3A3230';
        ctx.fillRect(sl.x - 6, sl.y - 36 + bob, 4, 5);
        ctx.fillRect(sl.x + 2, sl.y - 36 + bob, 4, 5);
        ctx.fillRect(sl.x - 3, sl.y - 28 + bob, 6, 3);         /* 鼻 */
        ctx.fillStyle = sl.hurt > 0 ? '#FFC2C2' : '#C8C2B4';
        ctx.fillRect(sl.x - 12, sl.y - 22 + bob, 24, 3);       /* 肋骨 */
        ctx.fillRect(sl.x - 12, sl.y - 16 + bob, 24, 3);
        ctx.fillStyle = '#B8B2A4';
        ctx.fillRect(sl.x - 6, sl.y - 8 + bob, 4, 8);
        ctx.fillRect(sl.x + 2, sl.y - 8 + bob, 4, 8);
      } else if(sl.type === 'crab'){
        /* 石头蟹：灰色壳体 + 两只钳子 */
        ctx.fillStyle = sl.hurt > 0 ? '#F08A8A' : '#8A8A90';
        ctx.fillRect(sl.x - 20, sl.y - 22 + bob, 40, 16);      /* 壳 */
        ctx.fillRect(sl.x - 24, sl.y - 26 + bob, 10, 8);       /* 左钳 */
        ctx.fillRect(sl.x + 14, sl.y - 26 + bob, 10, 8);       /* 右钳 */
        ctx.fillStyle = sl.hurt > 0 ? '#FFC2C2' : '#B4B4BC';
        ctx.fillRect(sl.x - 16, sl.y - 20 + bob, 14, 4);
        ctx.fillStyle = '#2E2E34';
        ctx.fillRect(sl.x - 8, sl.y - 18 + bob, 4, 4);
        ctx.fillRect(sl.x + 4, sl.y - 18 + bob, 4, 4);
      } else if(sl.type === 'bat'){
        /* 蝙蝠：紫身 + 扇动的翅膀 */
        const flap = Math.sin(sl.wob * 6) * 5;
        ctx.fillStyle = '#6B4A8A';
        ctx.fillRect(sl.x - 18, sl.y - 24 + bob + flap, 10, 7);
        ctx.fillRect(sl.x + 8,  sl.y - 24 + bob + flap, 10, 7);
        ctx.fillStyle = sl.hurt > 0 ? '#F08A8A' : '#8E6BAE';
        ctx.fillRect(sl.x - 8, sl.y - 22 + bob, 16, 14);
        ctx.fillStyle = '#3A2A48';
        ctx.fillRect(sl.x - 5, sl.y - 18 + bob, 3, 3);
        ctx.fillRect(sl.x + 2, sl.y - 18 + bob, 3, 3);
      } else if(sl.type === 'big'){
        ctx.fillStyle = sl.hurt > 0 ? '#F08A8A' : '#4E9A5A';
        ctx.fillRect(sl.x - 22, sl.y - 28 + bob, 44, 30);
        ctx.fillRect(sl.x - 15, sl.y - 37 + bob, 30, 12);
        ctx.fillStyle = sl.hurt > 0 ? '#FFC2C2' : '#78C87E';
        ctx.fillRect(sl.x - 16, sl.y - 32 + bob, 14, 5);
        ctx.fillStyle = '#1E3A20';
        ctx.fillRect(sl.x - 10, sl.y - 28 + bob, 6, 6);
        ctx.fillRect(sl.x + 5,  sl.y - 28 + bob, 6, 6);
        ctx.fillStyle = '#E8C24A';                     /* 小王冠 */
        ctx.fillRect(sl.x - 8, sl.y - 44 + bob, 16, 4);
        ctx.fillRect(sl.x - 6, sl.y - 48 + bob, 3, 4);
        ctx.fillRect(sl.x + 3, sl.y - 48 + bob, 3, 4);
      } else {
      ctx.fillStyle = sl.hurt > 0 ? '#F08A8A' : '#7BC96F';
      ctx.fillRect(sl.x - 16, sl.y - 20 + bob, 32, 22);      /* 身体 */
      ctx.fillRect(sl.x - 11, sl.y - 27 + bob, 22, 9);       /* 头顶 */
      ctx.fillStyle = sl.hurt > 0 ? '#FFC2C2' : '#9BE08E';   /* 高光 */
      ctx.fillRect(sl.x - 12, sl.y - 24 + bob, 10, 4);
      ctx.fillStyle = '#2E4A28';
      ctx.fillRect(sl.x - 8, sl.y - 21 + bob, 5, 5);
      ctx.fillRect(sl.x + 4, sl.y - 21 + bob, 5, 5);
      }
      /* 血条：只在受伤后显示，高度按种类错开（骷髅高、大史莱姆矮） */
      if(sl.hp < sl.maxHp){
        const hw = 32;
        const topY = sl.y - (sl.type === 'skeleton' ? 56 : sl.type === 'big' ? 52 :
                             sl.type === 'bat' ? 40 : sl.type === 'crab' ? 34 : 38) + bob;
        ctx.fillStyle = 'rgba(20,20,28,.7)'; ctx.fillRect(sl.x - 16, topY, hw, 4);
        ctx.fillStyle = '#C8524A';
        ctx.fillRect(sl.x - 16, topY, hw * Math.max(0, sl.hp / sl.maxHp), 4);
      }
    }

    for(const n of mineNodes){
      if(n.hp <= 0) continue;
      const o = ORES[n.kind];
      const shx = (n.shake > 0) ? Math.sin(performance.now() / 18) * (n.shake * 14) : 0;
      ctx.save();
      ctx.translate(shx, 0);
      if(MINING.flash > 0 && MINING.node === n){
        ctx.fillStyle = 'rgba(255,255,255,' + (MINING.flash*3.2).toFixed(2) + ')';
        ctx.fillRect(n.x-20, n.y-24, 40, 40);
      }
      if(n.chest){
        ctx.fillStyle = '#7A4A28'; ctx.fillRect(n.x-15, n.y-12, 30, 22);
        ctx.fillStyle = '#C89A4A'; ctx.fillRect(n.x-15, n.y-12, 30, 5);
        ctx.fillRect(n.x-3, n.y-6, 6, 9);
        ctx.fillStyle = '#E8C24A'; ctx.fillRect(n.x-2, n.y-4, 4, 5);
      } else {
      ctx.fillStyle = o.dark;  ctx.fillRect(n.x-14, n.y-10, 28, 20);
      ctx.fillStyle = o.col;   ctx.fillRect(n.x-11, n.y-12, 22, 16);
      ctx.fillStyle = o.light; ctx.fillRect(n.x-7,  n.y-9,   8, 6);
      ctx.fillStyle = 'rgba(255,246,200,' + (0.35 + Math.sin(tt)*0.25).toFixed(2) + ')';
      ctx.fillRect(n.x+8, n.y-18, 5, 5);
      }
      for(let i=0;i<n.hp;i++){                    /* 还剩几下 */
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.fillRect(n.x-6+i*5, n.y-24, 3, 3);
      }
      ctx.restore();
    }
    drawChips();
  }

  /* ---- 1.8 牧场里的动物（按你实际养的数量画）---- */
  if(scene === 'sub' && curScene && curScene.name === '牧场'){
    if(!petActors.length && (GAME.animals && (GAME.animals.chicken || GAME.animals.duck || GAME.animals.cow))) initPets();
    for(const a of petActors){
      if(a.kind === 'chicken') drawChicken(a.x, a.y);
      else if(a.kind === 'duck') drawDuck(a.x, a.y);
      else drawCow(a.x, a.y);
    }
  }

  /* ---- 1.95 旅行商人的小摊（每天换地方）---- */
  if(scene === 'world' && mapPage === 0 && POI.trader){
    const tx = POI.trader.x + 30, ty = POI.trader.y + 4;   /* 画在站位旁边，别被人挡 */
    ctx.fillStyle = 'rgba(40,30,20,.30)';                 /* 影子 */
    ctx.fillRect(tx - 22, ty - 2, 44, 8);
    ctx.fillStyle = '#8A5A34';                            /* 推车底盘 */
    ctx.fillRect(tx - 20, ty - 16, 40, 14);
    ctx.fillStyle = '#A9754A';
    ctx.fillRect(tx - 18, ty - 14, 36, 10);
    ctx.fillStyle = '#D8402E';                            /* 条纹棚顶 */
    for(let i = 0; i < 5; i++){
      ctx.fillStyle = (i % 2) ? '#F6E7B0' : '#D8402E';
      ctx.fillRect(tx - 22 + i * 9, ty - 30, 9, 10);
    }
    ctx.fillStyle = '#7A3B2A';
    ctx.fillRect(tx - 22, ty - 21, 44, 3);                /* 棚檐 */
    ctx.fillStyle = '#5A3B2A';                            /* 车轮 */
    ctx.fillRect(tx - 16, ty - 3, 8, 8);
    ctx.fillRect(tx + 8,  ty - 3, 8, 8);
    ctx.fillStyle = '#C8B48A';
    ctx.fillRect(tx - 4, ty - 14, 6, 8);                  /* 货箱 */
    ctx.fillStyle = '#2E5A3A';                            /* 商人（小绿人） */
    ctx.fillRect(tx + 6, ty - 22, 8, 10);
    ctx.fillStyle = '#E8D8A8';
    ctx.fillRect(tx + 7, ty - 27, 6, 6);
  }

  /* ---- 2. 人物（夜里跟着变暗）---- */
  const actors = [
    {s:sprites,   st:P,  isPlayer:true},
    {s:taSprites, st:TA, isPlayer:false},
  ].sort((a,b)=> a.st.y - b.st.y);
  for(const a of actors){
    const arr = a.s[a.st.dir] || a.s.down;
    const img = arr && arr[a.st.frame];
    if(!img) continue;
    /* 提灯在自己手上 —— 玩家几乎不压暗；TA 离得远，压暗多一些 */
    const k  = a.isPlayer ? 0.22 : 0.58;
    const bri = 1 - dk*k;
    const sat = 1 - dk*(a.isPlayer ? 0.10 : 0.26);
    if(bri < 0.99) ctx.filter = 'brightness(' + bri.toFixed(3) + ') saturate(' + sat.toFixed(3) + ')';
    ctx.save();
    ctx.translate(a.st.x, a.st.y);
    if(a.st.dir === 'side' && a.st.flip) ctx.scale(-1,1);
    const S = actorScale();
    ctx.drawImage(img, -48*S, -96*S, 96*S, 96*S);
    ctx.restore();
    /* 玩家头顶血条：只在有战斗的矿洞里显示 */
    if(a.isPlayer && scene === 'sub' && curScene && curScene.name === '矿洞'){
      const hp = Math.max(0, GAME.hp || 0), mx = GAME.maxHp || 100;
      const bw = 52, bh = 6, bx = a.st.x - bw/2, by = a.st.y - 96*actorScale() - 14;
      ctx.fillStyle = 'rgba(20,20,28,.72)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = hp / mx > 0.5 ? '#6FC24E' : hp / mx > 0.25 ? '#E8B93A' : '#D8483E';
      ctx.fillRect(bx, by, bw * (hp / mx), bh);
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Songti SC",serif';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(hp) + '/' + mx, a.st.x, by - 4);
      ctx.textAlign = 'left';
    }
    ctx.filter = 'none';
  }

  /* ---- 3. TA 说话气泡 ---- */
  if(TA.bubble && caps.L){
    ctx.save();
    const bri2 = 1 - dk*0.30;
    if(bri2 < 0.99) ctx.filter = 'brightness(' + bri2.toFixed(3) + ')';
    ctx.font = '12px "Songti SC","SimSun",serif';
    const txt = TA.bubble.text;
    const tw  = ctx.measureText(txt).width;
    const mw  = Math.max(28, Math.round(tw + 24 - caps.L.width - caps.R.width));
    const bw  = caps.L.width + mw + caps.R.width;
    const by  = TA.y - 96*actorScale() - 48 - 12;   /* 跟着角色大小上移 */
    let   bx  = TA.x - 11;
    bx = Math.max(4, Math.min(WW - bw - 4, bx));
    ctx.drawImage(caps.L, bx, by);
    ctx.drawImage(caps.M, bx + caps.L.width, by, mw, 48);
    ctx.drawImage(caps.R, bx + caps.L.width + mw, by);
    ctx.filter = 'none';
    ctx.fillStyle = '#4a3226';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, bx + caps.L.width + mw/2, by + 24);
    ctx.restore();
  }

  /* ---- 3.5 天气 ---- */
  drawWeather();

  /* ---- 4. 调试 ---- */
  if(debug){
    ctx.globalAlpha = 0.35;
    for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
      if(!walkable(x,y)){
        ctx.fillStyle = '#ff3b5c';
        ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      }
    }
    ctx.globalAlpha = 1;
    if(P.path){
      ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(P.x,P.y);
      for(let i=P.pathIdx;i<P.path.length;i++) ctx.lineTo(P.path[i].x,P.path[i].y);
      ctx.stroke();
    }
    ctx.strokeStyle = '#4da3ff'; ctx.lineWidth = 2;
    ctx.strokeRect(P.x-4, P.y-7, 8, 6);
  }
}

/* ============ 主循环 ============ */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt);
  /* AI 导航：走到入口附近就自动进门（给 goto 场景目标用） */
  if(window.__svAuto){
    const _a = window.__svAuto;
    if(Math.hypot(P.x - _a.x, P.y - _a.y) < 52){
      window.__svAuto = null;
      try{ if(_a.act) _a.act(); }catch(e){}
    }
  }
  updateWeather(dt);
  draw();
  if(debug){
    document.getElementById('dbg').textContent =
      `场景:${scene}  x:${P.x|0} y:${P.y|0}  格:${Math.floor(P.x/CELL)},${Math.floor(P.y/CELL)}` +
      `  井:${nearWell?'✓':'✗'}  出口:${nearExit?'✓':'✗'}  水:${can}/${CAN_MAX}` +
      (scene==='farm' ? `  距井 ${Math.round(Math.hypot(
        Math.max(FARM.wellRect[0]-P.x,0,P.x-FARM.wellRect[2]),
        Math.max(FARM.wellRect[1]-P.y,0,P.y-FARM.wellRect[3])))}px` : '');
  }
  requestAnimationFrame(loop);
}

/* ============ 入口按钮 ============ */
document.getElementById('enter').addEventListener('click', ()=>{
  if(scene === 'farm' && nearDoor){ enterSubScene('home'); return; }
  if(scene === 'farm' && nearBench){ openCraftShop(); return; }
  if(scene === 'farm' && nearBin && canShip()){ sellOres(); return; }
  if(scene === 'farm' && nearBin){
    /* 空箱也要有反馈，不能点了没反应 */
    toast('出货箱是空的 · 先去收作物、捡蛋挤奶、挖点矿再来', 2800);
    return;
  }
  if(scene === 'farm' && nearWell){ drawWater(); return; }
  if(scene === 'farm' && nearExit){ exitFarm(); toast('回到了世界地图'); return; }
  if(scene === 'sub'){
    if(subHot){ subHot.act(); return; }
    if(subExit){ exitSubScene(); return; }
    return;
  }
  if(scene === 'world' && !nearEntry && nearPoi){
    see('spots', nearPoi.key);
    const fn = POI_FN[nearPoi.key];
    if(fn) fn();
    return;
  }
  if(!nearEntry) return;
  if(nearEntry.id === 'farm'){ enterFarm(); return; }
  if(nearEntry.id === 'smith'){ openSmithShop(); return; }
  /* 入口 id 和场景 id 不一定同名（forest → tower） */
  const ENTRY_SCENE = { shop:'shop', town:'town', mine:'mine', rail:'rail',
                        forest:'tower', ranch:'ranch', beach:'beach', desert:'desert' };
  const sid = ENTRY_SCENE[nearEntry.id] || nearEntry.id;
  if(SCENES[sid]){ enterSubScene(sid); return; }
  const el = document.getElementById('enter');
  el.textContent = '「' + nearEntry.name + '」场景还没做';
  setTimeout(()=>{ if(nearEntry) el.textContent = '进入 ' + nearEntry.name; }, 1200);
});

/* ============ 商店 ============ */
const shopEl = document.getElementById('shop');
let MARKET = null;                      /* 当前打开的是哪家店 */

function payFor(cost){
  if(!Number.isFinite(cost) || cost < 0){ toast('价格异常'); return false; }
  if(!Number.isFinite(GAME.gold) || GAME.gold < cost){
    toast('钱不够 · 还差 ' + Math.max(0, cost - (GAME.gold||0)) + ' 金');
    return false;
  }
  GAME.gold -= cost;
  bump('spent', cost);
  if(GAME.gold < 0) GAME.gold = 0;          /* 兜底，绝不让钱变负 */
  return true;
}
function refreshMarketFoot(){
  const g = document.getElementById('shGold'), sd = document.getElementById('shSeeds');
  if(g) g.textContent = GAME.gold||0;
  if(sd) sd.textContent = Object.values(GAME.seedsBy||{}).reduce((a,b)=>a+b,0);
  const b1 = document.getElementById('shBin'), b2 = document.getElementById('shBinVal');
  if(b1) b1.textContent = GAME.bin ? GAME.bin.qty : 0;
  if(b2) b2.textContent = GAME.bin ? GAME.bin.value : 0;
}
function rebuildMarket(){ if(MARKET && MARKET.rebuild) MARKET.rebuild(); else renderMarket(); }
function openMarket(cfg){
  if(cfg && cfg.items && !cfg.noMkt){
    cfg.items = [{ head:'今日行情　' + mktLine() + (isFestival() ? '　★节日 ×1.35' : '') }].concat(cfg.items);
  }
  MARKET = cfg;
  document.getElementById('shTitle').textContent = cfg.title;
  document.getElementById('shSub').textContent = cfg.sub || '';
  shopEl.classList.add('on');
  sfx.open();
  renderMarket();
}
function closeMarket(){ shopEl.classList.remove('on'); MARKET = null; sfx.close(); }
function renderMarket(){
  const list = document.getElementById('shList');
  if(!list || !MARKET) return;
  list.innerHTML = '';
  MARKET.items.forEach(it=>{
    if(it.head){
      const h = document.createElement('div');
      h.className = 'sh-sec';
      h.textContent = it.head;
      list.appendChild(h);
      return;
    }
    if(it.info){                         /* 信息行：可带右侧奖励和状态徽章 */
      const r = document.createElement('div');
      r.className = 'sh-row sh-info' + (it.done ? ' sh-done' : '');
      r.innerHTML = '<div class="sh-nm">' + it.name +
                    (it.desc ? '<span>' + it.desc + '</span>' : '') + '</div>' +
                    (it.priceText ? '<div class="sh-price">' + it.priceText + '</div>' : '') +
                    (it.badge ? '<span class="sh-badge' + (it.badgeOn ? ' on' : '') + '">' + it.badge + '</span>' : '');
      list.appendChild(r);
      return;
    }
    if(it.bar != null){                  /* 进度条行（成就总进度） */
      const w = document.createElement('div');
      w.className = 'sh-bar';
      w.innerHTML = '<i style="width:' + Math.max(0, Math.min(100, it.bar)).toFixed(1) + '%"></i>' +
                    '<s>' + (it.barText || '') + '</s>';
      list.appendChild(w);
      return;
    }
    const row = document.createElement('div');
    row.className = 'sh-row' + (it.off ? ' sh-off' : '');
    row.innerHTML =
      '<svg class="ico sh-ico" aria-hidden="true"><use href="#' + (it.icon || 'i-seed') + '"/></svg>' +
      '<div class="sh-nm">' + it.name + '<span>' + it.desc + '</span></div>' +
      '<div class="sh-price">' + (it.priceText != null ? it.priceText : it.price + ' 金') + '</div>' +
      '<button class="sh-buy" data-n="1">' + ({
        craft:'制作', quest:'提交', cook:'做菜', eat:'吃掉', sell:'卖1', lotto:'抽奖',
        equip:'戴上', unequip:'摘下', donate:'捐出', gift:'领取', guide:'查看'
      }[it.mode] || '买1') + '</button>' +
      (it.bulk === false ? '' : '<button class="sh-buy" data-n="5">' + (it.mode === 'sell' ? '卖5' : '买5') + '</button>');
    row.querySelectorAll('.sh-buy').forEach(btn=>{
      btn.onclick = e=>{ e.stopPropagation(); MARKET.onBuy(it, Number(btn.dataset.n) || 1); };
    });
    list.appendChild(row);
  });
  refreshMarketFoot();
}
document.getElementById('shClose').onclick = closeMarket;
shopEl.addEventListener('click', e=>{ if(e.target === shopEl) closeMarket(); });

/* ---- 杂货店：20 种种子 ---- */
function openShop(){
  const items = [];
  /* 先列"能卖的作物"：95% 价，立刻到账（比出货箱少 5%，但不用等一夜） */
  const sellable = Object.keys(GAME.crops || {}).filter(k => (GAME.crops[k]||0) > 0);
  if(sellable.length){
    items.push({ head:'卖掉作物（九七折 · 立刻到账）' });
    for(const k of sellable){
      const c = CROPS[k]; if(!c) continue;
      items.push({ key:k, sellCrop:true, mode:'sell', name:c.name, icon:'i-sprout',
                   price: Math.round(cropSellTotal(k, Math.max(1, have), 0.95 * mktMul('crops') * festivalMul() * centerPriceMul() * PM.cropPrice()).gold / Math.max(1, have)), bulk:true,
                   desc:'你有 ' + GAME.crops[k] + ' 个 · 出货箱给 ' + c.sell + ' 金' });
    }
  }
  items.push({ head:'补给' });
  items.push({ key:'fertB', mode:'buy', fert:'basic', name:'基础肥料 ×1', icon:'i-sprout', price:40, bulk:true,
               desc:'施在地里 · 收获时多 1 个' });
  items.push({ key:'fertP', mode:'buy', fert:'premium', name:'高级肥料 ×1', icon:'i-sprout', price:120, bulk:true,
               desc:'收获多 1 个 · 生长可能快一天 · 有 ' + ((GAME.fert&&GAME.fert.premium)||0) + ' 份' });
  items.push({ key:'potion', potion:true, name:'体力药水', icon:'i-heart', price:90, bulk:false,
               desc:'立刻回 80 体力（当前 ' + Math.max(0,Math.round(energy)) + '/' + maxEnergy() + ' 金）'.replace('金）','）') });
  items.push({ head:'买种子' });
  for(const k of Object.keys(CROPS)){
    const c = CROPS[k];
    if(c.rare) continue;
    const now = c.seasons.includes(GAME.season);
    items.push({ key:k, name:c.name + '种子', icon:'i-seed', price:c.buy, off:!now,
                 desc: seasonTag(c) + ' 可种 · ' + c.grow + ' 天 · 卖 ' + c.sell + ' 金' + (now ? '' : ' · 现在不能种') });
  }
  openMarket({
    title:'杂货店', sub:'GENERAL STORE', items, rebuild:()=>openShop(),
    onBuy(it, n){
      if(it.fert){
        if(!payFor(it.price * n)) return;
        GAME.fert[it.fert] = (GAME.fert[it.fert]||0) + n;
        sfx.buy(); toast('买了 ' + n + ' 份' + (it.fert === 'basic' ? '基础' : '高级') + '肥料');
        rebuildMarket(); saveGame(); return;
      }
      if(it.travel){
        const t = it.travel;
        if(t.sold){ toast('这件卖完了'); return; }
        if(!payFor(t.price)) return;
        t.sold = true;
        if(t.kind === 'seed') GAME.seedsBy[t.key] = (GAME.seedsBy[t.key]||0) + 1;
        else if(t.kind === 'ore') GAME.ores[t.key] = (GAME.ores[t.key]||0) + 1;
        else if(t.kind === 'craft') GAME.crafted[t.key] = (GAME.crafted[t.key]||0) + 1;
        else if(t.kind === 'food') GAME.food[t.key] = (GAME.food[t.key]||0) + 1;
        else if(t.kind === 'fert') GAME.fert.premium = (GAME.fert.premium||0) + 1;
        else if(t.kind === 'bait') GAME.bait = (GAME.bait||0) + 5;
        else if(t.kind === 'boot') GAME.bootLv = Math.max(GAME.bootLv||0, 2);
        sfx.coin(); toast('买到 ' + t.name);
        rebuildMarket(); saveGame(); return;
      }
      if(it.potion){
        if(!payFor(it.price * n)) return;
        energy = Math.min(maxEnergy(), energy + 80 * n);
        toast('喝下体力药水　体力 ' + Math.max(0,Math.round(energy)) + '/' + maxEnergy());
        rebuildMarket(); saveGame(); return;
      }
      if(it.sellCrop){
        const have = GAME.crops[it.key] || 0;

function rollTravel(){
  const pool = [];
  for(const k in CROPS) if(CROPS[k].rare) pool.push({ kind:'seed', key:k, name:CROPS[k].name + '种子', base:CROPS[k].buy });
  for(const k in ORES)  pool.push({ kind:'ore', key:k, name:ORES[k].name, base:ORES[k].sell });
  for(const k in CRAFTED) if(!CRAFTED[k].hidden) pool.push({ kind:'craft', key:k, name:CRAFTED[k].name, base:CRAFTED[k].sell || 100 });
  for(const k in RECIPES) pool.push({ kind:'food', key:k, name:RECIPES[k].name, base:RECIPES[k].sell });
  pool.push({ kind:'fert', key:'premium', name:'高级肥料', base:120 });
  pool.push({ kind:'bait', key:'bait', name:'鱼饵 ×5', base:150 });
  pool.push({ kind:'boot', key:'boot', name:'铁靴', base:1200 });
  const pick = [];
  while(pick.length < 3 && pool.length){
    const i = Math.floor(Math.random() * pool.length);
    const it = pool.splice(i, 1)[0];
    it.price = Math.max(10, Math.round(it.base * (0.85 + Math.random() * 0.4)));
    it.sold = false;
    pick.push(it);
  }
  GAME.travel = { day: GAME.day, season: GAME.season, items: pick };
}

function rollTraderStock(){
  const pool = [
    { kind:'craft', key:'goldBar',  name:'金锭',       base:520 },
    { kind:'craft', key:'silverBar',name:'银锭',       base:240 },
    { kind:'craft', key:'hardwood', name:'硬木 ×3',    base:450 },
    { kind:'seed',  key:'starfruit',name:'星之果种子',  base:320 },
    { kind:'seed',  key:'rainbow',  name:'彩虹果种子',  base:200 },
    { kind:'fish',  key:'legend',   name:'传说鱼',      base:1600 },
    { kind:'fert',  key:'premium',  name:'高级肥料 ×2', base:240 },
    { kind:'bait',  key:'bait',     name:'鱼饵 ×10',    base:300 },
    { kind:'boot',  key:'boot',     name:'铁靴',        base:1200 }
  ];
  const pick = [];
  while(pick.length < 4 && pool.length){
    const i = Math.floor(Math.random() * pool.length);
    const it = pool.splice(i, 1)[0];
    /* 加工品和鱼：按 1.45~1.65 倍卖（他赚差价，你买不到便宜）；
       种子/肥料/鱼饵/装备：0.9~1.15 倍（这些没法直接倒卖，是给玩家的实惠） */
    const resell = (it.kind === 'craft' || it.kind === 'fish');
    const f = resell ? (1.45 + Math.random() * 0.20) : (0.90 + Math.random() * 0.25);
    it.price = Math.max(10, Math.round(it.base * f));
    it.sold = false;
    pick.push(it);
  }
  GAME.traderStock = { day: GAME.day, season: GAME.season, items: pick };
}
function traderStock(){
  if(!GAME.traderStock || GAME.traderStock.day !== GAME.day || GAME.traderStock.season !== GAME.season)
    rollTraderStock();
  return GAME.traderStock.items;
}
function placeTrader(){
  const idx = (GAME.traderSpot == null) ? 0 : GAME.traderSpot;
  const sp = TRADER_SPOTS[idx % TRADER_SPOTS.length];
  POI.trader = { x: sp.x, y: sp.y };
  if(POI_1 && POI_1 !== POI) POI_1.trader = { x: sp.x, y: sp.y };
  if(mapPage === 0) computePoiSpots();
}
function rollTraderSpot(){
  GAME.traderSpot = Math.floor(Math.random() * TRADER_SPOTS.length);
  placeTrader();
  rollTraderStock();
  const sp = TRADER_SPOTS[GAME.traderSpot];
  if(sp && !GAME._silentEnd) toast('旅行商人今天在　' + sp.name + '（地图上 ? 标记）', 3200);
}
function openTrader(){
  const items = [{ head:'旅行商人 · 今天在这儿' }];

    items.push({ key:'td' + i, mode:'buy', trader:t, name:t.name, icon:'i-coin',

                 desc: t.sold ? '卖完了' : '稀有货 · 市价约 ' + t.base });

  items.push({ info:true, name:'明天换个地方', desc:'每天在广场/石桥/沙滩路口/牧场路口轮流出现' });
  openMarket({

/* ============ 每日行情：四种货每天浮动 ============ */
const MKT_POOLS = { crops:'作物', ores:'矿石', goods:'蛋奶', fish:'鱼' };
function rollMarket(){
  const mul = {};
  for(const k in MKT_POOLS){
    let m = 0.80 + Math.random() * 0.55;        /* 0.80 ~ 1.35 */
    if(Math.random() < 0.10) m = 1.45 + Math.random() * 0.25;   /* 偶尔暴涨 */
    mul[k] = Math.round(m * 100) / 100;
  }
  GAME.mkt = { mul, day: GAME.day, season: GAME.season };
}
function mktMul(pool){
  if(!GAME.mkt || GAME.mkt.day !== GAME.day || GAME.mkt.season !== GAME.season){ rollMarket(); }
  return (GAME.mkt.mul && GAME.mkt.mul[pool]) || 1;
}
function mktTag(pool){
  const m = mktMul(pool);
  if(m >= 1.40) return ' ▲▲';
  if(m >= 1.12) return ' ▲';
  if(m <= 0.90) return ' ▼▼';
  if(m <= 0.98) return ' ▼';
  return '';
}
function mktLine(){
  return Object.keys(MKT_POOLS).map(k => {
    const d = Math.round((mktMul(k) - 1) * 100);
    if(d === 0) return MKT_POOLS[k] + ' 持平';
    return MKT_POOLS[k] + ' ' + (d > 0 ? '+' : '') + d + '%';
  }).join(' · ');
}
function isFestival(){ return GAME.day === 13; }
function festivalMul(){ return isFestival() ? 1.35 : 1; }

      items.push({ info:true, name:'✓ ' + m.name, desc:'已经捐过了' });

      items.push({ key:m.key, mode:'buy', donate:m, name:'捐出 ' + m.name, icon:'i-seed',
                   price:0, priceText:'免费', bulk:false, off: have < 1,
                   desc:'背包里有 ' + have + ' 个' });

  }
  if(done >= MUSEUM_SET.length) items.push({ info:true, name:'展柜满了', desc:'馆长送了 3000 金谢礼' });

    title:'博物馆', sub:'MUSEUM', items, rebuild:()=>openMuseum(),
    onBuy(it){
      if(!it.donate) return;
      const m = it.donate;
      const have = (GAME[m.pool] && GAME[m.pool][m.key]) || 0;
      if(have < 1){ toast('背包里没有'); return; }

      sfx.coin();
      const got = GAME.museum && MUSEUM_SET.every(x => GAME.museum[x.key]);
      if(got){ bump('museumFull'); GAME.gold = (GAME.gold||0) + 3000; addXp(120); toast('展柜集齐！馆长送你 3000 金', 3000); }
      else toast('捐出了 ' + m.name);
      rebuildMarket(); saveGame();
    }
  });
}

/* ============ 成就：100 个 ============ */
const ACH = [];
function ach(id, cat, name, desc, check, gold, xp){
  ACH.push({ id, cat, name, desc, gold: gold || 0, xp: xp || 0, check });
}
/* 成就阈值统一上调一档：所有"累计 N 次 / N 个"的 N 都过一遍 A() */
const ACH_MUL = 1.6;
const A = n => Math.round(n * ACH_MUL);
const CT = k => (GAME.ct && GAME.ct[k]) || 0;
const SEEN = (cat, key) => !!(GAME.seen && GAME.seen[cat] && GAME.seen[cat][key]);
const SEENN = cat => (GAME.seen && GAME.seen[cat]) ? Object.keys(GAME.seen[cat]).length : 0;
function bump(k, n){
  GAME.ct = GAME.ct || {};
  GAME.ct[k] = (GAME.ct[k] || 0) + (n == null ? 1 : n);
  checkAch();
}
function see(cat, key){
  GAME.seen = GAME.seen || {};
  GAME.seen[cat] = GAME.seen[cat] || {};
  GAME.seen[cat][key] = 1;
}
function bumpMax(k, v){
  GAME.ct = GAME.ct || {};
  if(v > (GAME.ct[k] || 0)){ GAME.ct[k] = v; checkAch(); }
}

function checkAch(){
  if(!GAME.ach) GAME.ach = {};
  bumpMax('maxGold', GAME.gold || 0);
  bumpMax('maxDay', (GAME.season||0) * 28 + (GAME.day||1));
  bumpMax('maxLayer', GAME.mineLayer || 1);
  for(const a of ACH){
    if(GAME.ach[a.id]) continue;
    let ok = false;
    try { ok = !!a.check(); } catch(_) { ok = false; }
    if(!ok) continue;
    GAME.ach[a.id] = 1;
    if(a.gold) GAME.gold = (GAME.gold || 0) + a.gold;
    if(a.xp) addXp(a.xp);
    toast('成就解锁 · ' + a.name + (a.gold ? '　+' + a.gold + ' 金' : ''), 2600);
    sfx.levelUp();
    saveGame();
  }
}

function openGuide(page){
  page = page || 0;
  const items = [];
  if(page === 0){
    items.push({ head:'攻略目录　（内容按当前版本数值写）' });
    GUIDE.forEach((g, i) => {
      items.push({ key:'g' + i, mode:'guide', goto:i + 1, name:(i + 1) + '. ' + g.t,
                   icon:'i-seed', priceText:'', bulk:false, desc:g.lines.length + ' 条' });
    });
  } else {
    const g = GUIDE[page - 1] || GUIDE[0];
    items.push({ head: g.t });
    for(const ln of g.lines) items.push({ info:true, name:ln, desc:'' });
    items.push({ key:'back', mode:'guide', goto:0, name:'← 返回目录', icon:'i-can',
                 priceText:'', bulk:false, desc:'' });
  }
  openMarket({ title:'攻略', sub:'GUIDE', items, rebuild:()=>openGuide(page), noMkt:true,
    onBuy(it){ if(it.goto != null) openGuide(it.goto); } });
}

  void el.offsetWidth;

function showFx(text, kind, ms){
  const el = document.getElementById('fx');

  el.className = 'on' + (kind ? ' ' + kind : '');

/* ---- 矿洞电梯 ---- */
function openElevator(){
  const maxL = Math.max(1, GAME.mineMax || 1);
  const items = [{ head:'已到过第 ' + maxL + ' 层（电梯只能停在去过的层）' }];
  for(let l = 1; l <= 8; l++){
    const ok = l <= maxL;
    items.push({ key:'el'+l, mode:'buy', elevator:l, name:'第 ' + l + ' 层 · ' + (MINE_LAYERS[l] ? MINE_LAYERS[l].name : ''),
                 icon:'i-hoe', price:0, priceText: ok ? '下去' : '没去过', bulk:false, off: !ok,
                 desc: ok ? '直接下到这层' : '先自己走到这层才行' });

  openMarket({ title:'矿洞电梯', sub:'ELEVATOR', items, rebuild:()=>openElevator(), noMkt:true,
    onBuy(it){
      if(!it.elevator) return;
      if(it.elevator > maxL){ toast('这层还没去过'); return; }

      closeMarket();
      if(scene === 'sub' && curScene && curScene.name === '矿洞'){ buildMineNodes(); spawnSlimes(); }

}

/* ---- 技能面板 ---- */
function openSkills(){
  const items = [{ head:'五项技能（星露谷同款曲线）' }];
  let total = 0;
  for(const sk of SKILLS){
    const lv = skillLv(sk.id), xp = skillXp(sk.id);
    total += lv;
    const need = lv >= 10 ? 0 : skillNeed(sk.id);
    items.push({ info:true, name: sk.name + '　Lv.' + lv,
                 desc: lv >= 10 ? '已满级' : (sk.desc + '　' + xp + '/' + need),
                 priceText: lv >= 10 ? 'MAX' : (Math.round(xp / need * 100) + '%'),
                 badge: lv >= 10 ? '满级' : '升级中', badgeOn: lv >= 10 });
    items.push({ bar: lv >= 10 ? 100 : Math.min(100, xp / need * 100), barText: lv >= 10 ? 'Lv.10' : '' });
  }
  /* 待选职业 */
  const pend = Object.keys(GAME.pendingProf || {});
  for(const key of pend){
    const sk = key.replace(/\d+$/, ''), tier = +key.replace(/\D/g, '');
    const opts = (PROFS[sk] || {})[tier];
    if(!opts) continue;
    const skn = (SKILLS.find(x => x.id === sk) || {}).name || sk;
    items.push({ head: skn + ' Lv.' + tier + '　选一个职业' });
    for(const o of opts){
      items.push({ info:true, name: o.name, desc: o.desc,
                   priceText: '', badge: '选择', badgeOn: false });
      items.push({ bar: 0, barText: '' });
    }
  }
  /* 已选职业 */
  const chosen = Object.keys(GAME.prof || {});
  if(chosen.length){
    items.push({ head:'已有职业' });
    for(const key of chosen){
      const sk = key.replace(/\d+$/, ''), tier = +key.replace(/\D/g, '');
      const o = ((PROFS[sk] || {})[tier] || []).find(x => x.id === GAME.prof[key]);
      if(o) items.push({ info:true, done:true, name: o.name, desc: o.desc, badge:'已选', badgeOn:true });
    }
  }
  items.push({ head:'合计 Lv.' + total + ' / 50　（称号：' + skillTitle(total) + '）' });
  items.push({ info:true, name:'技能效果', desc:'每级：对应工具耗能 -0.1 · 钓鱼绿条 +1.5% · 战斗每级 +5 血上限' });
  openMarket({ title:'技能', sub:'SKILLS', items, rebuild:()=>openSkills(), noMkt:true,
    onBuy(){ /* 职业选择用下面的按钮行 */ } });
  /* 把待选职业做成真正的按钮行（覆盖 info 版） */
  if(Object.keys(GAME.pendingProf || {}).length){
    const list = document.getElementById('shList');
    if(list) list.querySelectorAll('.sh-badge').forEach(bd => {
      if(bd.textContent === '选择'){
        const row = bd.closest('.sh-row');
        const nm = row.querySelector('.sh-nm');
        const label = nm ? nm.firstChild.textContent.trim() : '';
        const btn = document.createElement('button');
        btn.className = 'sh-buy';
        btn.textContent = '选它';
        btn.onclick = ()=>{
          for(const key in GAME.pendingProf){
            const sk = key.replace(/\d+$/, ''), tier = +key.replace(/\D/g, '');
            const o = ((PROFS[sk] || {})[tier] || []).find(x => x.name === label);
            if(o){ chooseProf(sk, tier, o.id); break; }
          }
          openSkills();
        };
        bd.replaceWith(btn);
      }
    });
  }
}
function skillTitle(t){
  if(t >= 25) return '农夫';
  if(t >= 20) return '小农';
  if(t >= 15) return '耕作者';
  if(t >= 10) return '农场工';
  if(t >= 5)  return '新手';
  return '外来者';
}

/* 地点 → 动作（函数都在前面定义好了，这里只做映射） */
/* 每个地点算出"最近能站的格子"，建筑里的点也能走到 */
function computePoiSpots(){
  for(const k in POI_ACT){ delete POI_ACT[k].sx; delete POI_ACT[k].sy; }
  for(const k in POI_ACT){
    const pt = POI[k];
    if(!pt) continue;
    let best = null, bd = 1e9;
    for(let rad = 8; rad <= 160; rad += 8){
      for(let a = 0; a < 360; a += 12){
        const x = pt.x + Math.cos(a * Math.PI / 180) * rad;
        const y = pt.y + Math.sin(a * Math.PI / 180) * rad;
        if(x < 40 || y < 40 || x > WW - 40 || y > WH - 40) continue;
        if(!walkable(Math.floor(x / CELL), Math.floor(y / CELL))) continue;
        const d = Math.hypot(x - pt.x, y - pt.y);
        if(d < bd){ bd = d; best = { x, y }; }
      }
      if(best) break;
    }
    POI_ACT[k].sx = best ? best.x : pt.x;
    POI_ACT[k].sy = best ? best.y : pt.y;
  }
}
