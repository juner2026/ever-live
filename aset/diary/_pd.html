/* ---------- 桌面背景 ---------- */
body{background:#e3d6c3;font-family:'Songti SC','Noto Serif SC',STSong,SimSun,serif;color:#6d5847}
#desk{position:fixed;inset:0;overflow:hidden;transition:background .45s}
#desk[data-wp="wood"]{background:
  radial-gradient(70% 55% at 50% 20%,rgba(255,252,246,.9),rgba(255,252,246,0) 62%),
  repeating-linear-gradient(90deg,rgba(160,132,104,.06) 0 1px,transparent 1px 118px),
  linear-gradient(178deg,#efe6d8 0%,#e7dbca 38%,#ddcdb8 72%,#d2bfa7 100%)}
#desk[data-wp="linen"]{background:
  radial-gradient(80% 60% at 50% 12%,rgba(255,255,255,.85),rgba(255,255,255,0) 60%),
  repeating-linear-gradient(0deg,rgba(176,160,146,.12) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(90deg,rgba(176,160,146,.12) 0 1px,transparent 1px 4px),
  linear-gradient(170deg,#f6f1e8,#e9e0d2 70%,#ded2c0)}
#desk[data-wp="window"]{background:
  radial-gradient(60% 45% at 26% 18%,rgba(255,250,235,.95),rgba(255,250,235,0) 65%),
  linear-gradient(115deg,rgba(255,248,232,.9) 0%,rgba(255,248,232,0) 55%),
  linear-gradient(160deg,#e9eef2,#dfe6ea 45%,#cfd8de 100%)}
#desk[data-wp="marble"]{background:
  radial-gradient(70% 50% at 50% 10%,rgba(255,255,255,.9),rgba(255,255,255,0) 60%),
  repeating-linear-gradient(72deg,rgba(150,150,150,.06) 0 2px,transparent 2px 42px),
  repeating-linear-gradient(-58deg,rgba(150,150,150,.05) 0 2px,transparent 2px 67px),
  linear-gradient(170deg,#f7f6f4,#eceae6 62%,#e2dfda)}
#desk[data-wp="night"]{background:
  radial-gradient(60% 45% at 50% 14%,rgba(120,140,170,.35),rgba(120,140,170,0) 62%),
  linear-gradient(170deg,#2b3442,#232b37 60%,#1b2230)}
#desk[data-wp="pink"]{background:
  repeating-linear-gradient(0deg,rgba(200,170,175,.16) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(90deg,rgba(200,170,175,.14) 0 1px,transparent 1px 26px),
  linear-gradient(170deg,#fdf6f4,#f8ebe9 60%,#f1dedd)}
#desk::after{content:'';position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(115% 95% at 50% 45%,rgba(0,0,0,0) 52%,rgba(90,70,52,.20) 100%)}
/* 桌面上的小物件：笔 / 咖啡环 / 页角阴影 */













/* ---------- 书架 ---------- */
#shelf{position:fixed;inset:0;display:flex;gap:min(5vw,70px);align-items:center;justify-content:center;
 transition:opacity .4s,transform .55s cubic-bezier(.22,.75,.36,1);z-index:5}
#shelf.hide{opacity:0;transform:scale(.88);pointer-events:none}
.bk{width:min(38vw,52vh);height:auto;height:auto;cursor:pointer;
 transition:transform .35s cubic-bezier(.22,.75,.36,1),filter .35s;
 filter:drop-shadow(0 30px 26px rgba(92,72,54,.30))}
.bk:hover{transform:translateY(-12px) scale(1.03);filter:drop-shadow(0 42px 34px rgba(92,72,54,.36))}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 24px);text-align:center;font-size:12px;letter-spacing:.26em;padding:0 130px;

/* ---------- 数据工具 ---------- */
function visibleBooks(){
  return (S.books||[]).filter(function(b){ return !b.mode || b.mode===S.mode; });
}
function bookById(id){
  var bs=S.books||[];
  for(var i=0;i<bs.length;i++) if(bs[i].id===id) return bs[i];
  return null;
}
function entriesOf(bid){
  var out=[];
  (S.entries||[]).forEach(function(e){ if(e.bookId===bid) out.push(e); });
  return out;
}
function curList(){ return entriesOf(cur.bookId); }
function curEntry(){ return curList()[cur.i]||null; }
function splitText(txt){
  var text=String(txt==null?'':txt);
  var lines=text.split('\n');
  var title='',body=text;
  if(lines.length>1 && lines[0].trim().length<=18){ title=lines[0].replace(/^#+\s*/,'').trim(); body=lines.slice(1).join('\n'); }
  else if(text.trim().length<=18){ title=text.trim(); body=''; }
  if(!title) title='日记';
  return {title:title,body:body};
}

/* ---------- 小提示 ---------- */
var _flashT=null;
function flash(msg){
  var el=$('#flash'); if(!el) return;
  el.textContent=msg; el.classList.add('on');
  clearTimeout(_flashT);
  _flashT=setTimeout(function(){ el.classList.remove('on'); },1800);
}

/* ---------- 书架 ---------- */
function syncTabs(){
  $$('#modes button').forEach(function(b){
    b.classList.toggle('on', b.dataset.m===S.mode);
  });
}
function renderShelf(){
  syncTabs();
  var host=$('#shelf'); if(!host) return;
  var list=visibleBooks();
  host.innerHTML='';
  if(!list.length){
    host.innerHTML='<div class="empty-book">这本还是空的<br><span>点下面「＋ 新建一本」开始</span></div>';
    $('#hint').textContent='';
    return;
  }
  list.forEach(function(b){
    var card=document.createElement('div');
    card.className='bkcard';
    var art=S.mode==='ai'?'book-blue.png':'book-pink.png';
    card.innerHTML='<img class="bk" src="'+art+'" alt="">'
      +'<div class="plate"><b>'+esc(b.name||'日记')+'</b><span>'+(b.cnt||0)+' 篇</span></div>';
    /* 源文件里封面在「」，打进 App 后与 book.html 同级 —— 哪个先命中就用哪个 */
    var im=card.querySelector('img');
    im.onerror=function(){
      if(im.dataset.retried) return;
      im.dataset.retried='1';
      im.src=''+art;
    };
    card.onclick=function(){ openBook(b.id); };
    host.appendChild(card);
  });
  $('#hint').textContent='轻点一本，翻开看看';
}

/* ---------- 翻开 / 合上 ---------- */
function setShelfHidden(hide){
  ['#shelf','#hint','#modes','#addBook'].forEach(function(s){
    var el=$(s); if(!el) return;
    if(hide) el.classList.add('hide'); else el.classList.remove('hide');
  });
}
function openBook(id){
  cur.bookId=id; cur.i=0;
  setShelfHidden(true);
  $('#reader').classList.add('on'); $('#bar').classList.add('on');
  var f=$('#coverFace');
  f.style.background=S.mode==='ai'
    ?'linear-gradient(150deg,#d5e1ea,#c3d3df 40%,#aec3d2 78%,#c7d7e2)'
    :'linear-gradient(150deg,#f2dcdf,#e7c8ce 40%,#d9b2b9 78%,#e3c3c9)';
  var c=$('#cover'); c.style.transition='none'; c.style.transform='rotateY(0deg)'; c.style.opacity='1';
  render();
  requestAnimationFrame(function(){
    c.style.transition='transform .9s cubic-bezier(.45,.02,.25,1)';
    c.style.transform='rotateY(-172deg)';
    setTimeout(function(){ c.style.opacity='0'; },980);
  });
}
function closeBook(){
  if(cur.busy) return;
  cur.busy=true;
  var c=$('#cover'); c.style.opacity='1';
  c.style.transition='transform .9s cubic-bezier(.45,.02,.25,1)';
  c.style.transform='rotateY(0deg)';
  setTimeout(function(){
    $('#reader').classList.remove('on'); $('#bar').classList.remove('on');
    setShelfHidden(false);
    cur.bookId=null; cur.busy=false;
    renderShelf();
  },900);
  post({t:'te:diary2:close'});
}

/* ---------- 目录 / 页 ---------- */
function renderToc(){
  var list=curList(), h='<h4>Contents</h4>';
  list.forEach(function(e,i){
    var t=splitText(e.text);
    h+='<div class="it'+(i===cur.i?' on':'')+'" data-i="'+i+'">'
      +'<span>'+esc((e.time||'').slice(5,10))+'</span><span>'+esc(t.title)+'</span></div>';
  });
  var toc=$('#toc'); if(toc) toc.innerHTML=h;
  var toc2=$('#tocList2'); if(toc2) toc2.innerHTML=h;
  $$('#toc .it, #tocList2 .it').forEach(function(n){
    n.onclick=function(){
      jumpTo(+n.dataset.i);
      $('#tocDrawer').classList.remove('on');
    };
  });
}
function pageHtml(e,total){
  if(!e) return '<div class="pno">— 完 —</div>';
  var who=S.mode==='ai'?'AI Diary':'My Diary', cls=S.mode==='ai'?' blue':'';
  var t=splitText(e.text);
  var n=(e.comments&&e.comments.length)||0;
  var cmt=n?('<span class="cmtn">♡ '+n+'</span>'):'';
  var when=String(e.time||'');
  var date=when.slice(0,10), clock=when.slice(11);
  return '<div class="who'+cls+'">'+who+'</div>'
    +'<div class="meta">'+esc(date)+(clock?('　·　'+esc(clock)):'')+'</div>'
    +'<div class="title">'+esc(t.title)+cmt+'</div>'
    +'<div class="body">'+esc(t.body)+'</div>'
    +'<div class="pno">'+(cur.i+1)+' / '+total+'</div>';
}
function render(){
  if(!cur.bookId) return;
  var list=curList();
  if(!list.length){
    $('#pgR').innerHTML='<div class="who">'+(S.mode==='ai'?'AI Diary':'My Diary')+'</div>'
      +'<div class="title">这本还是空的</div><div class="body">点下面「✎ 写」写第一篇。</div><div class="pno">— 完 —</div>';
    renderToc(); paintMeta(); return;
  }
  if(cur.i>=list.length) cur.i=list.length-1;
  if(cur.i<0) cur.i=0;
  renderToc();
  $('#pgR').innerHTML=pageHtml(list[cur.i],list.length);
  paintMeta();
}
function paintMeta(){
  var e=curEntry();
  var b=$('#bCmt');
  if(b){ var n=(e&&e.comments&&e.comments.length)||0; b.textContent='♡ 评论'+(n?(' '+n):''); }
  var d=$('#bDel'); if(d){ d.textContent='删'; d.classList.remove('danger'); }
}
function flip(dir,target){
  if(cur.busy||!cur.bookId) return;
  var list=curList();
  var ni=(target!=null)?target:cur.i+dir;
  if(ni<0||ni>=list.length||ni===cur.i) return;
  cur.busy=true;
  var host=document.createElement('div'); host.className='xfade';
  var oldP=document.createElement('div'); oldP.className='xo'; oldP.innerHTML=pageHtml(list[cur.i],list.length);
  var newP=document.createElement('div'); newP.className='xn'; newP.innerHTML=pageHtml(list[ni],list.length);
  var sweep=document.createElement('div'); sweep.className='xsweep';
  host.appendChild(oldP); host.appendChild(newP); host.appendChild(sweep);
  var half=document.querySelector('#spread .half.r');
  half.appendChild(host);
  requestAnimationFrame(function(){ host.classList.add('go'); });
  setTimeout(function(){
    host.remove(); cur.i=ni; cur.busy=false; renderToc(); paintMeta();
  },370);
}
function jumpTo(i){ if(i===cur.i) return; flip(i>cur.i?1:-1,i); }

/* ---------- 书内动作 ---------- */

var _delArm=0;
function delCur(){
  var e=curEntry();
  if(!e){ flash('这本还没有日记'); return; }
  if(!inFrame()){ flash('单独打开时不能删 · 请从 App 进日记'); return; }

    _delArm=Date.now();

/* ---------- 跳转 ---------- */
function openJump(){

/* ---------- 壁纸 ---------- */
var WALLS=[['wood','木桌'],['linen','亚麻'],['window','窗光'],['marble','大理石'],['pink','格纸'],['night','夜读'],['custom','我的图片']];
var curWp='wood';
function applyWp(k){
  curWp=k;
  var desk=document.getElementById('desk');
  desk.setAttribute('data-wp',k);
  var mine=null; try{ mine=localStorage.getItem('te_diary_bg'); }catch(e){}
  desk.style.backgroundImage=(k==='custom'&&mine)?'url('+mine+')':'';
  desk.style.backgroundSize='cover'; desk.style.backgroundPosition='center';
  try{ localStorage.setItem('te_diary_wp',k); }catch(e){}
  $$('#wallGrid .w').forEach(function(n){ n.classList.toggle('on', n.dataset.k===k); });
}
function pickWallpaper(){ var inp=$('#wpFile'); inp.value=''; inp.click(); }
function initWp(){
  try{ curWp=localStorage.getItem('te_diary_wp')||'wood'; }catch(e){ curWp='wood'; }
  var g=$('#wallGrid');
  g.innerHTML=WALLS.map(function(w){
    var kgb=w[0]==='wood'?'linear-gradient(178deg,#efe6d8,#ddcdb8)'
      :w[0]==='linen'?'repeating-linear-gradient(0deg,#f6f1e8 0 3px,#eee6d8 3px 6px)'
      :w[0]==='window'?'linear-gradient(160deg,#eef3f6,#d3dde4)'
      :w[0]==='marble'?'repeating-linear-gradient(72deg,#f7f6f4 0 6px,#eeece8 6px 12px)'
      :w[0]==='pink'?'repeating-linear-gradient(0deg,#fdf6f4 0 8px,#f7e8e6 8px 9px)'
      :'linear-gradient(170deg,#2b3442,#1b2230)';
    return '<div class="w" data-k="'+w[0]+'" style="background:'+kgb+'"><span>'+w[1]+'</span></div>';
  }).join('');
  $$('#wallGrid .w').forEach(function(n){
    n.onclick=function(){
      if(n.dataset.k==='custom'){ pickWallpaper(); return; }
      applyWp(n.dataset.k); $('#wall').classList.remove('on');
    };
  });
  applyWp(curWp);
}

/* ---------- 接收 App 快照 ---------- */
function backToShelf(){
  $('#reader').classList.remove('on'); $('#bar').classList.remove('on');
  $('#tocDrawer').classList.remove('on'); $('#cmtPanel').classList.remove('on');
  setShelfHidden(false);
  cur.bookId=null; cur.i=0;
  renderShelf();
}
function takeData(d){
  var prev=cur.count||0;
  S.mode=d.mode==='ai'?'ai':'user';
  S.modeName=d.modeName||'';
  S.books=d.books||[];
  S.entries=d.entries||[];
  S.live=true;
  cur.count=S.entries.length;
  if(cur.bookId){
    if(!bookById(cur.bookId)){ backToShelf(); return; }   /* 换模式了：那本书不在这一边 */
    var list=curList();
    if(!list.length){ backToShelf(); return; }
    if(S.entries.length>prev) cur.i=0;                     /* 刚写了一篇：翻到最新 */
    if(cur.i>=list.length) cur.i=list.length-1;
    render();
  }else{
    renderShelf();
  }
}
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.t==='te:diary2'&&d.books){ takeData(d); }
});

/* ---------- 事件绑定 ---------- */
function bind(){
  $$('#modes button').forEach(function(b){
    b.onclick=function(){
      var m=b.dataset.m==='ai'?'ai':'user';
      if(m===S.mode) return;
      if(inFrame()){ post({t:'te:diary2:mode', mode:m}); }
      else { S.mode=m; renderShelf(); }
    };
  });
  $('#addBook').onclick=openNewBook;
  $('#bPrev').onclick=function(){ flip(-1); };
  $('#bNext').onclick=function(){ flip(1); };
  $('#bJump').onclick=openJump;
  $('#bToc').onclick=function(){ renderToc(); $('#tocDrawer').classList.add('on'); };
  $('#bWrite').onclick=writeNew;
  $('#bEdit').onclick=editCur;
  $('#bDel').onclick=delCur;
  $('#bCmt').onclick=openComments;
  $('#bClose').onclick=closeBook;
  $('#hotR').onclick=function(){ flip(1); };
  $('#wpBtn').onclick=function(){ $('#wall').classList.add('on'); };
  $('#wall').onclick=function(e){ if(e.target===$('#wall')) $('#wall').classList.remove('on'); };
  $('#jump').onclick=function(e){ if(e.target===$('#jump')) $('#jump').classList.remove('on'); };
  $('#tocDrawer').onclick=function(e){ if(e.target===$('#tocDrawer')) $('#tocDrawer').classList.remove('on'); };
  $('#cmtPanel').onclick=function(e){ if(e.target===$('#cmtPanel')) $('#cmtPanel').classList.remove('on'); };
  $('#cmtSend').onclick=sendComment;
  $('#cmtInput').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); sendComment(); } });
  $('#newBookPanel').onclick=function(e){ if(e.target===$('#newBookPanel')) $('#newBookPanel').classList.remove('on'); };
  $('#nbOk').onclick=sendNewBook;
  $('#nbInput').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); sendNewBook(); } });
  document.addEventListener('change',function(e){
    if(e.target.id!=='wpFile') return;
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=1400, sc=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        var url=c.toDataURL('image/jpeg',0.82);
        try{ localStorage.setItem('te_diary_bg',url); }catch(err){ flash('图片太大，换一张小一点的'); return; }
        applyWp('custom'); $('#wall').classList.remove('on');
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  /* 键盘 ← → 翻页 */
  document.addEventListener('keydown',function(e){
    if($('#cmtPanel').classList.contains('on')) return;
    if(e.key==='ArrowLeft') flip(-1);
    if(e.key==='ArrowRight') flip(1);
    if(e.key==='Escape'){ closeBook(); }
  });
  /* 视口变化：竖屏时收起目录抽屉 */
  window.addEventListener('resize',function(){
    if(window.innerHeight<=window.innerWidth) $('#tocDrawer').classList.remove('on');
  });
}

/* ---------- 启动 ---------- */
(function boot(){
  initWp();
  bind();
  if(inFrame()){
    S.books=[]; S.entries=[];
    post({t:'te:diary2:req'});

  }else{
    S.books=demoBooks(); S.entries=demoEntries(); S.mode='user';
  }
  renderShelf();
})();
