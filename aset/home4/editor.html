<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>摆家具 · 蓝色客厅</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#efe7db;
    font:14px/1.4 ui-sans-serif,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;
    -webkit-user-select:none;user-select:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .bar{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;pointer-events:none}
  .bar>*{pointer-events:auto}
  #top{top:0;justify-content:flex-end}
  #top .pill{max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
  #top .pill::-webkit-scrollbar{display:none}
  #bottom{bottom:0;flex-direction:column;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}

  .pill{display:flex;align-items:center;background:rgba(252,247,238,.93);backdrop-filter:blur(8px);
    border:1px solid rgba(196,176,152,.45);border-radius:18px;padding:5px;gap:3px;
    box-shadow:0 6px 16px rgba(96,74,56,.14)}
  .pill button{font:inherit;font-size:13px;color:#6d5847;background:transparent;border:0;
    border-radius:13px;padding:8px 12px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
  .pill button.on{background:var(--te-accent,#8fb0c9);color:#fdfaf4;font-weight:600;
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
  .pill button.boy{background:#6f93ae;color:#fdfaf4;font-weight:600}
  .pill button.spdb{padding:8px 9px;font-variant-numeric:tabular-nums;color:#8a7462}
  body:not(.play) #spd,body:not(.play) #spdDown,body:not(.play) #spdUp{display:none}
  .pill button:active{transform:scale(.95)}

  #tray{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:2px}
  #tray::-webkit-scrollbar{display:none}
  #tray .it{flex:0 0 auto;width:76px;height:78px;border-radius:16px;
    background:rgba(252,247,238,.95);border:1px solid rgba(196,176,152,.45);
    display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;
    box-shadow:0 4px 10px rgba(96,74,56,.12)}
  #tray .it:active{transform:scale(.94)}
  #tray .it img{max-width:64px;max-height:60px;pointer-events:none;margin-bottom:12px}
  #tray .it span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;
    color:#8a7462;letter-spacing:.02em}

  #tools{position:fixed;z-index:7;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 118px);
    display:none;background:rgba(252,247,238,.95);backdrop-filter:blur(8px);
    border:1px solid rgba(196,176,152,.5);border-radius:18px;padding:5px;gap:3px;
    box-shadow:0 8px 20px rgba(96,74,56,.16)}
  #tools.on{display:flex}
  #tools button{font:inherit;font-size:12.5px;color:#6d5847;background:transparent;border:0;
    border-radius:12px;padding:9px 10px;cursor:pointer}
  #tools button:active{background:rgba(143,176,201,.20)}

  #loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;
    color:#6d5847;background:#efe7db;font-size:13px;letter-spacing:.08em}
  #loading.off{display:none}
body.play #tray,body.play #tools{display:none}
  body.play #hint{color:rgba(220,238,250,.9)}

/* ==========================================================================
   2026-11-01 界面精修（只动"看"的部分：纸感、层次、字距、光影）
   —— 颜色一律沿用原来的 --sheet/#fcf7ee/#6d5847 体系，不新增色相
   ========================================================================== */
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{background:#efe7db}

  /* 顶栏 / 底栏那排胶囊：分层更轻，边缘更软 */
  .pill{
    background:linear-gradient(180deg,rgba(255,253,248,.97) 0%,rgba(250,243,234,.94) 100%);
    border:1px solid rgba(196,176,152,.38);
    border-radius:17px;padding:4px;gap:2px;
    box-shadow:
      0 10px 26px -14px rgba(96,74,56,.42),
      0 2px 6px -4px rgba(96,74,56,.18),
      inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(10px) saturate(1.05);
    -webkit-backdrop-filter:blur(10px) saturate(1.05);
  }
  .pill button{
    font-size:12.5px;letter-spacing:.04em;color:#6d5847;
    border-radius:13px;padding:8px 12px;
    transition:background 160ms ease,color 160ms ease,transform 120ms ease,box-shadow 160ms ease;
  }
  .pill button:hover{background:rgba(196,176,152,.14)}
  .pill button:active{transform:scale(.96);background:rgba(196,176,152,.2)}
  .pill button.on{
    background:var(--te-accent,#8fb0c9);   /* 老内核不认 color-mix 时的兜底 */
    background:linear-gradient(180deg,color-mix(in srgb,var(--te-accent,#8fb0c9) 92%,#fff 8%),var(--te-accent,#8fb0c9));
    color:#fffdf8;font-weight:600;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -1px 0 rgba(0,0,0,.08),
      0 4px 10px -6px rgba(96,74,56,.5);
  }
  .pill button.boy{
    background:#6f93ae;
    background:linear-gradient(180deg,#7c9cb5,#6f93ae);color:#fffdf8;font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px -6px rgba(96,74,56,.5);
  }
  .pill button.spdb{color:#8a7462;font-variant-numeric:tabular-nums}

  /* 底部家具托盘：卡片更"纸"，图有投影，字更轻 */
  #tray{gap:9px;padding:3px 2px 4px}
  #tray .it{
    width:74px;height:76px;border-radius:15px;
    background:linear-gradient(180deg,#fffdf9 0%,#f9f2e8 100%);
    border:1px solid rgba(196,176,152,.42);
    box-shadow:
      0 8px 18px -12px rgba(96,74,56,.5),
      inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform 140ms ease,box-shadow 160ms ease,border-color 160ms ease;
  }
  #tray .it:hover{
    transform:translateY(-2px);
    border-color:rgba(196,176,152,.6);
    box-shadow:0 12px 22px -14px rgba(96,74,56,.55),inset 0 1px 0 rgba(255,255,255,.95);
  }
  #tray .it:active{transform:translateY(0) scale(.95)}
  #tray .it img{max-width:62px;max-height:58px;filter:drop-shadow(0 2px 3px rgba(96,74,56,.18))}
  #tray .it span{font-size:9.5px;letter-spacing:.06em;color:#8a7462}

  /* 选中家具时那排小工具（镜像/旋转/放大…）抬高一点，边缘更软 */
  #tools{

/* 勾线道具：投影 + 淡填充 + 线稿 */
function drawLineItem(d, cx, fy, it){
  var w = d.w, h = d.h;
  /* 贴地投影 */
  ctx.save();
  ctx.translate(cx, fy + 1);
  ctx.scale(1, 0.20);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(6, w * 0.50));
  g.addColorStop(0, 'rgba(48,38,32,0.26)');
  g.addColorStop(1, 'rgba(48,38,32,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, Math.max(6, w * 0.50), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  /* 本体 */
  ctx.save();
  ctx.translate(cx, fy - h);
  if (effRot(it)) ctx.rotate(effRot(it) * Math.PI / 180);
  if (effFlip(it)) ctx.scale(-1, 1);
  ctx.scale(w / 100, h / 100);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#6d5847';          /* 与房间文字同色 */
  ctx.lineWidth = 3.4;
  ctx.fillStyle = d.fill || '#f6efe6';
  ctx.shadowColor = 'rgba(96,74,56,0.18)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetY = 2;
  var fn = LINE_ICONS[d.line];
  if (fn) fn(ctx);
  ctx.restore();
}

var _lineThumbs = {};
function lineThumb(it){
  if (_lineThumbs[it.key]) return _lineThumbs[it.key];
  var cv2 = document.createElement('canvas');
  cv2.width = 120; cv2.height = 120;
  var x = cv2.getContext('2d');
  x.translate(10, 10);
  x.lineJoin = 'round'; x.lineCap = 'round';
  x.strokeStyle = '#6d5847'; x.lineWidth = 3.6;
  x.fillStyle = it.fill || '#f6efe6';
  var fn = LINE_ICONS[it.line];
  if (fn) fn(x);
  var u = cv2.toDataURL('image/png');
  _lineThumbs[it.key] = u;
  return u;
}

    if (!it.uid) it.uid = newUid();
    if (isPpl(it.key) && it.scSit == null) it.scSit = it.sc;
    if (it.key === 'rug'){                 /* 圆形地毯：永远保持正圆投影，不斜不转 */
      it.lean = 0; it.rot = 0; it.taper = 1;
      if (it.w > 0.33) it.w = 0.26;
      it.d = it.w * 1.284;
    }
  });
    migrateSeats();
    document.getElementById('btnDepth').classList.toggle('on', state.depth);
    document.getElementById('loading').classList.add('off');
    syncWho(); syncSpeed(); syncEnv(); syncFit();
    applyMode();
    resize(); refreshSeatZ(); render();
    requestAnimationFrame(loop);
  });
}
/* 老存档迁移：圆地毯换成按 40° 俯角算的椭圆比例，并清掉老的斜度/旋转 */
function migrateV4(){
  state.items.forEach(function(it){
    if (it.key !== 'rug') return;
    it.lean = 0; it.rot = 0; it.taper = 1;
    if (!it.d) it.d = it.w * 1.284;
    /* 老版本的 d/w 比例不对（太扁），按圆重新算 */
    if (it.d < it.w * 1.0) it.d = it.w * 1.284;
    if (it.w > 0.33){ it.w = 0.26; it.d = 0.334; }
  });
}

/* 旧的 girlsit/boysit 记忆搬过来 */
function migrateSeats(){
  if (state.seatMem.girlsit){ state.seatMem.girl = state.seatMem.girlsit; delete state.seatMem.girlsit; }
  if (state.seatMem.boysit){ state.seatMem.boy = state.seatMem.boysit; delete state.seatMem.boysit; }
}

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  view.dpr = dpr;
  cv.width  = Math.round(cv.clientWidth  * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  var cw = cv.clientWidth, ch = cv.clientHeight;
  var s;
  if (state.fit === 'contain'){
    var top = 92, bottom = 100;
    var availH = Math.max(120, ch - top - bottom);
    s = Math.min(cw / W, availH / H);
    view.ox = (cw - W * s) / 2;
    view.oy = top + (availH - H * s) / 2;
  } else {
    /* 铺满：整屏都是房间，多出来的部分裁掉（手机上几乎看不出来） */
    s = Math.max(cw / W, ch / H);
    view.ox = (cw - W * s) / 2;
    view.oy = (ch - H * s) / 2;
  }
  view.s = s;
}
window.addEventListener('resize', function(){ resize(); render(); });

function toCanvas(px, py){ return {x:(px - view.ox)/view.s, y:(py - view.oy)/view.s}; }
function effRot(it){ return (it.pose === 'sit' && it.rotSit) ? it.rotSit : (it.rot || 0); }
function effFlip(it){ return (it.pose === 'sit' && it.flipSit != null) ? it.flipSit : (it.flip || 0); }
function scaleOf(it){
  return (it.pose === 'sit' && it.scSit) ? it.scSit : it.sc;
}
function itemW(it){
  /* ★ 从背包拿出来的道具没有 y0（只有 y），以前 mScale(undefined)=NaN → 尺寸 NaN →
     整件东西画不出来。这里缺省用 y 当基准。 */
  var y0 = (it.y0 == null ? it.y : it.y0);
  var k = state.depth ? mScale(it.y)/mScale(y0) : 1;
  return it.w * scaleOf(it) * k * W;
}
function dims(it){
  var c = catOf(it.key);
  if (c && c.line){
    var wl = itemW(it), hl = wl * 1.15;
    return {line:c.line, fill:c.fill, im:null, nf:1, fw:1, w:wl, h:hl};
  }
  if (c && c.emoji){
    var w0 = itemW(it), h0 = w0 * 1.05;
    return {emoji:c.emoji, im:null, nf:1, fw:1, w:w0, h:h0};
  }
  var im = imgOf(it); if (!im) return null;
  var nf = framesOf(it), fw = im.width / nf;
  var w = itemW(it), h = w * im.height / fw;
  return {im:im, nf:nf, fw:fw, w:w, h:h};
}

/* 逐像素 alpha 命中：透明的地方不挡点击 */
var masks = {};
function maskOf(src){
  if (masks[src] !== undefined) return masks[src];
  var im = imgs[src];
  if (!im){ masks[src] = null; return null; }
  var w = Math.max(1, Math.round(im.width/4)), h = Math.max(1, Math.round(im.height/4));
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d');
  try { x.drawImage(im, 0, 0, w, h); } catch(e){ masks[src] = null; return null; }
  var d;
  try { d = x.getImageData(0, 0, w, h).data; } catch(e){ masks[src] = null; return null; }
  masks[src] = {w:w, h:h, d:d};
  return masks[src];
}
function alphaAt(u, v, src){
  var m = maskOf(src); if (!m) return 255;
  var x = Math.min(m.w-1, Math.max(0, Math.round(u*m.w)));
  var y = Math.min(m.h-1, Math.max(0, Math.round(v*m.h)));
  return m.d[(y*m.w + x)*4 + 3];
}

/* 墙面与地面的交界高度（房间底图标定） */
function wallBaseAt(x){
  return (x <= 0.318) ? (0.418 - 0.06 * x) : (0.398 + 0.669 * (x - 0.318));
}

function depthOf(it){
  var k = state.depth ? mScale(it.y)/mScale(it.y0) : 1;
  return it.d * (it.sc || 1) * k;
}
function flatQuad(it){
  var cx = it.x * W, near = it.y * H;
  var farMin = wallBaseAt(it.x) * H + 6;
  var far = Math.max(farMin, near - depthOf(it) * H);
  var hw = itemW(it) / 2;
  var tap = (it.taper != null) ? it.taper : 1;
  var fw = hw * tap * (mScale(far/H) / mScale(near/H));
  return { tl:{x:cx-fw, y:far}, tr:{x:cx+fw, y:far},
           br:{x:cx+hw, y:near}, bl:{x:cx-hw, y:near} };
}

function render(){
  if (!base) return;
  var dpr = view.dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.scale(dpr,dpr);
  ctx.fillStyle = '#efe7db'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);
  /* ★ 停电时：整个底图换成"夜景版"（窗玻璃是夜空），按剩余时间淡入淡出 */
  var _ev = state.ev, _nB = imgs[BASE_NIGHT];
  var _faEv = 0;
  if (_ev && _ev.kind === 'blackout'){
    var _rest = Math.max(0, _ev.endAt - Date.now());
    _faEv = _rest < 1600 ? (_rest / 1600) : 1;
  } else {
    /* 按真实时间入夜：20:00~22:00 渐入，22:00~05:00 全夜景，05:00~07:00 渐出 */
    var _h = state.time;
    if (_h >= 20 && _h < 22) _faEv = (_h - 20) / 2;
    else if (_h >= 22 || _h < 5) _faEv = 1;
    else if (_h >= 5 && _h < 7) _faEv = 1 - (_h - 5) / 2;
  }
  if (!_nB) _faEv = 0;
  ctx.drawImage(base, 0, 0, W, H);
  if (_faEv > 0.01){
    try{
      ctx.save(); ctx.globalAlpha = _faEv;
      ctx.drawImage(_nB, 0, 0, W, H);
      ctx.restore();
    }catch(e){}
  }

  var flats = [], solids = [];
  state.items.forEach(function(it){
    (isFlat(it.key) ? flats : solids).push(it);
  });
  function zk(it){ return (it.z != null) ? it.z : it.y; }
  flats.sort(function(a,b){ return zk(a) - zk(b); });
  solids.sort(function(a,b){ return zk(a) - zk(b); });
  flats.forEach(drawFlat);
  solids.forEach(drawItem);
  ctx.restore();
  drawEnv();
  try{ drawBlackout(); }catch(e){}
  drawSel();
}

/* ---------------- 昼夜 / 天气 ---------------- */
function mix(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c, a){ return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + (a==null?1:a) + ')'; }

var LIGHT_KEYS = [
  { h: 0.0, mult:[ 84, 98,150], warm:[  6,  8, 22], a:0.05 },
  { h: 5.5, mult:[ 84, 98,150], warm:[  6,  8, 22], a:0.05 },
  { h: 7.0, mult:[255,203,168], warm:[ 70, 30,  0], a:0.16 },
  { h: 11.0,mult:[255,250,242], warm:[  0,  0,  0], a:0.00 },
  { h: 16.0,mult:[255,243,226], warm:[ 26, 12,  0], a:0.05 },
  { h: 18.5,mult:[255,224,202], warm:[ 64, 26,  0], a:0.10 },
  { h: 20.5,mult:[118,128,172], warm:[ 16, 14, 26], a:0.05 },
  { h: 24.0,mult:[ 84, 98,150], warm:[  6,  8, 22], a:0.05 }
];
function lightNow(){
  var h = state.time, k = LIGHT_KEYS;
  for (var i=0;i<k.length-1;i++){
    if (h >= k[i].h && h <= k[i+1].h){
      var t = (h - k[i].h) / ((k[i+1].h - k[i].h) || 1);
      return { mult: mix(k[i].mult, k[i+1].mult, t),
               warm: mix(k[i].warm, k[i+1].warm, t),
               a: k[i].a + (k[i+1].a - k[i].a) * t };
    }
  }
  return { mult: k[2].mult, warm:[0,0,0], a:0 };
}

function drawEnv(){
  var L = lightNow();
  var rain = (state.weather === 'rain');
  ctx.save();
  ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);

  /* 1) 整体色调（正片叠底） */
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = rgb(L.mult, 1);
  ctx.fillRect(0, 0, W, H);
  if (rain){
    ctx.fillStyle = 'rgba(156,172,192,0.62)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  /* 2) 暖光（叠加） */
  if (L.a > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgb(L.warm, L.a);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* 3) 窗光斑：晴天白天才有 */
  var dayness = Math.max(0, 1 - Math.abs(state.time - 12.5) / 5.5);
  if (!rain && dayness > 0.02){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(W * 0.58, H * 0.74);
    ctx.rotate(-0.10);
    ctx.scale(1, 0.42);
    var g = ctx.createRadialGradient(0,0,0, 0,0, W*0.22);
    g.addColorStop(0, 'rgba(255,238,196,' + (0.20*dayness).toFixed(3) + ')');
    g.addColorStop(0.6,'rgba(255,238,196,' + (0.08*dayness).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,238,196,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,W*0.22,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* 4) 夜里：落地灯亮起来 */
  var night = (state.time >= 19.5 || state.time < 6.5) ? 1 : 0;
  if (night){
    var lamp = null;
    state.items.forEach(function(it){ if (it.key === 'lamp') lamp = it; });
    if (lamp){
      var dd = dims(lamp); if (dd){
        var lx = lamp.x * W, ly = lamp.y * H - dd.h * 0.62;
        if (!isFinite(lx) || !isFinite(ly) || !isFinite(dd.h)) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var g2 = ctx.createRadialGradient(lx, ly, 6, lx, ly, W * 0.20);
        g2.addColorStop(0, 'rgba(255,206,138,0.55)');
        g2.addColorStop(0.45,'rgba(255,186,110,0.20)');
        g2.addColorStop(1, 'rgba(255,180,100,0)');
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(lx, ly, W*0.20, 0, Math.PI*2); ctx.fill();
        /* 地上的一圈光 */
        ctx.translate(lx, lamp.y * H);
        ctx.scale(1, 0.34);
        if (!isFinite(W)) return;
        var g3 = ctx.createRadialGradient(0,0,4, 0,0, W*0.13);
        g3.addColorStop(0,'rgba(255,198,130,0.30)');
        g3.addColorStop(1,'rgba(255,190,120,0)');
        ctx.fillStyle = g3;
        ctx.beginPath(); ctx.arc(0,0,W*0.13,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  }

  /* 5) 雨：三层不同速度/长度 + 地面涟漪 */
  if (rain){
    var tt = performance.now() / 1000;
    var layers = [
      { n: 150, len: 14, wid: 1.4, sp: 0.55, al: 0.17, dx: -0.16 },
      { n: 96,  len: 27, wid: 2.2, sp: 0.95, al: 0.23, dx: -0.22 },
      { n: 54,  len: 48, wid: 3.4, sp: 1.50, al: 0.30, dx: -0.30 }
    ];
    ctx.save();
    ctx.lineCap = 'round';
    for (var L = 0; L < layers.length; L++){
      var ly = layers[L];
      ctx.strokeStyle = 'rgba(226,240,252,' + ly.al + ')';
      ctx.lineWidth = ly.wid;
      ctx.beginPath();
      for (var i = 0; i < ly.n; i++){
        var sd = (i * 7919 + L * 104729) % 1000 / 1000;
        var sd2 = (i * 6271 + L * 383) % 1000 / 1000;
        var x = sd * W * 1.2 - W * 0.1;
        var prog = ((tt * ly.sp * 0.45) + sd2) % 1;
        var y = prog * (H * 1.15) - H * 0.1;
        ctx.moveTo(x, y);
        ctx.lineTo(x + ly.dx * ly.len, y + ly.len);
      }
      ctx.stroke();
    }
    /* 地面涟漪：几圈慢慢扩散的椭圆 */
    for (var k = 0; k < 18; k++){
      var s1 = (k * 3571) % 1000 / 1000;
      var s2 = (k * 811) % 1000 / 1000;
      var ph = ((tt * 0.55) + s2) % 1;
      var rx = 0.012 + ph * 0.05;
      var cx2 = s1 * W * 0.95 + W * 0.02;
      var cy2 = (H * 0.62) + (((k * 613) % 1000) / 1000) * H * 0.32;
      ctx.beginPath();
      ctx.ellipse(cx2, cy2, rx * W, rx * W * 0.34, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(220,236,250,' + (0.16 * (1 - ph)).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    /* 湿地面：底部一层冷色渐变，越靠下越湿 */
    var wg = ctx.createLinearGradient(0, H * 0.45, 0, H);
    wg.addColorStop(0, 'rgba(150,168,190,0)');
    wg.addColorStop(1, 'rgba(150,168,190,0.18)');
    ctx.fillStyle = wg;
    ctx.fillRect(0, H * 0.45, W, H * 0.55);
    ctx.restore();
  }

  ctx.restore();
}

function lerp2(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
function drawQuad(im, q, n){
  n = n || 28;
  var sw = im.width, sh = im.height;
  for (var i = 0; i < n; i++){
    var t0 = i/n, t1 = (i+1)/n;
    var p0 = lerp2(q.tl, q.bl, t0), p1 = lerp2(q.tr, q.br, t0);
    var p2 = lerp2(q.tl, q.bl, t1);
    var sy0 = t0*sh, sy1 = t1*sh, dh = (sy1 - sy0) + 1;
    var a = (p1.x-p0.x)/sw, b = (p1.y-p0.y)/sw;
    var c = (p2.x-p0.x)/dh, d = (p2.y-p0.y)/dh;
    var e = p0.x - c*sy0, f = p0.y - d*sy0;
    ctx.save();
    ctx.transform(a,b,c,d,e,f);
    ctx.drawImage(im, 0, sy0, sw, dh, 0, sy0, sw, dh);
    ctx.restore();
  }
}
function drawFlat(it){
  var im = imgs[catOf(it.key).src]; if (!im) return;
  var q = flatQuad(it);
  if (it.flip){ var t = q.tl; q.tl = q.tr; q.tr = t; t = q.bl; q.bl = q.br; q.br = t; }
  /* 平行四边形（taper=1 且不斜不转）→ 一次仿射，边缘平滑 */
  var par = (Math.abs((q.tr.x-q.tl.x) - (q.br.x-q.bl.x)) < 0.5) &&
            (Math.abs((q.bl.y-q.tl.y) - (q.br.y-q.tr.y)) < 0.5);
  if (par){
    var iw = im.width, ih = im.height;
    var a = (q.tr.x - q.tl.x)/iw, b = (q.tr.y - q.tl.y)/iw;
    var c = (q.bl.x - q.tl.x)/ih, d = (q.bl.y - q.tl.y)/ih;
    ctx.save();
    ctx.transform(a, b, c, d, q.tl.x, q.tl.y);
    ctx.drawImage(im, 0, 0);
    ctx.restore();
  } else {
    drawQuad(im, q);
  }
}

/* 影子：直接拿素材的剪影压扁+斜切到地上（形状跟着家具走），再叠一圈接触影 */
var shCache = {};
function shadowOf(src){
  if (shCache[src] !== undefined) return shCache[src];
  var im = imgs[src];
  if (!im){ shCache[src] = null; return null; }
  var c = document.createElement('canvas');
  c.width = im.width; c.height = im.height;
  var x = c.getContext('2d');
  try {
    x.filter = 'blur(' + Math.max(3, Math.round(im.width / 45)) + 'px)';
    x.drawImage(im, 0, 0);
    x.filter = 'none';
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = 'rgba(58,44,38,1)';
    x.fillRect(0, 0, c.width, c.height);
  } catch(e){ shCache[src] = null; return null; }
  shCache[src] = c;
  return c;
}

function drawShadow(d, cx, fy, it, isPerson){
  var sh = shadowOf(spriteOf(it));
  if (!sh) return;
  var w = d.w, h = d.h || 0;
  ctx.save();
  ctx.globalAlpha = isPerson ? 0.13 : 0.15;
  ctx.translate(cx - w * 0.03, fy + 1);
  /* 光从右上：影子向左下压扁、斜切 */
  ctx.transform(1, 0, 0.20, -0.16, 0, 0);
  ctx.drawImage(sh, -w/2, -h, w, h);
  ctx.restore();

  /* 接触影：脚下一小圈，负责"压在地上" */
  if (!isFinite(w) || w <= 0 || !isFinite(h) || h <= 0) return;
  ctx.save();
  ctx.translate(cx, fy + 1);
  ctx.scale(1, 0.15);
  var g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.34);
  g2.addColorStop(0, 'rgba(48,38,32,0.30)');
  g2.addColorStop(1, 'rgba(48,38,32,0)');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(0, 0, w * 0.34, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawItem(it){
  var d = dims(it); if (!d) return;
  var cx = it.x * W, fy = it.y * H;
  if (it.lit){                                   /* 点亮的蜡烛/灯：一圈暖光 */
    var gr = ctx.createRadialGradient(cx, fy - d.h*0.55, 0, cx, fy - d.h*0.55, d.h*1.7);
    gr.addColorStop(0, 'rgba(255,220,158,.38)');
    gr.addColorStop(0.55, 'rgba(255,204,130,.12)');
    gr.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(cx, fy - d.h*0.55, d.h*1.7, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  if (d.line){ drawLineItem(d, cx, fy, it); return; }
  if (d.emoji){
    drawShadow(d, cx, fy, it);
    ctx.save();
    ctx.translate(cx, fy);
    if (effFlip(it)) ctx.scale(-1,1);
    ctx.font = Math.round(d.h*0.92) + 'px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(d.emoji, 0, 0);
    ctx.restore();
    return;
  }
  if (!isPpl(it.key)) drawShadow(d, cx, fy, it);
  else if (it.pose !== 'sit') drawShadow(d, cx, fy, it, true);
  ctx.save();
  ctx.translate(cx, fy);
  if (effRot(it)) ctx.rotate(effRot(it) * Math.PI / 180);
  ctx.scale(effFlip(it) ? -1 : 1, 1);
  if (d.nf > 1){
    var f = Math.floor(walkT) % d.nf;
    ctx.drawImage(d.im, f*d.fw, 0, d.fw, d.im.height, -d.w/2, -d.h, d.w, d.h);
  } else {
    ctx.drawImage(d.im, -d.w/2, -d.h, d.w, d.h);
  }
  ctx.restore();
}

function drawSel(){
  if (state.mode !== 'edit' || sel < 0 || !state.items[sel]) return;
  var it = state.items[sel];
  ctx.save();
  ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);
  ctx.strokeStyle = 'rgba(120,200,255,.95)';
  ctx.lineWidth = 3 / view.s;
  ctx.setLineDash([10/view.s, 7/view.s]);
  if (isFlat(it.key)){
    var q = flatQuad(it);
    ctx.beginPath();
    ctx.moveTo(q.tl.x,q.tl.y); ctx.lineTo(q.tr.x,q.tr.y);
    ctx.lineTo(q.br.x,q.br.y); ctx.lineTo(q.bl.x,q.bl.y);
    ctx.closePath(); ctx.stroke();
  } else {
    var d = dims(it); if (!d){ ctx.restore(); return; }
    ctx.translate(it.x*W, it.y*H);
    if (effRot(it)) ctx.rotate(effRot(it)*Math.PI/180);
    ctx.strokeRect(-d.w/2 - 4, -d.h - 4, d.w + 8, d.h + 8);
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(0, 0, 5/view.s, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(120,200,255,.95)'; ctx.fill();
  }
  ctx.restore();
}

function hit(px, py, onlyFurn){
  var best = -1, bestZ = -1e9;
  for (var i = 0; i < state.items.length; i++){
    var it = state.items[i];
    if (onlyFurn && isPpl(it.key)) continue;
    var d = dims(it); if (!d) continue;
    var z = (it.z != null) ? it.z : it.y;
    if (isFlat(it.key)){
      var q = flatQuad(it);
      if (px >= q.bl.x && px <= q.br.x && py <= q.br.y && py >= q.tl.y){
        if (z > bestZ){ bestZ = z; best = i; }
      }
      continue;
    }
    var cx = it.x*W, fy = it.y*H;
    if (px < cx - d.w/2 || px > cx + d.w/2 || py < fy - d.h || py > fy + 8) continue;
    var f = d.nf > 1 ? (Math.floor(walkT) % d.nf) : 0;
    var u = (px - (cx - d.w/2)) / d.w;
    var v = (py - (fy - d.h)) / d.h;
    if (effFlip(it)) u = 1 - u;
    var cf = catOf(it.key);
    if (!(cf && cf.seatable)){          /* 沙发/椅子按整块算，点座面下面也能选中 */
      var a = alphaAt((f + Math.min(0.999, Math.max(0, u))) / d.nf, Math.min(0.999, Math.max(0, v)), spriteOf(it));
      if (a < 24) continue;
    }
    if (z > bestZ){ bestZ = z; best = i; }
  }
  return best;
}

/* ---------- 交互 ---------- */
var down = null;
cv.addEventListener('pointerdown', function(e){
  cv.setPointerCapture(e.pointerId);
  var p = toCanvas(e.clientX, e.clientY);

  var i = hit(p.x, p.y);

    var it = state.items[i];

});
cv.addEventListener('pointermove', function(e){

  var p = toCanvas(e.clientX, e.clientY);

  var nx = Math.max(0.02, Math.min(0.98, p.x/W + down.dx));

  var ddx = nx - it.x, ddy = ny - it.y;

});
cv.addEventListener('pointerup', function(){

function autoRememberSeat(){
  var it = state.items[sel]; if (!it) return;
  if (!isPpl(it.key) || it.pose !== 'sit') return;
  var byUid = null;
  if (it.seatUid) byUid = state.items.filter(function(o){ return o.uid === it.seatUid; })[0] || null;
  var f = byUid || furnitureUnder(it);
  if (!f) return;
  var sp = seatPosOf(f, it);
  var memAll = state.seatMem[it.key] || (state.seatMem[it.key] = {});
  memAll[f.uid] = { onKey: f.key,
                    dx: +(it.x - sp.x).toFixed(4), dy: +(it.y - sp.y).toFixed(4),
                    scSit: (it.scSit || it.sc), z: +(it.z - f.y).toFixed(4),
                    flip: effFlip(it), rot: effRot(it) };

}
cv.addEventListener('pointercancel', function(){ down = null; });

function followChildren(furn, dx, dy){
  state.items.forEach(function(c){
    if (c.seatUid === furn.uid){ c.x += dx; c.y += dy; if (c.z != null) c.z += dy; }
  });
}

/* ---------- 游玩模式：点哪走哪 / 点沙发坐下 ---------- */
/* 家具占地（椭圆的脚底投影），人物不能走进去 */
function footprint(f){
  var d = dims(f); if (!d) return null;
  var rx = d.w * 0.42, ry = Math.max(10, d.w * 0.17);
  return { cx: f.x, cy: f.y - ry / H / 2 * H / H - ry / H, rx: rx / W, ry: ry / H };
}
function insideFoot(f, x, y){
  var fp = footprint(f); if (!fp) return false;
  var dx = (x - fp.cx) / (fp.rx * 1.05), dy = (y - (f.y - fp.ry * 0.5)) / (fp.ry * 1.05);
  return dx*dx + dy*dy < 1;
}
/* 落进家具占地里时，统一推到"家具前面"（朝向镜头那侧），人不会跑到后面去 */
function pushOut(f, x, y){
  var fp = footprint(f); if (!fp) return {x:x, y:y};
  return { x: Math.max(f.x - fp.rx * 0.9, Math.min(f.x + fp.rx * 0.9, x)),
           y: f.y + fp.ry * 1.15 };
}
/* 移动时的碰撞：落进家具占地就沿边界推开，人就会"贴着家具绕过去" */
function slideOut(x, y){
  for (var pass = 0; pass < 2; pass++){
    var hit = false;
    for (var i = 0; i < state.items.length; i++){
      var f = state.items[i];
      var cf = catOf(f.key);
      if (!cf || cf.flat || isPpl(f.key)) continue;
      var fp = footprint(f); if (!fp) continue;
      var cy = f.y - fp.ry * 0.5;
      var dx = (x - fp.cx) / fp.rx, dy = (y - cy) / fp.ry;
      var v = dx*dx + dy*dy;
      if (v < 1.0){
        if (v < 1e-6){ dx = 0; dy = 1; v = 1; }
        var k = 1.03 / Math.sqrt(v);
        x = fp.cx + dx * fp.rx * k;
        y = cy + dy * fp.ry * k;
        hit = true;
      }
    }
    if (!hit) break;
  }
  return { x: x, y: y };
}

function resolveWalkTarget(x, y){
  for (var n = 0; n < 3; n++){
    var moved = false;
    for (var i = 0; i < state.items.length; i++){
      var f = state.items[i];
      var cf = catOf(f.key);
      if (!cf || cf.flat || isPpl(f.key)) continue;
      if (insideFoot(f, x, y)){ var q = pushOut(f, x, y); x = q.x; y = q.y; moved = true; }
    }
    if (!moved) break;
  }
  return { x: Math.max(0.03, Math.min(0.97, x)), y: y };
}

function clickPlay(p){
  var fx = p.x / W, fy = p.y / H;
  var i = hit(p.x, p.y, true);
  var furn = (i >= 0) ? state.items[i] : null;
  var who = activePpl() || nearestPpl(p.x / W, p.y / H);
  if (!who) return;

  /* ★ 药物：吃了就好；花朵：插花加心情 */
  if (furn && MED_USE[furn.key]){ useMed(furn); return; }
  if (furn && FLOWER_USE[furn.key]){ useFlower(furn); return; }

  /* ★ 怪东西：点它触发各自的用处 */
  if (furn && ODD_CD[furn.key]){ useOdd(furn); return; }

  /* ★ 数值相关：点食物 → 吃掉；点蜡烛/灯 → 点亮/吹灭 */
  if (furn && FOOD_KEYS[furn.key]){ eatFood(furn); return; }
  if (furn && LIGHT_KEYS2[furn.key]){ toggleLight(furn); return; }

  /* 点矮边柜：先走到柜子前，站定了再开小铺 */
  if (furn && furn.key === 'sideboard'){
    var sb = furn;
    who.pose = 'walk';
    var dx0 = (who.x < sb.x ? -1 : 1) * 0.10;
    beginMove(who, Math.max(0.06, Math.min(0.94, sb.x + dx0)), Math.min(0.95, sb.y + 0.10), function(){
      who.pose = 'idle'; render(); openShop();
    });
    render();
    return;
  }

  if (furn && catOf(furn.key) && catOf(furn.key).seatable){
    var memAll = state.seatMem[who.key] || (state.seatMem[who.key] = {});
    /* 只认「这一张家具」的记忆 —— 不再按类型兜底，否则两张同款沙发会互相串 */
    var memo = memAll[furn.uid] || { dx:0, dy:0, scSit:null, rot:0, flip:0, z:0.013 };
    if (memo.scSit != null) who.scSit = memo.scSit;
    who.rotSit = memo.rot || 0;
    who.flipSit = memo.flip || 0;
    /* 先走到家具跟前，再坐上去（坐的位置由家具几何算，不是死坐标） */
    who.pose = 'walk'; who.seatUid = null;
    var sp0 = seatPosOf(furn, who);
    var standX = sp0.x, standY = Math.min(0.97, sp0.y + 0.07);
    beginMove(who, standX, standY, function(){
      var sp = seatPosOf(furn, who);
      who.x = sp.x + (memo.dx || 0);
      who.y = sp.y + (memo.dy || 0);
      who.z = furn.y + (memo.z != null ? memo.z : 0.013);
      who.pose = 'sit'; who.seatUid = furn.uid;
      render(); save();
    });
    render();
    return;
  }

  /* 走到点的位置 */
  var tx = Math.max(0.03, Math.min(0.97, fx));
  var floorMin = wallBaseAt(tx) + 0.035;          /* 别站到墙上 */
  var ty = Math.max(floorMin, Math.min(0.97, fy));
  var rv = resolveWalkTarget(tx, ty);             /* 也别走进家具里 */
  tx = rv.x; ty = Math.max(floorMin, rv.y);
  who.pose = 'walk';
  who.seatUid = null; who.z = null;
  beginMove(who, tx, ty, function(){ who.pose = 'idle'; render(); });
  render();
}

function activePpl(){
  for (var i=0;i<state.items.length;i++){
    if (state.items[i].key === state.active) return state.items[i];
  }
  return null;
}

function nearestPpl(x, y){
  var best = null, bd = 1e9;
  state.items.forEach(function(it){
    if (!isPpl(it.key)) return;
    var d = Math.abs(it.x - x) + Math.abs(it.y - y) * 0.6;
    if (d < bd){ bd = d; best = it; }
  });
  return best;
}

function beginMove(it, tx, ty, after){
  it.flip = (tx < it.x) ? 1 : 0;
  moves[it.uid] = {tx:tx, ty:ty, after:after};
}

function stepMoves(dt){
  var any = false;
  Object.keys(moves).forEach(function(uid){
    var it = null;
    state.items.forEach(function(o){ if (o.uid === uid) it = o; });
    if (!it){ delete moves[uid]; return; }
    var m = moves[uid];
    var dx = m.tx - it.x, dy = m.ty - it.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    var _s = state.stats || { hp:100, spirit:100 };
    var _fat = 0.55 + 0.45 * Math.min(1, _s.hp/100) * (0.7 + 0.3 * Math.min(1, _s.spirit/100));
    var sp = 0.34 * (state.speed || 1) * dt * _fat;   /* 体力/精神低 → 走得慢 */
    if (d <= sp){
      it.x = m.tx; it.y = m.ty;
      delete moves[uid];
      if (m.after) m.after();
      any = true;
    } else {
      var nx = it.x + dx / d * sp;
      var ny = it.y + dy / d * sp;
      var sl = slideOut(nx, ny);
      ny = Math.max(wallBaseAt(sl.x) + 0.03, sl.y);
      it.x = sl.x; it.y = ny;
      any = true;
      /* 卡住了就收工，别原地抽搐 */
      if (Math.abs(it.x - (m.px == null ? it.x : m.px)) < 0.0002 &&
          Math.abs(it.y - (m.py == null ? it.y : m.py)) < 0.0002){
        m.stuck = (m.stuck || 0) + 1;
        if (m.stuck > 8){ delete moves[uid]; if (m.after) m.after(); }
      } else { m.stuck = 0; }
      m.px = it.x; m.py = it.y;
    }
  });
  return any;
}

/* ---------- 帧循环 ---------- */
var lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt = lastT ? Math.min(0.05, (ts - lastT) / 1000) : 0;
  lastT = ts;
  var moving = stepMoves(dt);
  if (ts - lastTick > 175 / (state.speed || 1)){
    lastTick = ts; walkT++;
  }
  var hasWalk = state.items.some(function(i){ return i.pose === 'walk' && framesOf(i) > 1; });
  if (moving || hasWalk || state.weather === 'rain') render();
}

/* ---------- 工具条（编辑模式） ---------- */
var tools = document.getElementById('tools');
function showTools(){ tools.classList.add('on');  syncTools(); }
function hideTools(){ tools.classList.remove('on');  }
function syncTools(){
  var it = state.items[sel]; if (!it) return;
  var seatBtn = tools.querySelector('[data-act="seat"]');
  var leanBtn = tools.querySelector('[data-act="lean"]');
  var pct = tools.querySelector('#pct');
  seatBtn.style.display = (isPpl(it.key) && it.pose === 'sit') ? '' : 'none';
  leanBtn.style.display = isFlat(it.key) ? '' : 'none';
  leanBtn.textContent = '斜 ' + Math.round((it.lean || 0) * 100) + '%';
  pct.textContent = Math.round(scaleOf(it) * 100) + '%';
}

/* 坐面高度：用"家具顶 + 家具高 × seatY + 人高 × 0.38"算出来 */
function hForPose(who, pose, yAt){
  var im = imgOf(who); if (!im) return 0;
  var p = pplOf(who.key);
  var src = (pose === 'sit' && p && p.sit) ? p.sit : (p && p.walk && pose === 'walk' ? p.walk : (p ? p.idle : null));
  var im2 = src ? imgs[src] : im; if (!im2) return 0;
  var nf = (pose === 'walk' && p && p.frames) ? p.frames : 1;
  var fw = im2.width / nf;
  var yy = (yAt != null) ? yAt : who.y;
  var k = state.depth ? mScale(yy)/mScale(who.y0) : 1;
  var w = who.w * scaleOf(who) * k * W;
  return w * im2.height / fw;
}
function seatPosOf(furn, who){
  var fd = dims(furn); if (!fd) return null;
  var topY = furn.y * H - fd.h;
  var sy = (SEATY[furn.key] != null) ? SEATY[furn.key] : 0.68;
  var seatLine = topY + fd.h * sy;
  var ch = hForPose(who, 'sit', furn.y - 0.02);   /* 用家具的深度算身高，跟人当前站哪无关 */
  return { x: furn.x + (SEATDX[furn.key] || 0),
           y: (seatLine + ch * 0.38) / H };
}

function furnitureUnder(it){
  var best = null, bd = 1e9;
  state.items.forEach(function(f){
    var cf = catOf(f.key); if (!cf || cf.flat || !cf.seatable) return;
    if (f.y < it.y - 0.01) return;
    var d = Math.abs(f.x - it.x) + Math.abs(f.y - it.y) * 0.6;
    if (d < bd){ bd = d; best = f; }
  });
  return (bd < 0.22) ? best : null;
}

function refreshSeatZ(){
  state.items.forEach(function(it){
    if (!isPpl(it.key) || it.pose !== 'sit') return;
    var f = it.seatUid ? state.items.filter(function(o){ return o.uid === it.seatUid; })[0] : furnitureUnder(it);
    var base = Math.max(it.y, f ? f.y : it.y);
    it.z = +(base + 0.013).toFixed(4);
    if (f && !it.seatUid) it.seatUid = f.uid;
  });
}

tools.addEventListener('click', function(e){
  var act = e.target.getAttribute('data-act'); if (!act || sel < 0) return;
  var it = state.items[sel];
  var seated = (it.pose === 'sit');
  if (act === 'flip'){
    if (seated) it.flipSit = effFlip(it) ? 0 : 1;
    else it.flip = it.flip ? 0 : 1;
  }
  if (act === 'rotl' || act === 'rotr'){
    var dv = (act === 'rotl') ? -5 : 5;
    if (seated) it.rotSit = Math.max(-20, Math.min(20, (it.rotSit || 0) + dv));
    else it.rot = Math.max(-20, Math.min(20, (it.rot || 0) + dv));
  }
  if (act === 'big' || act === 'small'){
    var d = (act === 'big') ? 1.05 : (1/1.05);
    if (it.pose === 'sit') it.scSit = Math.min(2.2, Math.max(0.45, +((it.scSit || it.sc) * d).toFixed(3)));
    else it.sc = Math.min(2.2, Math.max(0.45, +((it.sc || 1) * d).toFixed(3)));
  }
  if (act === 'dup'){
    var c2 = clone(it); c2.uid = newUid(); delete c2.seatUid;
    c2.x = Math.min(0.96, it.x + 0.07); c2.y = Math.min(0.98, it.y + 0.03);
    state.items.push(c2); sel = state.items.length - 1;
  }
  if (act === 'del'){
    var gone = state.items[sel];
    if (gone && shopOf(gone.key)){
      state.bag[gone.key] = (state.bag[gone.key] || 0) + 1;   /* 道具收回背包，不消失 */
      toast('已收进背包');
    }
    state.items.splice(sel, 1); sel = -1; hideTools(); render(); save();
  }
  if (act === 'lean'){
    var lv = [0, 0.1, 0.2, 0.3, -0.1, -0.2];
    var cur = it.lean || 0, i0 = lv.indexOf(+cur.toFixed(2));
    it.lean = lv[(i0 < 0 ? 0 : i0 + 1) % lv.length];
  }
  if (act === 'seat'){
    /* 优先用「她当前正坐着的那件」 —— 拖动时哪怕靠近了沙发，也不会记错 */
    var byUid = null;
    if (it.seatUid){
      byUid = state.items.filter(function(o){ return o.uid === it.seatUid; })[0] || null;
      if (byUid && !(catOf(byUid.key) && catOf(byUid.key).seatable)) byUid = null;
    }
    var f = byUid || furnitureUnder(it);
    if (!f){ alert('没找到人物下面的家具 —— 先把人挪到沙发上再点「记住座位」'); return; }
    it.seatUid = f.uid;
    var sp = seatPosOf(f, it);
    var memAll = state.seatMem[it.key] || (state.seatMem[it.key] = {});
    memAll[f.uid] = { onKey: f.key,
                      dx: +(it.x - sp.x).toFixed(4), dy: +(it.y - sp.y).toFixed(4),
                      scSit: (it.scSit || it.sc), z: +(it.z - f.y).toFixed(4),
                      flip: effFlip(it), rot: effRot(it) };
    refreshSeatZ(); save();
    var btn = e.target; btn.textContent = '已记住';
    setTimeout(function(){ btn.textContent = '记住座位'; }, 900);
  }
  if (it.pose === 'sit' && (act === 'rotl' || act === 'rotr' || act === 'flip')) autoRememberSeat();
  render(); syncTools(); save();
});

var tray = document.getElementById('tray');

var ti = 1;
/* ★ 房间自己的钟：自然流逝（不跟手机时间）
     1 真实分钟 = 6 游戏分钟 → 1 游戏小时 = 10 真实分钟，一个游戏日约 4 小时。
     关掉 App 也会继续走，但最多补 6 小时（免得回来是三天以后）。 */
var CLOCK_SPEED = 12;                /* 游戏分钟 / 真实分钟（1 游戏小时 = 5 真实分钟，一天约 2 小时） */
var CLOCK_CAP_MIN = 720;             /* 离线最多补 12 游戏小时（按新流速 ≈ 1 真实小时） */
function clockTick(){
  var now = Date.now();
  var at = state.clockAt || now;
  var realMin = Math.min(720, (now - at) / 60000);
  if (realMin > 0.02){
    state.clockAt = at + realMin * 60000;
    state.time = (state.time + realMin * CLOCK_SPEED / 60) % 24;   /* 分钟→小时 */
    try{ save(); }catch(e){}
    try{ render(); }catch(e){}
  }
  syncEnv();
}
function clockCatchUp(){
  var now = Date.now();
  var at = state.clockAt || now;
  var realMin = Math.min(CLOCK_CAP_MIN / CLOCK_SPEED, (now - at) / 60000);
  if (realMin > 1){
    state.time = (state.time + realMin * CLOCK_SPEED / 60) % 24;
    state.clockAt = now;
  } else {
    state.clockAt = now;
  }
  syncEnv();
}

/* ★ 6.09：家园这边一改钱（买/卖/事件）就打个「自己刚动过」的标记，
   save() 才不会把外部（星露谷）刚写进来的新值当成旧值覆盖掉。 */
function goldTouch(){ try{ state._goldDirty = Date.now(); }catch(e){} }
function save(){
  /* ★ 6.03：家园花掉/捡到的钱写回 te_gold，星露谷那边会同步。
     ★ 6.09：以前这里每 15 秒无条件写一次 —— 内存里的旧值会把星露谷赚的钱抹掉
     （实测：改成 1000，16 秒后变回 500）。现在按 te_gold_at 时间戳对账：
       · 外部比我们新、且我们自己没刚改过钱 → 先采纳外部的值，不写回；
       · 我们自己刚改过 → 以自己的值为准，写回并更新时间戳。 */
  try{
    var _extAt = Number(localStorage.getItem('te_gold_at') || 0) || 0;
    var _mineAt = state._goldAt || 0;
    var _dirty = state._goldDirty && state._goldDirty > _mineAt;
    var _extRaw = localStorage.getItem('te_gold');
    var _ext = (_extRaw == null) ? null : Number(_extRaw);
    if(_extAt > _mineAt && !_dirty && isFinite(_ext) && _ext >= 0){
      state.coins = Math.round(_ext);          /* 采纳星露谷那边的新值 */
    }
    if(_dirty || _extAt <= _mineAt || _ext == null){
      state._goldAt = Date.now();
      localStorage.setItem('te_gold', String(Math.max(0, Math.round(state.coins|0))));
      localStorage.setItem('te_gold_at', String(state._goldAt));
    }
    state._goldDirty = 0;
  }catch(e){}
  try { localStorage.setItem(LS, JSON.stringify({v:4, depth:state.depth, items:state.items, seatMem:state.seatMem, mode:state.mode, active:state.active, speed:state.speed, time:state.time, weather:state.weather, fit:state.fit, coins:state.coins, bag:state.bag, stats:state.stats, statAt:state.statAt, ev:state.ev, evAt:state.evAt, clockAt:state.clockAt})); } catch(e){}
}

/* 买完直接摆：优先落在矮边柜前面，撞了就依次往左挪；都撞就放画面中间偏下 */
function placeBought(it){
  var sb = null;
  state.items.forEach(function(o){ if (o.key === 'sideboard') sb = o; });
  /* 落点直接选"地板中间一圈"：矮边柜前面太靠右、又会被底部家具托盘挡住 */
  var tries = [[0.46, 0.74], [0.38, 0.76], [0.54, 0.76], [0.30, 0.78],
               [0.62, 0.78], [0.46, 0.80], [0.22, 0.80], [0.70, 0.80]];
  var x = tries[0][0], y = tries[0][1];
  for (var i = 0; i < tries.length; i++){
    var c = tries[i], bad = false;
    state.items.forEach(function(o){
      if (Math.abs(o.x - c[0]) < 0.045 && Math.abs(o.y - c[1]) < 0.05) bad = true;
    });
    if (!bad){ x = c[0]; y = c[1]; break; }
  }
  state.items.push({ key:it.key, x:x, y:y, y0:y, uid:'u'+(uidSeq++), sc:1, rot:0, flip:0,
                     w:METERS[it.key] * mScale(y) });
  sel = state.items.length - 1;

function takeOut(k){

  state.bag[k]--; if(state.bag[k]<=0) delete state.bag[k];
  var sb=null; state.items.forEach(function(o){ if(o.key==='sideboard') sb=o; });
  var x = sb ? Math.max(0.05,Math.min(0.95, sb.x+0.06)) : 0.5;
  var y = sb ? Math.min(0.96, sb.y+0.10) : 0.8;
  state.items.push({ key:k, x:x, y:y, y0:y, uid:'u'+(uidSeq++), sc:1, rot:0, flip:0, w:METERS[k]*mScale(y) });
  sel=state.items.length-1;
  render(); save(); renderShop();
  toast('「'+it.name+'」拿出来了，拖一下就能摆');
}

var LIGHT_KEYS2 = { 'p-candle':1,'p-longcandle':1,'p-nightmoon':1,'p-lamp':1,'p-eyeball':1,'p-glowmush':1 };
function _clamp(v){ return Math.max(0, Math.min(100, v)); }
function statEl(){

  var top = document.getElementById('top'); if (!top) return null;

  el.id = 'teStats';

  if (pill) top.insertBefore(el, pill); else top.appendChild(el);

function paintStats(){
  var el = statEl(); if (!el) return;
  var s = state.stats || {hp:100,food:100,spirit:100,mood:100};
  function bar(lab, v, col){
    return '<span style="display:inline-flex;align-items:center;gap:3px">'
      + '<i style="font-style:normal;color:#a08a78">' + lab + '</i>'
      + '<b style="display:inline-block;width:24px;height:4px;border-radius:2px;background:rgba(120,100,86,.16);overflow:hidden">'
      + '<u style="display:block;height:100%;width:' + Math.round(v) + '%;background:' + col + '"></u></b></span>';
  }
  var tags = critTags();
  el.innerHTML = bar('体', s.hp, '#9fb7c9') + bar('饱', s.food, '#e2c08a')
    + bar('神', s.spirit, '#b7a8d4') + bar('心', s.mood, '#e3a5b5')
    + (tags.length ? '<span style="margin-left:2px;color:#c06a5e">· ' + tags.join(' · ') + '</span>' : '')
    + '<span style="margin-left:2px;color:#a08a78">🪙' + state.coins + '</span>';
}
function warnStats(){
  var s = state.stats; if (!s) return;
  state.statWarn = state.statWarn || {};
  var w = state.statWarn;
  if (s.food < 30 && !w.food){ w.food = 1; try{ toast('她有点饿了 · 点食物喂她'); }catch(e){} }
  if (s.food >= 45) w.food = 0;
  if (s.spirit < 25 && !w.spirit){ w.spirit = 1; try{ toast('她看起来没精神 · 该睡了'); }catch(e){} }
  if (s.spirit >= 45) w.spirit = 0;
  if (s.mood < 25 && !w.mood){ w.mood = 1; try{ toast('她心情不太好 · 点支蜡烛/放首歌'); }catch(e){} }
  if (s.mood >= 45) w.mood = 0;
  if (s.hp < 20 && !w.hp){ w.hp = 1; try{ toast('她走不动了 · 让她坐下或吃点东西'); }catch(e){} }
  if (s.hp >= 40) w.hp = 0;
}
function tickStats(){
  var s = state.stats; if (!s) return;
  var now = Date.now(), at = state.statAt || now;
  /* ★ 离线衰减封顶：最多按 2 小时算（以前 12 小时会把四条全扣光 → "全累垮了"） */
  var mins = Math.min(120, (now - at) / 60000);
  var steps = Math.floor(mins / 10);
  if (steps > 0){
    state.statAt = at + steps * 10 * 60000;
    s.food = Math.max(8, _clamp(s.food - steps * 1.5));
    s.spirit = Math.max(8, _clamp(s.spirit - steps * 1));
    if (s.food < 30) s.mood = _clamp(s.mood - steps * 1);
    if (s.food <= 0)  s.hp   = _clamp(s.hp   - steps * 2);
    if (s.spirit < 20) s.hp = _clamp(s.hp - steps * 1);
    if (s.mood < 20) s.spirit = _clamp(s.spirit - steps * 0.5);
    warnStats();
    try{ save(); }catch(e){}
  }
  paintStats();
}
function eatFood(it){
  var st = state.stats;
  var hungry = (st.food || 0) < 30;
  var gain = hungry ? 18 : 12;                       /* 饿的时候吃得更多 */
  var f = gainFactor();
  st.food = _clamp(st.food + gain * f);
  st.mood = _clamp(st.mood + 3 * f);
  st.hp   = _clamp(st.hp + (hungry ? 4 : 2) * f);
  state.statWarn = state.statWarn || {}; state.statWarn.food = 0;
  var nm = (catOf(it.key) || {}).name || '它';
  var i = state.items.indexOf(it);
  if (i >= 0) state.items.splice(i, 1);
  sel = -1;
  render(); paintStats(); save();
  try{ toast('她吃掉了「' + nm + '」 · 饱腹 +' + Math.round(gain*f) + ' · 心情 +' + Math.round(3*f) + (hungry ? '（饿了，吃得多）' : '') + (f < 1 ? '（状态差，收益减半）' : (f > 1 ? '（心情好，收益×1.5）' : ''))); }catch(e){}
}
function toggleLight(it){
  it.lit = !it.lit;
  if (it.lit){
    var st = state.stats;
    st.mood = _clamp(st.mood + 1);
    st.spirit = _clamp(st.spirit + 1);
    try{ toast('点上了「' + ((catOf(it.key) || {}).name || '灯') + '」'); }catch(e){}
  }
  render(); paintStats(); save();
}
setInterval(function(){ try{ tickStats(); }catch(e){} }, 30000);


/* ============================================================================
   随机事件 · 停电
   · 真实时间每小时最多一次；进房间时判一次，人在房间里每 5 分钟再判一次
   · 停电期间：整屋压暗，只有「点亮的蜡烛/灯」能照亮（点灯 = 唯一的解）
   · 点亮任意一盏 → 45 秒后来电；不点则最多 3 分钟后自动恢复
   · 数值联动：停电瞬间心情 -3；点亮 +4；自然恢复 +2
   ========================================================================== */
var EV_GAP = 60 * 60 * 1000, EV_DUR = 180000, EV_FIX = 45000;
function litLights(){
  var out = [];
  state.items.forEach(function(it){ if (it.lit) out.push(it); });
  return out;
}
function evStart(force){
  var now = Date.now();
  if (!force){
    if (state.ev && state.ev.kind === 'blackout') return false;
    if (state.evAt && (now - state.evAt) < EV_GAP) return false;
  }
  state.ev = { kind:'blackout', at:now, endAt:now + EV_DUR, litAt:0 };
  state.evAt = now;
  var st = state.stats; if (st) st.mood = _clamp((st.mood || 0) - 3);
  paintStats(); save();
  try{ render(); }catch(e){}
  try{ toast('⚡ 停电了 · 点一支蜡烛/夜灯吧'); }catch(e){}
  return true;
}
function evStop(reason){
  if (!state.ev) return;
  var st = state.stats;
  if (st) st.mood = _clamp((st.mood || 0) + (reason === 'light' ? 4 : 2));
  state.ev = null;
  paintStats(); save();
  try{ render(); }catch(e){}
  try{ toast(reason === 'light' ? '有光了 · 电路好像也修好了' : '来电了'); }catch(e){}
}
function evTick(){
  var now = Date.now();
  if (state.ev && state.ev.kind === 'blackout'){
    if (litLights().length && !state.ev.litAt){
      state.ev.litAt = now;
      state.ev.endAt = Math.min(state.ev.endAt, now + EV_FIX);
      try{ render(); }catch(e){}
      try{ toast('有光了 · 45 秒后来电'); }catch(e){}
    }
    if (now >= state.ev.endAt) evStop(state.ev.litAt ? 'light' : 'auto');
  } else if (!force_no_ev && !(state.evAt && (now - state.evAt) < EV_GAP)){
    /* ★ 只在晚上停电：19:00 ~ 05:00（房间自己的钟） */
    var _hh = state.time || 12;
    if ((_hh >= 19 || _hh < 5) && Math.random() < 0.45) evStart();
  }
  /* 停电途中天亮了 → 自动恢复 */
  if (state.ev && state.ev.kind === 'blackout'){
    var _hh2 = state.time || 12;
    if (!(_hh2 >= 18.5 || _hh2 < 5.5)) evStop('auto');
  }
  evChip();
}
var force_no_ev = false;
function evChip(){
  var el = document.getElementById('teEv');
  if (!state.ev || state.ev.kind !== 'blackout'){
    if (el) el.style.display = 'none';
    return;
  }
  if (!el){
    el = document.createElement('div');
    el.id = 'teEv';
    el.style.cssText = 'position:fixed;left:7px;top:calc(env(safe-area-inset-top) + 30px);z-index:60;'
      + 'background:rgba(30,26,44,.86);color:#ffe2b0;border:1px solid rgba(255,214,140,.35);'
      + 'border-radius:9px;padding:3px 9px;font:10.5px/1.3 ui-sans-serif,system-ui,"PingFang SC",sans-serif;'
      + 'pointer-events:none';
    document.body.appendChild(el);
  }
  el.style.display = 'block';
  var left = Math.max(0, Math.ceil((state.ev.endAt - Date.now()) / 1000));
  el.textContent = '⚡ 停电中' + (state.ev.litAt ? ' · 有光' : ' · 点灯') + ' · ' + left + 's';
}
/* ---- 窗玻璃遮罩 + 夜景画布（只算一次） ---- */
var _winMaskCv = null, _nightCv = null;
function windowMask(){
  if (_winMaskCv) return _winMaskCv;
  if (!base) return null;
  var x0 = Math.round(0.480 * W), x1 = Math.round(0.800 * W);
  var y0 = 0, y1 = Math.round(0.385 * H);
  var mw = x1 - x0, mh = y1 - y0;
  var m = document.createElement('canvas'); m.width = W; m.height = H;
  var mx = m.getContext('2d');
  try {
    mx.drawImage(base, 0, 0);
    var img = mx.getImageData(x0, y0, mw, mh);
    var d = img.data;
    var out = mx.createImageData(mw, mh);
    for (var i = 0; i < d.length; i += 4){
      var r = d[i], g = d[i+1], b = d[i+2];
      var lum = 0.3*r + 0.59*g + 0.11*b;
      var white = (r > 232 && g > 232 && b > 228);      /* 窗框/窗格：排除 */
      var dark  = (lum < 95);                            /* 窗帘暗部：排除 */
      var keep = (!white) && (!dark) && (lum > 110);
      out.data[i] = 255; out.data[i+1] = 255; out.data[i+2] = 255;
      out.data[i+3] = keep ? 255 : 0;
    }
    mx.putImageData(out, x0, y0);
  } catch(e){ return null; }
  /* 边缘柔一点 */
  var m2 = document.createElement('canvas'); m2.width = W; m2.height = H;
  var m2x = m2.getContext('2d');
  m2x.filter = 'blur(5px)';
  m2x.drawImage(m, 0, 0);
  m2x.filter = 'none';
  _winMaskCv = m2;
  return m2;
}
function nightWindowCanvas(){
  if (_nightCv) return _nightCv;
  var mask = windowMask(); if (!mask) return null;
  var c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d');

  /* 夜空：上深下浅（低处被室内暖光映到，所以偏暖一点） */
  var g = x.createLinearGradient(0, 0, 0, H * 0.39);
  g.addColorStop(0,    'rgb(30,40,80)');
  g.addColorStop(0.45, 'rgb(42,52,94)');
  g.addColorStop(0.78, 'rgb(62,62,96)');
  g.addColorStop(1,    'rgb(86,74,92)');
  x.fillStyle = g;
  x.fillRect(0, 0, W, H * 0.40);

  /* 玻璃上的一道暖反光 */
  var rf = x.createLinearGradient(0.5*W, 0.36*H, 0.80*W, 0.02*H);
  rf.addColorStop(0,   'rgba(255,200,150,0)');
  rf.addColorStop(0.45,'rgba(255,204,156,0.16)');
  rf.addColorStop(0.62,'rgba(255,210,166,0.10)');
  rf.addColorStop(1,   'rgba(255,200,150,0)');
  x.fillStyle = rf;
  x.fillRect(0.48*W, 0, 0.34*W, 0.40*H);

  /* 星：固定位置，很小 */
  var stars = [[0.545,0.05],[0.585,0.12],[0.625,0.04],[0.665,0.10],[0.705,0.06],[0.745,0.13],[0.565,0.22],[0.640,0.25]];
  for (var i = 0; i < stars.length; i++){
    x.fillStyle = 'rgba(232,240,255,0.55)';
    x.beginPath(); x.arc(stars[i][0]*W, stars[i][1]*H, 2.2, 0, Math.PI*2); x.fill();
  }

  /* 用玻璃遮罩裁形 */
  x.globalCompositeOperation = 'destination-in';
  x.drawImage(mask, 0, 0);
  _nightCv = c;
  return c;
}
/* 停电光照：极淡版
   · 只是"稍微暗一点 + 一圈极淡的暖光"，不刺眼、不夸张
   · 没有火苗高光点（那种大光点太跳）
   · 每个亮着的灯 = 地上一圈极淡的暖环（中间透、边缘柔） */
function drawBlackout(){
  var ev = state.ev;
  if (!ev || ev.kind !== 'blackout') return;
  var now = Date.now();
  var rest = Math.max(0, ev.endAt - now);
  var fade = rest < 1600 ? (rest / 1600) : 1;
  var t = now / 1000;
  var DPR = view.dpr;
  var W1 = cv.width / DPR, H1 = cv.height / DPR;

  var lights = [];
  state.items.forEach(function(it){
    if (!it.lit) return;
    var d = dims(it); if (!d) return;
    var sx = view.ox + it.x * W * view.s;
    var fy = view.oy + it.y * H * view.s;
    var seed = (it.uid || '').length + (it.x * 97);
    var fl = 0.95 + 0.05 * Math.sin(t * 4.6 + seed);
    var isLamp = (it.key === 'p-lamp' || it.key === 'p-nightmoon');
    lights.push({ sx:sx, fy:fy, dh:d.h * view.s, fl:fl, lamp:isLamp });
  });

  /* ①.2 夜幕：从上往下的竖向渐变（占满整幅、没有边界）
         —— 窗户和上半墙面自然暗下去，地板不受影响，不会出现"一块" */
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  var nightTop = ctx.createLinearGradient(0, 0, 0, H1 * 0.66);
  nightTop.addColorStop(0,    'rgba(44,58,104,' + (0.62*fade).toFixed(3) + ')');
  nightTop.addColorStop(0.30, 'rgba(52,64,104,' + (0.46*fade).toFixed(3) + ')');
  nightTop.addColorStop(0.62, 'rgba(66,74,104,' + (0.24*fade).toFixed(3) + ')');
  nightTop.addColorStop(1,    'rgba(80,84,104,0)');
  ctx.fillStyle = nightTop;
  ctx.fillRect(0, 0, W1, H1);
  ctx.restore();

  /* ① 只压一层很淡的暖暗（不够黑是有意的：要"傍晚"而不是"深夜"） */
  var darkA = (0.05 - 0) * fade;   /* 夜景底图本身已经很暗很暖，这里几乎不再压 */
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(96,74,62,' + Math.max(0.10, darkA).toFixed(3) + ')';
  ctx.fillRect(0, 0, W1, H1);
  ctx.restore();

  /* ② 每个灯：地上一圈极淡的暖环 */
  ctx.save();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  lights.forEach(function(L){
    var R = Math.max(110, L.dh * (L.lamp ? 3.8 : 3.0));
    var jx = Math.sin(t * 2.1 + L.sx) * 1.5;
    ctx.save();
    ctx.translate(L.sx + jx, L.fy);
    ctx.scale(1, 0.50);
    var g = ctx.createRadialGradient(0, 0, R*0.10, 0, 0, R);
    g.addColorStop(0,    'rgba(255,206,150,0)');       /* 中间是透的 */
    g.addColorStop(0.32, 'rgba(255,204,148,' + (0.045*L.fl*fade).toFixed(3) + ')');
    g.addColorStop(0.60, 'rgba(255,200,142,' + (0.120*L.fl*fade).toFixed(3) + ')');
    g.addColorStop(0.78, 'rgba(255,196,136,' + (0.075*L.fl*fade).toFixed(3) + ')');
    g.addColorStop(1,    'rgba(255,192,132,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}
setInterval(function(){ try{ evTick(); }catch(e){} }, 5000);
setInterval(function(){ try{ evChip(); }catch(e){} }, 1000);


/* ============================================================================
   怪东西的用处（玩模式下点它触发，每件独立冷却）
     p-sock     单只袜子      心情 +4（她说"这只袜子不是我的"）
     p-top      小陀螺        精神 +5（盯着转，放空一会儿）
     p-stone    会呼吸的石头  体力 +6（抱着它静一会儿）
     p-eyeball  玻璃眼球      停电时能亮：一圈冷光；平时点 → 心情 +1
     p-glowmush 发光蘑菇      停电时能亮：暖光；点 → 精神 +2
     p-jarfish  罐子里的鱼    敲一下吐泡泡，掉 1~5 金币（10 分钟）
     p-doorlet  袖珍小门      敲三下，门后塞出 4~9 金币（30 分钟）
     p-coffin   迷你小棺材    开盖抽一张纸条，心情 +3（1 小时）
   ========================================================================== */
var ODD_CD = { 'p-sock':60e3, 'p-top':60e3, 'p-stone':90e3, 'p-eyeball':60e3,
               'p-glowmush':60e3, 'p-jarfish':600e3, 'p-doorlet':1800e3, 'p-coffin':3600e3 };
var COFFIN_NOTES = [
  '里面是空的 —— 除了一点凉气。',
  '一张纸条：「别熬夜。」',
  '一张纸条：「今天的你也很努力。」',
  '一张纸条：「冰箱里有牛奶。」',
  '一张纸条：「想一起去海边。」',
  '一枚旧硬币滚了出来。',
  '纸条上画了一只歪歪扭扭的猫。'
];
function useOdd(it){
  var now = Date.now();
  var cd = ODD_CD[it.key] || 60000;
  if (it.cdAt && (now - it.cdAt) < cd){
    var left = Math.ceil((cd - (now - it.cdAt)) / 1000);
    try{ toast('还不行 · 再等 ' + left + ' 秒'); }catch(e){}
    return false;
  }
  var st = state.stats;
  var msg = '';
  var why = refuseWhy(it.key);
  if (why){ try{ toast(why); }catch(e){} it.cdAt = now; return false; }
  var f = gainFactor();
  switch (it.key){
    case 'p-sock':
      st.mood = _clamp(st.mood + 4 * f);
      msg = '她拎起袜子："这不是我的。" · 心情 +4'; break;
    case 'p-top':
      st.spirit = _clamp(st.spirit + 5 * f);
      msg = '陀螺转起来了，她盯着看了一会儿 · 精神 +5'; break;
    case 'p-stone':
      st.hp = _clamp(st.hp + 6 * f);
      msg = '她把石头抱在怀里，慢慢安静下来 · 体力 +6'; break;
    case 'p-eyeball':
      if (state.ev && state.ev.kind === 'blackout'){
        it.lit = !it.lit; msg = it.lit ? '玻璃眼球亮起一圈冷光' : '眼球暗了下去';
      } else {
        st.mood = _clamp(st.mood + 1);
        msg = '眼球跟着她转了一下 · 心情 +1';
      }
      break;
    case 'p-glowmush':
      if (state.ev && state.ev.kind === 'blackout'){
        it.lit = !it.lit; msg = it.lit ? '发光蘑菇亮起来了' : '蘑菇的光熄了';
      } else {
        st.spirit = _clamp(st.spirit + 2);
        msg = '她戳了戳蘑菇，指尖亮了一下 · 精神 +2';
      }
      break;
    case 'p-jarfish': {
      var c1 = 1 + Math.floor(Math.random() * 5);
      goldTouch();
      state.coins += c1;
      st.mood = _clamp(st.mood + 1);
      msg = '鱼吐了个泡泡，里面是 ' + c1 + ' 枚硬币 · 心情 +1'; break;
    }
    case 'p-doorlet': {
      var c2 = 4 + Math.floor(Math.random() * 6);
      goldTouch();
      state.coins += c2;
      st.spirit = _clamp(st.spirit + 2 * f);
      msg = '她敲了三下，门缝里塞出 ' + c2 + ' 枚硬币 · 精神 +2'; break;
    }
    case 'p-coffin': {
      st.mood = _clamp(st.mood + 3 * f);
      msg = COFFIN_NOTES[Math.floor(Math.random() * COFFIN_NOTES.length)] + ' · 心情 +3'; break;
    }
    default: return false;
  }
  it.cdAt = now;
  paintStats(); render(); save();
  try{ toast(msg); }catch(e){}
  return true;
}


/* ============================================================================
   数值条的作用（不用"走路速度"那种看不见的东西，全是**能不能做 / 收益多少 / 明确反馈**）
     体力 hp   <20  → "累垮了"：抱石头、玩陀螺这类费力的直接拒绝
              <15  → 生病（状态条上挂"病了"），所有互动收益 ×0.5，吃东西也只回一半
     饱腹 food <30  → "饿了"：吃东西收益 ×1.5；但心情每 10 分钟继续掉
              0    → 体力每 10 分钟再掉 2
     精神 spirit<25 → "走神"：书堆、唱片机、陀螺、小门 全部拒绝（"她看不进去"）
     心情 mood <25  → "不高兴"：所有互动收益 ×0.5，台词变冷淡
              >75  → "心情很好"：所有互动收益 ×1.5
   ========================================================================== */
var ODD_EFFORT = { 'p-stone':1, 'p-top':1 };           /* 费体力的 */
var ODD_FOCUS  = { 'p-top':1, 'p-doorlet':1 };         /* 要专注的：精神低时用不了 */
function sickNow(){ return (state.stats.hp || 0) < 15; }
function critTags(){
  var s = state.stats, t = [];
  if (sickNow()) t.push('病了');
  if ((s.hp||0) < 20) t.push('累垮了');
  if ((s.food||0) < 30) t.push('饿了');
  if ((s.spirit||0) < 25) t.push('走神');
  if ((s.mood||0) < 25) t.push('不高兴');
  else if ((s.mood||0) > 75) t.push('心情很好');
  return t;
}
function gainFactor(){
  var s = state.stats, f = 1;
  if ((s.mood||0) < 25) f *= 0.5;
  else if ((s.mood||0) > 75) f *= 1.5;
  if (sickNow()) f *= 0.5;
  return f;
}
/* 返回 null = 可以做；否则返回拒绝的台词 */
function refuseWhy(kind){
  var s = state.stats;
  if ((s.mood||0) < 12) return '她现在不太想理人';
  if (ODD_EFFORT[kind] && (s.hp||0) < 20) return '她累得抬不起手';
  if ((ODD_FOCUS[kind] || kind === 'focus') && (s.spirit||0) < 25) return '她走神了，看不进去';
  return null;
}
function fmtGain(v){ return Math.round(v * 10) / 10; }
function applyGain(obj){
  var f = gainFactor(), s = state.stats;
  Object.keys(obj).forEach(function(k){ s[k] = _clamp((s[k]||0) + obj[k] * f); });
  return f;
}


/* ---- 药物 / 花朵 的用处 ---- */
var MED_USE = {
  'p-pill':    { hp:18, cure:1, note:'吃了感冒药' },
  'p-bandage': { hp:8,           note:'贴上创可贴' },
  'p-syrup':   { hp:14, spirit:4, note:'喝了止咳糖浆' },
  'p-vitamin': { hp:10, mood:2,   note:'吃了维生素' },
  'p-herb':    { hp:6,  spirit:3, note:'嚼了点药草' }
};
var FLOWER_USE = {
  'p-daisy':     { mood:6 },
  'p-tulip':     { mood:8 },
  'p-rose':      { mood:10 },
  'p-sunflower': { mood:7 },
  'p-dryflower': { mood:5, spirit:2 }
};
function useMed(it){
  var m = MED_USE[it.key]; if (!m) return false;
  var s = state.stats;
  var wasSick = (s.hp || 0) < 15;
  s.hp = _clamp((s.hp || 0) + (m.hp || 0) * (wasSick ? 1.6 : 1));   /* 病着吃药更管用 */
  if (m.spirit) s.spirit = _clamp((s.spirit || 0) + m.spirit);
  if (m.mood)   s.mood   = _clamp((s.mood || 0) + m.mood);
  if ((m.cure && wasSick) || s.hp >= 40){ /* 体力回到 40 以上就算好了 */ }
  var nm = (catOf(it.key) || {}).name || '药';
  var i = state.items.indexOf(it);
  if (i >= 0) state.items.splice(i, 1);                  /* 药是一次性的 */
  sel = -1;
  paintStats(); render(); save();
  var msg = '她' + m.note + ' · 体力 +' + Math.round((m.hp || 0) * (wasSick ? 1.6 : 1));
  if (wasSick && m.cure) msg += ' · 病好了些';
  if (m.spirit) msg += ' · 精神 +' + m.spirit;
  if (m.mood) msg += ' · 心情 +' + m.mood;
  try{ toast(msg); }catch(e){}
  return true;
}
function useFlower(it){
  var f = FLOWER_USE[it.key]; if (!f) return false;
  var s = state.stats;
  var sadBonus = (s.mood || 0) < 25 ? 1.5 : 1;           /* 不高兴的时候花更管用 */
  s.mood = _clamp((s.mood || 0) + (f.mood || 0) * sadBonus);
  if (f.spirit) s.spirit = _clamp((s.spirit || 0) + f.spirit);
  var nm = (catOf(it.key) || {}).name || '花';
  it.flowered = true;                                    /* 留在房间里当插花 */
  paintStats(); render(); save();
  try{ toast('她把「' + nm + '」插进了花瓶 · 心情 +' + Math.round((f.mood || 0) * sadBonus) + (sadBonus > 1 ? '（她不开心，花更管用）' : '')); }catch(e){}
  return true;
}


/* ============================================================================
   AI 工具调用的入口（父页 postMessage 过来）
     ed:cmd  {op, who, x, y, item, n}
       walk   走过去（x/y 是 0~1 的房间坐标）        who: her|me（默认当前人物）
       add    往房间放一件东西（item 写 key 或名字，如 plant / 小盆栽）
       remove 收起来（item 同上；不给就是最后一件）
       buy    在商城买一件并直接摆进房间（item 同上；钱不够会说）
       light  点亮/吹灭灯或蜡烛（item 同上；不给就找第一个能点的）
       sit    走到最近的座位坐下
   ========================================================================== */
function _findThing(keyOrName){
  if (!keyOrName) return null;
  var k = String(keyOrName).trim();
  var c = catOf(k); if (c) return c;
  for (var i = 0; i < CAT.length; i++){
    if (CAT[i].name === k) return CAT[i];
  }
  return null;
}
function homeCmd(d){
  var op = String(d.op || '').toLowerCase();
  var who = (activePpl() && (d.who === 'me' ? activePpl() : activePpl())) || null;
  var whoKey = (String(d.who || '').toLowerCase() === 'me') ? 'boy' : 'girl';
  var target = null;
  state.items.forEach(function(o){ if (o.key === whoKey) target = o; });
  if (!target) target = activePpl();
  var say = '';
  if (op === 'walk'){
    var x = Math.max(0.05, Math.min(0.95, parseFloat(d.x))); 
    var y = Math.max(0.45, Math.min(0.95, parseFloat(d.y == null ? 0.78 : d.y)));
    if (!target) return { ok:false, msg:'房间里没有人' };
    target.pose = 'walk';
    beginMove(target, x, y);
    say = '她走了过去';
  } else if (op === 'add'){
    var c = _findThing(d.item);
    if (!c) return { ok:false, msg:'没有这件东西：' + d.item };
    var ax = Math.max(0.08, Math.min(0.9, parseFloat(d.x == null ? 0.5 : d.x)));
    var ay = Math.max(0.55, Math.min(0.9, parseFloat(d.y == null ? 0.76 : d.y)));
    state.items.push({ key:c.key, x:ax, y:ay, y0:ay, uid:'ai'+(uidSeq++), sc:1, rot:0, flip:0,
                       w:(METERS[c.key] || 0.15) * mScale(ay) });
    say = '添了一件「' + c.name + '」';
  } else if (op === 'remove'){
    var want = _findThing(d.item);
    var idx = -1;
    for (var i = state.items.length - 1; i >= 0; i--){
      if (want ? state.items[i].key === want.key : !isPpl(state.items[i].key)){ idx = i; break; }
    }
    if (idx < 0) return { ok:false, msg:'房间里没有可以收起来的东西' };
    var nm2 = (catOf(state.items[idx].key) || {}).name || state.items[idx].key;
    state.items.splice(idx, 1); sel = -1;
    say = '收起了「' + nm2 + '」';
  } else if (op === 'buy'){
    var it = null;
    for (var j = 0; j < SHOP.length; j++){
      if (SHOP[j].key === d.item || SHOP[j].name === String(d.item || '').trim()){ it = SHOP[j]; break; }
    }
    if (!it) return { ok:false, msg:'商城里没有「' + d.item + '」' };
    if (state.coins < it.price) return { ok:false, msg:'金币不够：' + it.name + ' 要 ' + it.price + '，现在只有 ' + state.coins };
    goldTouch();                                  /* ★ 6.09：自己改了钱才允许覆盖外部 */
    state.coins -= it.price;
    state.bag[it.key] = (state.bag[it.key] || 0) + 1;
    placeBought(it);
    say = '买了「' + it.name + '」，已经摆进房间';
  } else if (op === 'light'){
    var lt = null, wantL = _findThing(d.item);
    state.items.forEach(function(o){ if (o.lit) lt = o; });
    if (!lt){
      state.items.forEach(function(o){
        if (lt) return;
        if (LIGHT_KEYS2[o.key] && (!wantL || o.key === wantL.key)) lt = o;
      });
    }
    if (!lt) return { ok:false, msg:'房间里没有能点的灯或蜡烛' };
    lt.lit = !lt.lit;
    say = lt.lit ? '点亮了「' + ((catOf(lt.key) || {}).name || '灯') + '」' : '吹灭了灯';
  } else if (op === 'sit'){
    if (!target) return { ok:false, msg:'房间里没有人' };
    var seat = null, bd = 9;
    state.items.forEach(function(o){
      var c2 = catOf(o.key);
      if (c2 && c2.seatable){
        var dd = Math.abs(o.x - target.x) + Math.abs(o.y - target.y);
        if (dd < bd){ bd = dd; seat = o; }
      }
    });
    if (!seat) return { ok:false, msg:'房间没有能坐的家具' };
    beginMove(target, seat.x, seat.y + 0.06, function(){ target.pose = 'sit'; target.pose2 = 'sit'; });
    say = '坐下了';
  } else {
    return { ok:false, msg:'不认识的动作：' + op };
  }
  try{ paintStats(); }catch(e){}
  try{ render(); }catch(e){}
  try{ save(); }catch(e){}
  try{ if (say) toast(say); }catch(e){}
  return { ok:true, msg:say };
}
try{
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.t === 'ed:thumb'){
      /* 给父页一张商品缩略图：写实道具给图片路径，勾线道具现场画一张 dataURL */
      var img = '';
      try{
        var key = d.item || '';
        var it = null;
        for (var i = 0; i < SHOP.length; i++){
          if (SHOP[i].key === key || SHOP[i].name === String(key).trim()){ it = SHOP[i]; break; }
        }
        if (it){ img = it.src ? ('aset/home4/' + it.src) : (it.line ? lineThumb(it) : ''); }
        else {
          var c2 = _findThing(key);
          if (c2) img = c2.src ? ('aset/home4/' + c2.src) : '';
        }
      }catch(err){}
      try{ parent.postMessage({ t:'home:thumb', req:d.req || d.item || '', img:img }, '*'); }catch(err){}
      return;
    }
    if (d.t !== 'ed:cmd') return;
    var r = null;
    try{ r = homeCmd(d); }catch(err){ r = { ok:false, msg:String(err && err.message || err) }; }
    try{ parent.postMessage({ t:'home:done', op:d.op, ok:!!(r && r.ok), msg:(r && r.msg) || '', req:d.req || '' }, '*'); }catch(e2){}
  });
}catch(e){}

/* 分享商品到聊天：把 key / 名字 / 价格 / 图标一起发给父页 */
function shareItem(it, ev){
  try{ if (ev && ev.stopPropagation) ev.stopPropagation(); }catch(e){}
  var img = it.src ? ('aset/home4/' + it.src) : '';
  try{ if (!img && it.line) img = lineThumb(it); }catch(e){}
  try{ parent.postMessage({ t:'home:share', key:it.key, name:it.name, price:it.price, img:img }, '*'); }catch(e){}
  try{ toast('「' + it.name + '」分享到聊天了'); }catch(e){}
}

window.__d = {st:state, mv:moves, click:clickPlay, hit:hit, cat:catOf, dims:dims,
  shop:function(){openShop();}, bag:function(){shopView='bag';openShop();renderShop();},
  eat:eatFood, light:toggleLight, tick:tickStats, paint:paintStats, render:function(){render();},
  evStart:evStart, evStop:evStop, evTick:evTick, ev:function(){return state.ev;}, useOdd:useOdd, useMed:useMed, useFlower:useFlower, clock:clockTick, catchUp:clockCatchUp};
boot();
try{ paintStats(); }catch(e){}
try{ clockCatchUp(); }catch(e){}
try{ setTimeout(function(){ evTick(); }, 1200); }catch(e){}
try{ document.getElementById('btnBack').onclick=function(){ parent.postMessage({t:'home:leave'},'*'); }; }catch(e){}
})();
</script>
